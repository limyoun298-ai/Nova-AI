<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>NOVA AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NOVA AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#000000;--side:#111111;--surf:#1e1e1e;--txt:#f5f5f5;--mut:#a3a3a3;--ic:#c8c8c8;--acc:#4C8DF6;--usr:#303030;--usrt:#f5f5f5;--send:#fff;--sendi:#000;--fs:16px;--bd:rgba(255,255,255,.10);--lnk:#6AA3FF}
[data-mode=light]{--bg:#fff;--side:#f7f7f8;--surf:#f1f1f1;--txt:#111;--mut:#6b7280;--ic:#555;--bd:rgba(0,0,0,.1);--lnk:#2563EB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:var(--fs)/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
input,select{font:inherit;color:var(--txt)}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000}
#splash .lg{width:84px;height:84px;color:rgba(255,255,255,.86);animation:fin .7s ease both}
@keyframes fin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#app{display:none;flex-direction:column;height:100dvh;position:relative}
#app.on{display:flex}
#offb{display:none;background:#7f1d1d;color:#fff;text-align:center;font-size:13px;padding:5px}
#offb.on{display:block}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));min-height:88px}
header b{font-size:17px;font-weight:600;flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib0{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ic);flex:none;transition:background .15s}
.ib0:active{background:var(--bd)}
.ib0.sm{width:34px;height:34px}
#offers{height:64px;padding:0 22px;border-radius:34px;background:#303a43;color:#58a9ff;font-weight:650;font-size:16px;white-space:nowrap;flex:none}#htitle{display:none!important}
#cw{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
#down{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--bd);display:none;align-items:center;justify-content:center;color:var(--txt);box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:5}
#down.on{display:flex}
.home{flex:1 1 auto;margin:0 auto 8px;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;animation:rise .35s ease both;padding:0 18px 8px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hlogo{flex:1 1 auto;min-height:140px;display:flex;align-items:center;justify-content:center}
.hlogo .hl{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ECE9E1;opacity:.65;border:1.5px solid currentColor;box-shadow:none;filter:none;pointer-events:none;user-select:none;-webkit-user-select:none}
.hlogo .hl svg{width:92px;height:92px}
[data-mode=light] .hlogo .hl{color:#6F6C64}
.cards{display:flex;flex-direction:column;gap:24px;width:100%;padding:0 10px 12px}
.card{background:transparent;border:0;border-radius:12px;padding:4px 2px;display:flex;align-items:center;gap:18px;text-align:left;min-height:38px;transition:opacity .12s}
.card .ci0{color:#c8c8c8;margin:0;flex:none}
.card b{display:block;font-size:1em;font-weight:500}.card small{display:none}
.card:active{opacity:.7;transform:scale(.98)}
.row{display:flex;flex-direction:column;max-width:88%}
.row.user{align-self:flex-end;align-items:flex-end}
.row.bot{align-self:flex-start;align-items:flex-start;max-width:100%;width:100%}
.bubble{overflow-wrap:anywhere;max-width:100%}
.user .bubble{background:var(--usr);color:var(--usrt);padding:10px 14px;border-radius:20px;border-bottom-right-radius:6px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.user .t{white-space:pre-wrap}
.bot .bubble{background:none;color:var(--txt);padding:0;width:100%;line-height:1.65;letter-spacing:.005em}
.bubble p{margin:.5em 0}.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble h3,.bubble h4{margin:.9em 0 .35em;font-weight:700}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.3em}
.bubble li{margin:.15em 0}
.bubble code{background:rgba(127,127,127,.25);padding:1px 5px;border-radius:5px;font-size:.9em}
.bubble a{color:var(--lnk)}
.pic{display:block;width:min(70vw,300px);aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:rgba(127,127,127,.2);margin-bottom:6px}
.user .pic{aspect-ratio:auto;max-height:300px;width:auto;max-width:100%}
.fch{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:6px;opacity:.9}
.st{font-size:12px;color:var(--mut);margin-top:3px}
.st .retry{color:#f87171;text-decoration:underline}
.note{font-size:12px;color:var(--mut);margin-top:3px;max-width:260px;text-align:right}
.tw{overflow-x:auto;margin:.5em 0}
table{border-collapse:collapse;font-size:.92em}
th,td{border:1px solid var(--bd);padding:6px 10px;white-space:nowrap;text-align:left}
th{background:rgba(127,127,127,.2)}
.code{background:#0d1117;color:#e6edf3;border-radius:12px;margin:.6em 0;overflow:hidden}
.chead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 12px;background:#161b22;font-size:12px;color:#c9d1d9}
.ca{display:flex;gap:4px}
.ca button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:8px}
.ca button:active{background:rgba(255,255,255,.15)}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.45}
.code pre.col{max-height:170px;overflow-y:hidden}
.code pre code{background:none;padding:0;font-size:inherit;color:inherit}
.srcs{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13px}
.srcs a{color:var(--lnk);text-decoration:none}
.srcs small{color:var(--mut);display:block}
.acts{display:flex;gap:2px;margin-top:4px}
.acts button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ic);border-radius:50%}
.acts button.on{color:var(--acc)}
.ib{display:flex;gap:6px;margin-top:6px}
.ib button{width:36px;height:36px;border-radius:50%;background:rgba(127,127,127,.25);display:flex;align-items:center;justify-content:center}
.dots{display:inline-flex;gap:4px;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
.lbl{font-size:.92em;color:var(--mut)}
.pbar{height:3px;border-radius:3px;margin:8px 0;background:rgba(127,127,127,.25);overflow:hidden;position:relative}
.pbar:after{content:"";position:absolute;inset:0;width:40%;background:var(--acc);animation:sl 1.1s infinite}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.pcard{font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(127,127,127,.18);margin-top:4px}
.skel{width:min(70vw,300px);aspect-ratio:1/1;border-radius:14px;margin-top:8px;background:linear-gradient(110deg,rgba(127,127,127,.2) 30%,rgba(255,255,255,.25) 50%,rgba(127,127,127,.2) 70%);background-size:200% 100%;animation:sh 1.6s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err .bubble{color:#f87171}
.composer{margin:4px 16px calc(8px + env(safe-area-inset-bottom));background:#1e1e1e;border:1px solid rgba(255,255,255,.12);border-radius:32px;padding:6px;position:relative}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
#chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:14px;background:rgba(76,141,246,.18);color:var(--lnk)}
.chip button{display:flex;color:inherit}
.chip.th{padding:0;background:none;position:relative}
.chip.th img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:rgba(127,127,127,.3)}
.chip.th button{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#000;color:#fff;align-items:center;justify-content:center;border:1px solid #555}
.inrow{display:flex;align-items:flex-end;gap:2px}
textarea#inp{flex:1;background:none;border:0;outline:0;color:var(--txt);resize:none;font:inherit;caret-color:#0084FF;max-height:140px;padding:10px 6px;line-height:1.4}
textarea#inp::placeholder{color:var(--mut)}
.circ{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
#plus,#mic{color:var(--txt)}
#mic{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#mic.rec{animation:pu 1s infinite}
@keyframes pu{50%{opacity:.35}}
#mic:disabled{opacity:.35}
#send{background:var(--send);color:var(--sendi)}
#send:disabled{opacity:.3}
#voice{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:var(--surf);border-radius:16px;padding:10px 14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:14px}
#voice.on{display:block}
#voice.cx{color:#f87171}
#voice i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:8px;animation:pu 1s infinite}
#voice small{display:block;color:var(--mut);margin-top:2px}
#menu{position:absolute;left:6px;bottom:calc(100% + 8px);background:var(--surf);border:1px solid var(--bd);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:6px;display:none;min-width:220px;z-index:20}
#menu.on{display:block}
#menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;text-align:left}
#menu button:active{background:var(--bd)}
#menu button.act{color:var(--lnk)}
#drawer{position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility 0s .25s}
#drawer.on{visibility:visible;transition:none}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#drawer.on .scrim{opacity:1}
#drawer .panel{position:absolute;left:0;top:0;bottom:0;width:min(84vw,340px);background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);transform:translateX(-100%);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
#drawer.on .panel{transform:none}
.dtop{padding:10px 10px 4px;display:flex;align-items:center;gap:6px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:22px;padding:0 14px;color:var(--mut);min-width:0}
.sbox input{flex:1;background:none;border:0;outline:0;padding:11px 0;color:var(--txt);min-width:0}
.dnav{padding:6px 10px 2px}
.dbtn{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;width:100%;text-align:left}
.dbtn:active,.dbtn.act{background:var(--surf)}
#dsel.act{color:var(--acc)}
#dlist{flex:1;overflow-y:auto;padding:0 8px}
.sec{font-size:12px;color:var(--mut);margin:14px 8px 4px;letter-spacing:.3px}
.ci{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 12px;border-radius:12px;min-height:42px}
.ci.act{background:var(--surf)}
.ci:active{background:var(--surf)}
.ci .ct{flex:1;min-width:0}
.ci .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.ci small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;flex:none}
.cb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dfoot{padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
#page{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#page.on{display:flex}
#page header b{font-size:17px}
#pb{flex:1;overflow-y:auto;padding:14px;padding-bottom:40px}
.rowbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;background:var(--surf);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;text-align:left;gap:10px;transition:opacity .12s}
.rowbtn:active{opacity:.7}
.rowbtn .l{display:flex;align-items:center;gap:14px;min-width:0}
.rowbtn .l svg{flex:none;color:var(--ic)}
.rowbtn small{color:var(--mut)}
.rowbtn.red{color:#f87171}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;background:var(--surf);border:2px solid transparent;text-align:center}
.seg button.sel{border-color:var(--acc)}
.h{font-size:13px;color:var(--mut);margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border-radius:14px;padding:10px;background:var(--surf);border:2px solid transparent;text-align:center;font-size:13px}
.sw.sel{border-color:var(--acc)}
.sw i{display:block;height:34px;border-radius:9px;margin-bottom:6px}
.crow{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border-radius:14px;padding:10px 14px;margin-bottom:10px;gap:10px}
.crow input[type=color]{width:46px;height:34px;border:0;background:none;padding:0}
.lang{display:flex;justify-content:space-between;width:100%;padding:14px;background:var(--surf);border-radius:12px;margin-bottom:8px}
.lt{position:relative;background:var(--surf);border-radius:12px;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--mut)}
.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lt span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fl button{padding:7px 12px;border-radius:16px;background:var(--surf);font-size:13px}
.fl button.sel{background:var(--acc);color:#fff}
.inp2,.sel2{width:100%;background:var(--surf);border:0;border-radius:12px;padding:12px;outline:0;margin-bottom:10px}
textarea.inp2{min-height:110px;resize:vertical;font:inherit;caret-color:#0084FF}
.pri{background:var(--acc);color:#fff;border-radius:12px;padding:12px;width:100%;margin-bottom:10px;text-align:center}
.pri:disabled{opacity:.5}
.out{background:var(--surf);border-radius:12px;padding:12px;margin-bottom:10px}
.cdisp{background:var(--surf);border-radius:16px;padding:14px;text-align:right;margin-bottom:10px;min-height:84px}
.cdisp .e{font-size:22px;word-break:break-all;min-height:30px}
.cdisp .r{font-size:30px;font-weight:600;color:var(--acc)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{background:var(--surf);border-radius:14px;padding:16px 0;font-size:20px}
.kp button.op{color:var(--acc)}
.kp button.eq{background:var(--acc);color:#fff}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheetIn{width:100%;background:var(--surf);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
#sheet button{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:12px;text-align:left}
#sheet button:active{background:var(--bd)}
#dlg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
#dlg.on{display:flex}
#dlg .box{background:var(--surf);border-radius:20px;padding:18px;width:100%;max-width:380px}
#dlg h3{margin:0 0 8px}
#dlg p{margin:0 0 12px;color:var(--mut)}
#dlg input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;outline:0;margin-bottom:12px;caret-color:#0084FF}
#dlg .btns{display:flex;gap:8px}
#dlg .btns button{flex:1;padding:12px;border-radius:12px;background:var(--bd)}
#dlg .btns button.pri{background:var(--acc);color:#fff;margin:0}
.seltxt{user-select:text;-webkit-user-select:text;max-height:50vh;overflow-y:auto;white-space:pre-wrap;margin-bottom:12px;background:var(--bg);border-radius:12px;padding:10px}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
#viewer.on{display:flex}
#viewer img{max-width:94vw;max-height:72vh;border-radius:10px}
#viewer .vb{display:flex;gap:16px}
#viewer .vb button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff}
#pause{position:fixed;inset:0;z-index:95;background:#000;color:#fff;display:none;align-items:center;justify-content:center;padding:28px}
#pause.on{display:flex}
#pause .pb{width:100%;max-width:380px;text-align:center}
#pause .pi{width:84px;height:84px;margin:0 auto 18px;color:#fff}
#pause h2{margin:0 0 10px}
#pause p{color:#bbb;margin:0 0 26px}
#pause button{display:block;width:100%;padding:16px;border-radius:16px;font-size:17px;margin-bottom:12px;background:#333;color:#fff}
#pause button.y{background:#fff;color:#000}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>

let mem=Object.assign({on:true,items:[]},load("nova_mem",{}));
const saveMem=()=>put("nova_mem",mem);
function memSet(key,text,val){
  const i=mem.items.findIndex(x=>x.key===key);
  if(i>=0){mem.items[i].text=text;mem.items[i].val=val;mem.items[i].ts=Date.now()}
  else mem.items.push({id:uid(),key,text,val,ts:Date.now()});
  mem.items=mem.items.slice(-60);saveMem();
}
function memLearn(s){
  if(!mem.on)return;let m;
  if((m=s.match(/(?:je m'appelle|je me nomme|mon pr[ée]nom est|my name is|call me)\s+([A-Za-zÀ-ÿ'’-]{2,25})/i)))memSet("nom","Le prénom de l'utilisateur est "+m[1]+".",m[1]);
  if((m=s.match(/(?:j'habite|je vis|i live in)\s+(?:à |a |en |au |aux |in )?([^,.!?\n]{2,40})/i)))memSet("lieu","L'utilisateur habite à "+m[1].trim()+".");
  if((m=s.match(/(?:je travaille sur|mon projet (?:est|c'est)|i(?:'m| am) working on)\s+([^.!?\n]{3,80})/i)))memSet("projet","Projet en cours de l'utilisateur : "+m[1].trim()+".");
  if((m=s.match(/(?:j'aime|j'adore|i (?:like|love))\s+([^,.!?\n]{2,50})/i)))memSet("pref:"+m[1].trim().toLowerCase().slice(0,30),"L'utilisateur aime "+m[1].trim()+".");
  if((m=s.match(/(?:retiens|souviens-toi|n'oublie pas|remember)\s*(?:que|that|:)?\s*([^\n]{3,160})/i)))memSet("note:"+m[1].trim().toLowerCase().slice(0,40),m[1].trim());
}
function memBlock(q){
  if(!mem.on||!mem.items.length)return"";
  const w=q.toLowerCase().split(/\W+/).filter(x=>x.length>3);
  const sc=x=>w.reduce((a,k)=>a+(x.text.toLowerCase().includes(k)?1:0),0);
  const items=mem.items.slice().sort((a,b)=>sc(b)-sc(a)||b.ts-a.ts).slice(0,12);
  return "\n\nMÉMOIRE (informations mémorisées sur l'utilisateur ; utilise-les seulement si elles sont pertinentes, ne les récite pas) :\n"+items.map(x=>"- "+x.text).join("\n");
}

async function api(body,ms){
  const c=new AbortController();ctl.ac=c;
  const tm=setTimeout(()=>{c.timeout=true;c.abort()},ms||60000);
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify(body),signal:c.signal});
    let d=null;try{d=await r.json()}catch(e){}
    if(!r.ok||!d||d.success===false)throw new Error((d&&d.error)||("HTTP "+r.status));
    return d;
  }catch(e){if(e&&e.name==="AbortError"&&c.timeout&&!ctl.stop&&!ctl.net)e.timeout=true;throw e}
  finally{clearTimeout(tm)}
}

/* ===================== MARKDOWN ===================== */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function textBlock(src){
  const Ls=src.split("\n"),out=[];let i=0,para=[];
  const flush=()=>{if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[]}};
  while(i<Ls.length){
    const ln=Ls[i];
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<Ls.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(Ls[i+1])){
      flush();
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(ln);i+=2;const rows=[];
      while(i<Ls.length&&/^\s*\|.*\|\s*$/.test(Ls[i])){rows.push(cells(Ls[i]));i++}
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");
      continue;
    }
    let m;
    if((m=ln.match(/^(#{1,4})\s+(.*)$/))){flush();const n=m[1].length<3?3:4;out.push("<h"+n+">"+inline(m[2])+"</h"+n+">");i++;continue}
    if(/^\s*[-*•]\s+/.test(ln)){flush();const it=[];while(i<Ls.length&&/^\s*[-*•]\s+/.test(Ls[i])){it.push(Ls[i].replace(/^\s*[-*•]\s+/,""));i++}out.push("<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");continue}
    if(/^\s*\d+[.)]\s+/.test(ln)){flush();const it=[];while(i<Ls.length&&/^\s*\d+[.)]\s+/.test(Ls[i])){it.push(Ls[i].replace(/^\s*\d+[.)]\s+/,""));i++}out.push("<ol>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");continue}
    if(!ln.trim()){flush();i++;continue}
    para.push(ln);i++;
  }
  flush();return out.join("");
}
function codeCard(code,lang){
  lang=(lang||"").toLowerCase();
  const py=lang==="py"||lang==="python";
  const lines=code.split("\n").length;
  const btns=py
    ?`<button data-a="expand" aria-label="Voir tout">${ic("expand",18)}</button><button data-a="copycode" aria-label="Copier tout">${ic("copy",18)}</button><button data-a="dlcode" aria-label="Télécharger le fichier">${ic("dl",18)}</button><button data-a="editcode" aria-label="Modifier">${ic("edit",18)}</button>`
    :`<button data-a="copycode" aria-label="Copier">${ic("copy",18)}</button><button data-a="dlcode" aria-label="Télécharger le fichier">${ic("dl",18)}</button>`;
  return `<div class="code" data-lang="${esc(lang)}" data-code="${encodeURIComponent(code)}"><div class="chead"><span>${esc(lang||"code")}</span><span class="ca">${btns}</span></div><pre class="${py&&lines>10?"col":""}"><code>${esc(code)}</code></pre></div>`;
}
function md(src){
  const parts=[];let last=0,m;
  const re=/```([\w+-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g;
  while((m=re.exec(src))){
    if(m.index>last)parts.push(["t",src.slice(last,m.index)]);
    parts.push(["c",m[2].replace(/\n$/,""),m[1]]);
    last=re.lastIndex;
    if(m[0]==="")break;
  }
  if(last<src.length)parts.push(["t",src.slice(last)]);
  return parts.map(p=>p[0]==="c"?codeCard(p[1],p[2]):textBlock(p[1])).join("");
}

const RE_IMG=/^\s*(génère|genere|génére|crée|cree|dessine|fais|generate|draw|create|make)\s+(moi\s+)?(une?\s+|an?\s+|me\s+)?(image|photo|illustration|dessin|picture)/i;

  if(/\d\s*[+\/x×÷-]\s*\d|calcul|combien font/i.test(txt))return L("Exécute le calcul…","Running the calculation…");

async function doWeb(m,ty){

  const src=Array.isArray(s.sources)?s.sources:[];
  const srcList=src.map(x=>({title:x.title,url:x.url,source:x.source}));
  ty.setLabel(L("Consulte les sources…","Reading sources…"));
  for(const x of src.slice(0,6)){if(ctl.stop)throw Object.assign(new Error("stop"),{name:"AbortError"});ty.extra.appendChild(el("div","pcard",esc(x.title||"")));scrollDown();await sleep(300)}
  ty.setLabel(L("Réfléchit…","Thinking…"));

  if(src.length)msg+="\n\nRésultats Wikipédia réels (appuie-toi dessus, ne fabrique aucune source) :\n"+src.map(x=>"- "+x.title+" : "+x.snippet+" ("+x.url+")").join("\n");
  else msg+="\n\n(Aucune source Wikipédia trouvée pour cette recherche. Ne cite aucune source.)";
  try{await doChat(m,ty,msg,srcList)}

    if(!ctl.stop&&srcList.length){ // conserver les résultats déjà obtenus
      await deliverText(m,ty,L("Connexion interrompue. Voici les sources déjà trouvées :","Connection lost. Here are the sources already found:"),srcList);

async function run(m,force){

const readAs=(f,mode)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);mode==="text"?r.readAsText(f):mode==="buf"?r.readAsArrayBuffer(f):r.readAsDataURL(f)});
const shrink=url=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};im.onerror=rej;im.src=url});
async function pdfText(f){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const doc=await window.pdfjsLib.getDocument({data:await readAs(f,"buf")}).promise;let out="";
  for(let p=1;p<=Math.min(doc.numPages,30);p++){const pg=await doc.getPage(p);const c=await pg.getTextContent();out+=c.items.map(i=>i.str).join(" ")+"\n\n";if(out.length>60000)break}
  out=out.trim().slice(0,60000);if(!out)throw new Error("pdf");return out;
}
async function ingest(f){
  const key=uid();
  if((f.type||"").startsWith("image/")){
    const src=await shrink(await readAs(f));imgCache.set(key,src);
    await idbPut({key,src,ts:Date.now(),kind:/screenshot|capture|screen/i.test(f.name)?"shot":"upload",name:f.name||"image"});
    return {key,type:"image",name:f.name};
  }
  let text="";
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf")text=await pdfText(f);
  else{if(f.size>2e6)throw new Error("big");text=(await readAs(f,"text")).slice(0,60000)}
  await idbPut({key,src:"",text,ts:Date.now(),kind:"doc",name:f.name});
  return {key,type:"doc",name:f.name};
}
async function addFiles(files){
  for(const f of files){

    try{pending.push(await ingest(f))}catch(e){toast(L("Fichier illisible : ","Unreadable file: ")+f.name)}
  }
  renderChips();inp.focus();
}

  if(!SR){toast(L("La reconnaissance vocale n'est pas disponible sur cet appareil.","Speech recognition is not available on this device."));return}
  e.preventDefault();
  rs={cancel:false,held:true,final:"",inter:"",err:"",y:e.clientY};
  try{micB.setPointerCapture(e.pointerId)}catch(_){}
  try{
    rec=new SR();rec.lang=VLANG[cfg.lang]||"fr-FR";rec.interimResults=true;rec.continuous=false;
    rec.onresult=ev=>{if(!rs)return;let fin="",it="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}rs.final+=fin;rs.inter=it};
    rec.onerror=ev=>{if(!rs)return;if(ev.error==="not-allowed"||ev.error==="service-not-allowed")rs.err="perm";else if(ev.error!=="no-speech"&&ev.error!=="aborted")rs.err="gen"};
    rec.onend=()=>{if(rs&&rs.held&&!rs.err){try{rs.final+=" "+rs.inter;rs.inter="";rec.start();return}catch(_){}}voiceFinish()};
    rec.start();voiceUI(true,false);
  }catch(err){rs=null;rec=null;voiceUI(false);toast(L("Erreur de reconnaissance vocale.","Speech recognition error."))}
});
micB.addEventListener("pointermove",e=>{if(!rs)return;const c=rs.y-e.clientY>70;if(c!==rs.cancel){rs.cancel=c;voiceUI(true,c)}});
function micUp(abort){
  if(!rs)return;
  rs.held=false;if(abort)rs.cancel=true;
  try{abort||rs.cancel?rec.abort():rec.stop()}catch(_){voiceFinish()}
}

function deleteMsg(id){
  const list=cur();const i=list.findIndex(x=>x.id===id);if(i<0)return;
  let j=i+1;while(j<list.length&&list[j].role!=="user")j++;
  list.splice(i,j-i);
  if(!list.length&&!cfg.project){const c=activeConv();if(c){convs=convs.filter(x=>x!==c);cfg.active=null;saveCfg()}}
  saveMsgs();renderAll();
}
function regenerate(){
  if(busy)return;
  const list=cur();let i=list.length-1;while(i>=0&&list[i].role!=="user")i--;
  if(i<0)return;
  const um=list[i];const wasImg=list.slice(i+1).some(x=>x.type==="image");
  list.splice(i+1);saveMsgs();renderAll();run(um,wasImg?"image":null);
}

/* ===================== OUTILS ===================== */
let toolsTab="calc";
function calcEval(s){
  s=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/\s+/g,"");
  let i=0;
  function num(){const st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(st===i)throw 0;const v=parseFloat(s.slice(st,i));if(isNaN(v))throw 0;return v}
  function post(v){while(s[i]==="%"){i++;v/=100}return v}
  function prim(){
    if(s[i]==="("){i++;const v=expr();if(s[i]!==")")throw 0;i++;return post(v)}
    if(s[i]==="-"){i++;return -prim()}
    if(s[i]==="+"){i++;return prim()}
    return post(num());
  }
  function pow(){const b=prim();if(s[i]==="^"){i++;return Math.pow(b,pow())}return b}
  function term(){let v=pow();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=pow();v=o==="*"?v*r:v/r}return v}
  function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
  const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v;
}
const UNITS={
  length:{mm:.001,cm:.01,m:1,km:1000,in:.0254,ft:.3048,yd:.9144,mi:1609.344},
  mass:{mg:1e-6,g:.001,kg:1,t:1000,oz:.028349523,lb:.45359237},
  volume:{mL:.001,L:1,"m³":1000,tsp:.00492892,tbsp:.0147868,cup:.236588,gal:3.785411784},
  speed:{"m/s":1,"km/h":1/3.6,mph:.44704,kn:.514444},
  time:{s:1,min:60,h:3600,d:86400,wk:604800},
  temp:{"°C":1,"°F":1,K:1}
};
function convUnit(v,cat,a,b){
  if(cat==="temp"){
    let c=a==="°C"?v:a==="°F"?(v-32)*5/9:v-273.15;
    return b==="°C"?c:b==="°F"?c*9/5+32:c+273.15;
  }
  return v*UNITS[cat][a]/UNITS[cat][b];
}

    const calcU=()=>{const v=parseFloat($("#uv").value);if(isNaN(v)){$("#ur").textContent="—";return}const r=convUnit(v,$("#uc").value,$("#ua").value,$("#ub").value);$("#ur").textContent=(+r.toPrecision(10))+" "+$("#ub").value};
    $("#uc").addEventListener("change",fillU);["uv","ua","ub"].forEach(i=>$("#"+i).addEventListener("input",calcU));

      ideas:{ph:L("Sujet ou thème…","Topic or theme…"),btn:L("Générer des idées","Generate ideas"),p:s=>"Donne une liste numérotée de 10 idées originales et concrètes sur : "+s+". Réponds uniquement avec la liste, dans la langue de la demande."},
      spell:{ph:L("Collez le texte à corriger…","Paste the text to correct…"),btn:L("Corriger","Correct"),p:s=>"Corrige l'orthographe, la grammaire et la ponctuation du texte suivant sans changer son sens ni son style. Réponds uniquement avec le texte corrigé :\n\n"+s},
      trans:{ph:L("Texte à traduire…","Text to translate…"),btn:L("Traduire","Translate"),p:(s,l)=>"Traduis le texte suivant en "+l+". Réponds uniquement avec la traduction :\n\n"+s}
    }[toolsTab];
    const tl=["Français","English","中文 (chinois)","Italiano","Español","Kiswahili","Deutsch","Português","العربية (arabe)"];

    $("#ago").addEventListener("click",async()=>{

  $("#pause").classList.add("on");
}
$("#pause").addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(!b)return;
  useSec=0;put("nova_use",0);
  if(b.dataset.p==="n"){$("#pause").classList.remove("on");pauseOpen=false;return}
  try{window.close()}catch(_){}
  setTimeout(()=>{
    $("#pauseBox").innerHTML=`<h2>${esc(L("Prenez soin de vous","Take care"))}</h2><p>${esc(L("Vous pouvez maintenant fermer NOVA AI et vous reposer.","You can now close NOVA AI and take a rest."))}</p><button class="y" data-p="n">${esc(L("Fermer ce message","Dismiss"))}</button>`;
  },400);
});
setInterval(()=>{
  if(document.visibilityState!=="visible")return;
  useSec+=10;put("nova_use",useSec);
  if(useSec>=7200&&!pauseOpen&&!busy)showPause();
},10000);

      navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"}).then(function(r){

          if(document.visibilityState==="visible"){try{r.update()}catch(e){}}
