<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#080B12">
<meta name="application-name" content="NOVA AI">
<meta name="description" content="NOVA AI — Ton assistant intelligent.">
<link rel="manifest" href="./manifest.json">
<title>NOVA AI</title>

<style>
:root{
  --bg:#080B12;
  --panel:#101725;
  --bubble:#151D2B;
  --text:#FFFFFF;
  --muted:#9AA8BA;
  --blue:#2563EB;
  --green:#00C950;
  --red:#EF4444;
  --border:#202C40;
  --input:#111B2B;
  --app-height:100dvh;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
}

button,input,textarea{font:inherit}
button{border:0;cursor:pointer;color:inherit}
.hidden{display:none!important}

svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}

#app{
  position:relative;
  width:100%;
  height:var(--app-height);
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 15% 15%,#14213b55,transparent 42%),
    radial-gradient(ellipse at 90% 75%,#10284a33,transparent 45%),
    linear-gradient(145deg,#080B12,#0B101B 55%,#080B12);
}

#splash{
  position:absolute;
  inset:0;
  z-index:1000;
  background:#080B12;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  transition:opacity .35s;
}

.logo{
  width:68px;
  height:68px;
  border-radius:22px;
  background:linear-gradient(145deg,#347BFF,#1745B8);
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:800;
  color:white;
  box-shadow:0 8px 30px #2563eb44;
}

.splash-name{
  font-size:25px;
  font-weight:800;
  letter-spacing:1px;
}

.splash-sub{font-size:13px;color:var(--muted)}

#mainHeader{
  height:60px;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#080B12ee;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}

.header-left{display:flex;align-items:center;gap:8px}
.header-title{font-weight:750;font-size:19px}
.header-right{display:flex;align-items:center}

.icon-btn{
  width:44px;
  height:44px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:var(--text);
}

.icon-btn:active{background:#ffffff15}

#content{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

.page{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  min-height:0;
  background:transparent;
}

.page.active{display:flex}

#homePage{
  overflow-y:auto;
  align-items:center;
  padding:30px 20px 25px;
}

.home-spacer{flex:1;min-height:25px}

.home-title{
  font-size:23px;
  font-weight:700;
  text-align:center;
  line-height:1.45;
  margin:0 0 28px;
}

.suggestions{
  width:100%;
  max-width:430px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.suggestion{
  background:linear-gradient(120deg,#151F30,#111A29);
  border:1px solid #273750;
  border-radius:19px;
  padding:14px 17px;
  text-align:left;
  font-size:15px;
  color:var(--text);
  min-height:48px;
  transition:background .2s,transform .2s;
}

.suggestion:active{transform:scale(.98);background:#1B2A42}
.home-bottom{flex:1;min-height:20px}

#homeComposer{
  width:100%;
  max-width:430px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 0 5px;
}

#homeMessageInput{
  flex:1;
  min-width:0;
  height:47px;
  max-height:120px;
  resize:none;
  border:1px solid #273750;
  outline:none;
  border-radius:25px;
  background:linear-gradient(120deg,#141F30,#101827);
  color:white;
  padding:13px 16px;
  font-size:15px;
  line-height:21px;
}

#homeMessageInput::placeholder{color:#91A1B8}

#homeSendBtn{
  width:47px;
  height:47px;
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(145deg,#347BFF,#2055D4);
  display:grid;
  place-items:center;
  box-shadow:0 4px 14px #2563eb44;
}

#homeSendBtn svg{width:25px;height:25px;color:#fff}

#chatPage{overflow:hidden}

#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:19px;
  padding:18px 13px 16px;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
}

.message-row{
  width:100%;
  display:flex;
  flex-direction:column;
  animation:messageAppear .22s ease-out;
}

@keyframes messageAppear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.message-row.user{align-items:flex-end}
.message-row.ai{align-items:flex-start}

.bubble{
  max-width:88%;
  width:max-content;
  padding:14px 16px;
  border-radius:19px;
  font-size:16px;
  line-height:1.75;
  overflow-wrap:anywhere;
  white-space:normal;
  letter-spacing:.05px;
}

.user .bubble{
  background:linear-gradient(140deg,#2F73F4,#2055D4);
  color:#fff;
  border-radius:19px 19px 5px 19px;
  box-shadow:0 4px 15px #1649b522;
}

.ai .bubble{
  background:linear-gradient(145deg,#172235,#111A29);
  color:#F3F6FC;
  border:1px solid #26364F;
  border-radius:19px 19px 19px 5px;
  box-shadow:0 4px 16px #00000018;
}

.message-line{
  display:block;
  min-height:1.75em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-line.blank{height:.65em;min-height:.65em}

.message-line strong{font-weight:750;color:#fff}
.message-line em{font-style:italic}
.message-line code{
  background:#080D17;
  color:#9BC2FF;
  padding:2px 5px;
  border-radius:5px;
  font-family:monospace;
  font-size:.9em;
}

.message-status{
  font-size:11px;
  color:var(--muted);
  margin:5px 6px 0;
}

.message-image{
  display:block;
  max-width:78%;
  max-height:360px;
  object-fit:contain;
  border-radius:14px;
  background:var(--bubble);
  border:1px solid var(--border);
}

.ai-actions{
  display:flex;
  align-items:center;
  gap:12px;
  margin:8px 0 0 5px;
}

.ai-actions button{
  background:transparent;
  color:#A8B6CC;
  padding:5px;
  display:grid;
  place-items:center;
  opacity:.95;
}

.ai-actions button:active{color:white}
.ai-actions svg{width:19px;height:19px}

.code-wrap{
  max-width:88%;
  width:100%;
  background:#080D17;
  border-radius:12px;
  overflow:hidden;
  margin-top:8px;
  border:1px solid #293750;
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 12px;
  background:#121C2C;
  font-size:12px;
  color:#C4D0E2;
}

.code-head button{background:transparent;color:white;font-size:12px}

pre{
  margin:0;
  padding:14px;
  overflow-x:auto;
  white-space:pre;
}

pre code{
  font-family:monospace;
  font-size:13px;
  color:#DCE8FA;
}

.typing-bubble{
  background:linear-gradient(145deg,#172235,#111A29);
  border:1px solid #26364F;
  border-radius:18px 18px 18px 5px;
  display:flex;
  gap:6px;
  padding:15px 17px;
  width:max-content;
}

.typing-bubble span{
  width:7px;
  height:7px;
  background:#A8B9D2;
  border-radius:50%;
  animation:bounce 1s infinite ease-in-out;
}

.typing-bubble span:nth-child(2){animation-delay:.15s}
.typing-bubble span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.5}
  30%{transform:translateY(-5px);opacity:1}
}

#composer{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 11px calc(10px + env(safe-area-inset-bottom));
  background:#080B12f5;
  border-top:1px solid var(--border);
  backdrop-filter:blur(15px);
}

#composerTools{display:flex;align-items:center;gap:2px}
#composerTools button{width:38px;height:43px}
#composerTools svg{width:24px;height:24px}

#messageInput{
  flex:1;
  min-width:0;
  height:47px;
  max-height:120px;
  resize:none;
  border:1px solid #273750;
  outline:none;
  border-radius:25px;
  background:linear-gradient(120deg,#141F30,#101827);
  color:white;
  padding:13px 16px;
  font-size:15px;
  line-height:21px;
}

#messageInput::placeholder{color:#91A1B8}

#sendBtn{
  width:47px;
  height:47px;
  border-radius:50%;
  background:linear-gradient(145deg,#347BFF,#2055D4);
  display:grid;
  place-items:center;
  box-shadow:0 4px 14px #2563eb44;
}

#sendBtn svg{width:25px;height:25px;color:#fff}

#settingsPage,#subPage{
  overflow-y:auto;
  padding-bottom:25px;
}

.page-heading{
  display:flex;
  align-items:center;
  gap:12px;
  height:60px;
  min-height:60px;
  padding:0 10px;
  border-bottom:1px solid var(--border);
}

.page-heading strong{font-size:19px}

.setting-row{
  min-height:68px;
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 17px;
  background:transparent;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.setting-row>svg{width:27px;height:27px}
.setting-row .setting-label{font-size:15px;font-weight:600}
.setting-row .setting-desc{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.5;
}
.setting-row .row-text{flex:1}

.settings-footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  padding:25px 22px;
}

.sub-content{padding:18px}

.sub-description{
  font-size:14px;
  line-height:1.7;
  color:var(--muted);
}

.choice{
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px 5px;
  border-bottom:1px solid var(--border);
  font-size:15px;
}

.choice input{accent-color:var(--blue);width:18px;height:18px}

.theme-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.theme-card{
  min-height:92px;
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:flex-end;
  font-size:14px;
  font-weight:700;
  border:2px solid transparent;
}

.theme-card.selected{border-color:white}
.theme-neon{background:linear-gradient(135deg,#161c4c,#6d28d9,#08a7bd)}
.theme-sun{background:linear-gradient(135deg,#f97316,#e11d48,#7c2d12)}
.theme-sky{background:linear-gradient(135deg,#020617,#1d4ed8,#38bdf8)}
.theme-fluid{background:linear-gradient(135deg,#0f766e,#7c3aed,#db2777)}
.theme-stars{background:linear-gradient(135deg,#020617,#312e81,#facc15)}
.theme-ocean{background:linear-gradient(135deg,#082f49,#0369a1,#67e8f9)}

.action-button{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:var(--blue);
  color:white;
  font-weight:700;
  margin-top:15px;
}

.danger-button{background:var(--red)}

.info-card{
  background:var(--panel);
  padding:18px;
  border:1px solid var(--border);
  border-radius:15px;
  font-size:14px;
  line-height:1.8;
  color:var(--text);
}

.badge{
  width:15px;
  height:15px;
  display:inline-grid;
  place-items:center;
  border-radius:50%;
  background:var(--green);
  vertical-align:middle;
}

.badge svg{width:10px;height:10px;stroke:white;stroke-width:3}

#drawerOverlay,#sheetOverlay{
  position:absolute;
  inset:0;
  background:#000a;
  z-index:50;
  display:none;
}

#drawerOverlay.show,#sheetOverlay.show{display:block}

#drawer{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:min(85%,340px);
  background:#111A29;
  padding:15px;
  transform:translateX(-105%);
  transition:transform .25s;
  display:flex;
  flex-direction:column;
  gap:12px;
}

#drawerOverlay.show #drawer{transform:translateX(0)}
.drawer-title{font-size:20px;font-weight:700;padding:10px 5px}

.drawer-search{
  width:100%;
  height:44px;
  border-radius:12px;
  background:#1A2639;
  border:1px solid #293750;
  padding:0 12px;
  color:white;
  outline:none;
}

.new-chat{
  padding:14px;
  background:var(--blue);
  border-radius:12px;
  text-align:center;
  font-weight:700;
}

#conversationList{
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.conversation-item{
  background:transparent;
  text-align:left;
  padding:14px 10px;
  border-radius:10px;
  font-size:14px;
}

.conversation-item:active{background:#ffffff15}

#bottomSheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:#121C2C;
  border:1px solid #293750;
  border-radius:21px 21px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);
  transition:transform .25s;
}

#sheetOverlay.show #bottomSheet{transform:translateY(0)}

.sheet-handle{
  width:38px;
  height:4px;
  border-radius:5px;
  background:#73839A;
  margin:0 auto 18px;
}

.sheet-title{font-weight:700;font-size:17px;margin-bottom:12px}

.sheet-action{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  background:transparent;
  padding:15px 5px;
  text-align:left;
  font-size:15px;
  border-bottom:1px solid #ffffff12;
}

.sheet-action svg{width:22px;height:22px}

.sheet-textarea{
  width:100%;
  min-height:105px;
  resize:vertical;
  background:#080D17;
  border:1px solid #33445E;
  border-radius:12px;
  padding:12px;
  color:white;
  outline:none;
}

#toast{
  position:absolute;
  left:50%;
  bottom:95px;
  z-index:100;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#1B2A40;
  border:1px solid #33445E;
  color:white;
  padding:11px 17px;
  border-radius:25px;
  font-size:13px;
  white-space:nowrap;
  transition:.2s;
}

#toast.show{opacity:1;transform:translate(-50%,0)}

body.light{
  --bg:#F4F6FA;
  --panel:#FFFFFF;
  --bubble:#E9EDF4;
  --text:#171D29;
  --muted:#667085;
  --border:#D8DFEA;
  --input:#E9EDF4;
}

body.light #app{
  background:linear-gradient(145deg,#F4F6FA,#E9EEF7);
}

body.light #mainHeader,
body.light #composer{background:#F4F6FAee}

body.light .ai .bubble{
  background:#E9EDF4;
  color:#202938;
  border-color:#D8DFEA;
}

body.light .message-line strong{color:#172033}
body.light .user .bubble{color:white}
body.light #messageInput{color:#171D29}
body.light #messageInput::placeholder{color:#667085}
body.light #homeMessageInput{color:#171D29}
body.light #homeMessageInput::placeholder{color:#667085}
body.light .icon-btn{color:#171D29}
body.light .home-title{color:#171D29}
body.light .suggestion{color:#171D29;background:#E9EDF4}
body.light .setting-row{color:#171D29}
body.light .settings-footer{color:#667085}
body.light .sub-description{color:#667085}
body.light .info-card{color:#171D29}
body.light .choice{color:#171D29}
body.light .setting-row .setting-desc{color:#667085}
body.light .ai-actions button{color:#536178}
body.light .page-heading{border-color:#D8DFEA}
body.light #splash{background:#F4F6FA}
body.light .splash-name{color:#171D29}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="splash">
    <div class="logo">A</div>
    <div class="splash-name">NOVA AI</div>
    <div class="splash-sub">Ton assistant intelligent</div>
  </div>

  <header id="mainHeader">
    <div class="header-left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="header-title">NOVA AI</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="settingsBtn" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" style="width:27px;height:27px">
          <circle cx="12" cy="5" r="1" fill="currentColor"/>
          <circle cx="12" cy="12" r="1" fill="currentColor"/>
          <circle cx="12" cy="19" r="1" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="content">

    <section class="page active" id="homePage">
      <div class="home-spacer"></div>
      <h1 class="home-title">Bonjour, on discute quoi aujourd'hui ?</h1>
      <div class="suggestions">
        <button class="suggestion">En savoir plus sur l'AI</button>
        <button class="suggestion">Planifier un plan d'emploi</button>
        <button class="suggestion">Génère-moi une image 3D</button>
        <button class="suggestion">En savoir plus sur les sortes de travails</button>
        <button class="suggestion">Connaître l'AI et ses capacités</button>
      </div>

      <div id="homeComposer">
        <textarea id="homeMessageInput" rows="1" placeholder="Écrivez quelque chose à NOVA AI..."></textarea>
        <button id="homeSendBtn" aria-label="Envoyer">
          <svg viewBox="0 0 24 24">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>

      <div class="home-bottom"></div>
    </section>

    <section class="page" id="chatPage">
      <div id="messages"></div>

      <div id="composer">
        <div id="composerTools">
          <button class="icon-btn" id="galleryBtn" aria-label="Galerie">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
          </button>

          <button class="icon-btn" id="imageBtn" aria-label="Générer une image">
            <svg viewBox="0 0 24 24">
              <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/>
            </svg>
          </button>
        </div>

        <textarea id="messageInput" rows="1" placeholder="Message à NOVA AI..."></textarea>

        <button id="sendBtn" aria-label="Envoyer">
          <svg viewBox="0 0 24 24">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="page" id="settingsPage">
      <div class="page-heading">
        <button class="icon-btn backSettings" aria-label="Retour">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <strong>Paramètre</strong>
      </div>

      <button class="setting-row" data-sub="mode">
        <svg viewBox="0 0 24 24"><path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"/></svg>
        <div class="row-text">
          <div class="setting-label">Mode clair / sombre / système</div>
          <div class="setting-desc">Personnalise l'apparence de NOVA AI.</div>
        </div>
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="setting-row" data-sub="theme">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 1.4-3.4 1.5 1.5 0 0 1 1.1-2.6H18a3 3 0 0 0 3-3c0-5-4-8-9-8Z"/>
          <circle cx="7.5" cy="10" r="1"/>
          <circle cx="11" cy="7" r="1"/>
          <circle cx="15.5" cy="8.5" r="1"/>
        </svg>
        <div class="row-text">
          <div class="setting-label">Thème</div>

/* FORMATAGE SÉCURISÉ DU TEXTE */
function cleanAIText(text){
  return String(text||"")
    .normalize("NFC")
    .replace(/\u0000/g,"")
    .replace(/[\u200B-\u200D\uFEFF]/g,"")
    .replace(/\uFFFD/g,"");
}

function appendInlineFormatted(container,text){
  const regex=/(\*\*[^*]+\*\*|__[^_]+__|\*[^*]+\*|_[^_]+_|`[^`]+`)/g;
  let last=0;
  let match;

  while((match=regex.exec(text))){
    if(match.index>last){
      container.appendChild(document.createTextNode(text.slice(last,match.index)));
    }

    const token=match[0];
    const el=document.createElement(
      token.startsWith("**")||token.startsWith("__")?"strong":
      token.startsWith("`")?"code":"em"
    );

    el.textContent=token.replace(/^(\*\*|__|\*|_|`)|(\*\*|__|\*|_|`)$/g,"");
    container.appendChild(el);
    last=regex.lastIndex;
  }

  if(last<text.length){
    container.appendChild(document.createTextNode(text.slice(last)));
  }
}

function appendFormattedLine(container,line){
  const div=document.createElement("div");

  if(!line.trim()){
    div.className="message-line blank";
    container.appendChild(div);
    return;
  }

  div.className="message-line";

  let text=line.trimEnd();

  if(/^#{1,6}\s/.test(text)){
    text=text.replace(/^#{1,6}\s+/,"");
    const strong=document.createElement("strong");
    appendInlineFormatted(strong,text);
    div.appendChild(strong);
  }else if(/^[-*+]\s/.test(text)){
    div.textContent="• ";
    appendInlineFormatted(div,text.replace(/^[-*+]\s+/,""));
  }else if(/^\d+\.\s/.test(text)){
    const match=text.match(/^(\d+\.)\s/);
    div.textContent=match[1]+" ";
    appendInlineFormatted(div,text.slice(match[0].length));
  }else if(/^---+$/.test(text)){
    div.textContent=" ";
  }else{
    appendInlineFormatted(div,text);
  }

  container.appendChild(div);
}

function splitCode(text){
  const out=[];
  const regex=/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g;
  let last=0,match;

  while((match=regex.exec(text))){
    if(match.index>last){
      out.push({text:text.slice(last,match.index),code:false});
    }

    out.push({text:match[2],code:true,lang:match[1]});
    last=regex.lastIndex;
  }

  if(last<text.length){
    out.push({text:text.slice(last),code:false});
  }

  if(!out.length) out.push({text,code:false});
  return out;
}

function renderTextPart(container,text){
  const lines=text.split("\n");
  lines.forEach(line=>appendFormattedLine(container,line));
}

function renderCodePart(row,part){
  const wrap=document.createElement("div");
  wrap.className="code-wrap";

  const head=document.createElement("div");
  head.className="code-head";

  const label=document.createElement("span");
  label.textContent=part.lang||"Code";

  const copy=document.createElement("button");
  copy.textContent="Copier";
  copy.addEventListener("click",()=>copyText(part.text));

  head.append(label,copy);

  const pre=document.createElement("pre");
  const code=document.createElement("code");
  code.textContent=part.text;

  pre.appendChild(code);
  wrap.append(head,pre);
  row.appendChild(wrap);
}

function renderMessage(m,scroll=true){
  const row=document.createElement("div");

    img.alt="Image de la conversation";
    row.appendChild(img);
  }

  if(m.text){
    splitCode(m.text).forEach(part=>{
      if(part.code){
        renderCodePart(row,part);
      }else if(part.text.trim()){
        const bubble=document.createElement("div");
        bubble.className="bubble";
        renderTextPart(bubble,part.text);
        row.appendChild(bubble);
      }
    });

  if(m.role==="user"){
    const status=document.createElement("div");
    status.className="message-status";
    status.textContent=m.status||"Envoyé";

  $("messages").appendChild(row);

  if(scroll) scrollBottom();
  return row;

/* IMPRESSION PROGRESSIVE DE LA RÉPONSE */
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function typeAssistantMessage(text,conversationId){
  const c=conversations.find(x=>x.id===conversationId);
  if(!c) return null;

  const clean=cleanAIText(text);
  const m={
    id:uid(),
    role:"assistant",
    text:clean,
    timestamp:Date.now()
  };

  c.messages.push(m);
  saveData();

  if(currentConversationId!==conversationId){
    return m;
  }

  const row=document.createElement("div");
  row.className="message-row ai";
  row.dataset.messageId=m.id;
  $("messages").appendChild(row);

  const parts=splitCode(clean);

  for(const part of parts){
    if(part.code){
      renderCodePart(row,part);
      scrollBottom();
      await sleep(180);
      continue;
    }

    const bubble=document.createElement("div");
    bubble.className="bubble";
    row.appendChild(bubble);

    const lines=part.text.split("\n");

    for(let i=0;i<lines.length;i++){
      appendFormattedLine(bubble,lines[i]);
      scrollBottom();

      if(lines[i].trim()){
        await sleep(115);
      }else{
        await sleep(65);
      }
    }

    await sleep(130);
  }

  addAIActions(row,m);
  scrollBottom();
  saveData();

  return m;
}

  row.addEventListener("touchmove",cancel);
  row.addEventListener("mousedown",start);
  row.addEventListener("mouseup",cancel);
  row.addEventListener("mouseleave",cancel);
  row.addEventListener("contextmenu",e=>e.preventDefault());
}

/* MESSAGES UTILISATEUR */
function addUserMessage(text,image){
  const c=currentConversation();

  const m={
    id:uid(),
    role:"user",
    text:text||"",
    image:image||null,
    status:"Envoi",
    timestamp:Date.now()
  };

  c.messages.push(m);

  if(c.title==="Nouvelle discussion"&&text){
    c.title=text.slice(0,35);
  }

  saveData();
  renderMessage(m);
  renderConversationList();

  return m;
}

function addTypingIndicator(){
  const row=document.createElement("div");
  row.className="message-row ai";
  row.id="typingIndicator";
  row.innerHTML=`
    <div class="typing-bubble">
      <span></span><span></span><span></span>
    </div>`;

  $("messages").appendChild(row);
  scrollBottom();
}

function removeTyping(){
  const el=$("typingIndicator");
  if(el) el.remove();
}

function updateUserStatus(conversationId,messageId,status){
  const c=conversations.find(x=>x.id===conversationId);
  const m=c?.messages.find(x=>x.id===messageId);

  if(!m) return;

  m.status=status;
  saveData();

  if(currentConversationId===conversationId){
    const row=document.querySelector(
      `[data-message-id="${messageId}"] .message-status`
    );
    if(row) row.textContent=status;
  }
}

function removeUserStatus(conversationId,messageId){
  const c=conversations.find(x=>x.id===conversationId);
  const m=c?.messages.find(x=>x.id===messageId);

  if(!m) return;

  m.status="";
  saveData();

  if(currentConversationId===conversationId){
    const status=document.querySelector(
      `[data-message-id="${messageId}"] .message-status`
    );
    if(status) status.remove();
  }
}

/* CONTEXTE ET INSTRUCTIONS DE L'IA */
const NOVA_SYSTEM_PROMPT =
`Tu es NOVA AI, un assistant intelligent francophone.

PERSONNALITÉ ET TON ADAPTATIF :
Adapte naturellement ton ton à ce que l'utilisateur écrit et au contexte de la conversation. Ne garde pas toujours le même ton.

- Si l'utilisateur traverse un moment difficile ou exprime de la tristesse, sois doux, rassurant, patient et respectueux. Écoute sans juger.
- Dans une discussion quotidienne, sois amical, chaleureux et naturel, comme un ami bienveillant.
- Pour les sujets importants, les explications techniques ou les demandes professionnelles, sois sérieux, précis et organisé.
- Lorsque le contexte s'y prête, sois drôle, léger et amusant, sans forcer les blagues.
- Lorsque l'utilisateur apprend ou ne comprend pas quelque chose, sois pédagogue, patient et encourageant.
- Lorsque l'utilisateur a besoin de motivation, encourage-le de manière réaliste et positive.
- Si la situation est sensible, privilégie toujours le respect et la bienveillance plutôt que l'humour.
- Ne prétends pas être un être humain et ne prétends pas avoir des émotions ou une vie personnelle.
- Ne transforme pas chaque réponse en plaisanterie et n'utilise pas un ton excessivement familier lorsque le sujet est sérieux.
- Laisse le contenu du message et les réactions de l'utilisateur guider le ton de tes réponses.

RÈGLES GÉNÉRALES :
Réponds naturellement, clairement et directement.
Adapte la longueur de ta réponse à la question :
- Pour une question très simple, réponds en une ou deux phrases.
- Pour une question courte, donne une réponse concise.
- Développe seulement lorsque la question le demande ou que c'est nécessaire.
- Ne pose pas plusieurs questions inutiles.
- Évite les répétitions et les longues introductions.
- Utilise des paragraphes aérés et des listes seulement lorsqu'elles sont utiles.
- Utilise un Markdown propre : titres, listes et gras correctement formés.
- N'ajoute pas de caractères décoratifs, de symboles aléatoires ou de séquences illisibles.
- N'invente pas de faits et indique clairement les incertitudes.
- Réponds toujours dans la langue utilisée par l'utilisateur, sauf demande contraire.`;

function buildApiMessages(conversation){
  const history=conversation.messages
    .filter(m=>(m.role==="user"||m.role==="assistant"))
    .filter(m=>m.text&&!m.failed)
    .slice(-24)
    .map(m=>({
      role:m.role==="assistant"?"assistant":"user",
      content:m.text
    }));

  return [
    {role:"system",content:NOVA_SYSTEM_PROMPT},
    ...history
  ];
}

/* API SUPABASE */
async function callNovaAI(messages){
  const response=await fetch(NOVA_ENDPOINT,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_ANON_KEY
    },
    body:JSON.stringify({
      action:"chat",
      messages
    })
  });

  if(!response.ok){
    throw new Error("request_failed");
  }

  const data=await response.json();

  const result=
    data.choices?.[0]?.message?.content||
    data.message||
    data.response||
    data.text;

  if(typeof result!=="string"||!result.trim()){
    throw new Error("empty_response");
  }

  return cleanAIText(result.trim());
}

async function generateImage(prompt){
  const response=await fetch(NOVA_ENDPOINT,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_ANON_KEY
    },
    body:JSON.stringify({
      action:"image",
      prompt,
      width:512,
      height:512
    })
  });

  if(!response.ok){
    throw new Error("image_failed");
  }

  const data=await response.json();
  const image=data.image_url||data.image;

  if(!image) throw new Error("image_empty");

  return image;
}

/* ENVOI */
async function sendMessage(){
  if(sending) return;

  const input=$("messageInput");
  const text=input.value.trim();

  if(!text) return;

  if(!currentConversation()) createConversation(false);

  const conversationId=currentConversationId;
  const conversation=conversations.find(c=>c.id===conversationId);

  input.value="";
  input.style.height="47px";
  $("composerTools").classList.remove("hidden");

  const userMessage=addUserMessage(text);
  const started=Date.now();
  const requestId=++activeRequest;

  if(!navigator.onLine){
    setTimeout(()=>{
      const c=conversations.find(x=>x.id===conversationId);
      const m=c?.messages.find(x=>x.id===userMessage.id);

      if(m&&m.status==="Envoi"){
        updateUserStatus(conversationId,userMessage.id,"Message non envoyé");
      }
    },60000);

    return;
  }

  sending=true;
  addTypingIndicator();

  try{
    if(text.toLowerCase().startsWith("/image ")){
      const prompt=text.slice(7).trim();

      if(!prompt) throw new Error("empty_prompt");

      const image=await generateImage(prompt);

      removeTyping();

      const c=conversations.find(x=>x.id===conversationId);

      if(c){
        const imageMessage={
          id:uid(),
          role:"assistant",
          text:"Voici l'image générée.",
          image,
          timestamp:Date.now()
        };

        c.messages.push(imageMessage);
        saveData();

        if(currentConversationId===conversationId){
          renderMessages();
        }
      }
    }else{
      const messages=buildApiMessages(conversation);
      const answer=await callNovaAI(messages);

      removeTyping();

      await typeAssistantMessage(answer,conversationId);
    }

    const c=conversations.find(x=>x.id===conversationId);
    const sent=c?.messages.find(x=>x.id===userMessage.id);

    if(sent){
      updateUserStatus(conversationId,userMessage.id,"Envoyé");

      setTimeout(()=>{
        removeUserStatus(conversationId,userMessage.id);
      },900);
    }

  }catch(error){
    removeTyping();

    const elapsed=Date.now()-started;
    const wait=Math.max(0,60000-elapsed);

    setTimeout(()=>{
      const c=conversations.find(x=>x.id===conversationId);
      const m=c?.messages.find(x=>x.id===userMessage.id);

      if(m&&m.status==="Envoi"){
        updateUserStatus(
          conversationId,
          userMessage.id,
          "Message non envoyé"
        );
      }
    },wait);

  }finally{
    sending=false;
  }
}

$("galerieInput").addEventListener("change",async e=>{
  const file=e.target.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    showToast("Choisis une image");
    return;
  }

  try{
    const image=await compressImage(file);

    if(!currentConversation()) createConversation(false);

    const m=addUserMessage("",image);
    m.status="";
    saveData();

    renderMessages();

  }catch(err){
    showToast("Impossible de charger cette image");
  }

  e.target.value="";
});

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onerror=reject;

    reader.onload=()=>{
      const img=new Image();

      img.onerror=reject;

      img.onload=()=>{
        const max=1200;
        const ratio=Math.min(1,max/Math.max(img.width,img.height));

        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);

        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        resolve(canvas.toDataURL("image/jpeg",.78));
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

/* COPIER ET PARTAGER */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Copié");
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();

    try{
      document.execCommand("copy");
      showToast("Copié");
    }catch(err){
      showToast("Copie impossible");
    }

    area.remove();
  }
}

async function shareText(text){
  if(!text){
    showToast("Aucun texte à partager");
    return;
  }

  if(navigator.share){
    try{
      await navigator.share({text});
    }catch(e){}
  }else{
    copyText(text);
    showToast("Texte copié pour le partager");
  }
}

/* CLAVIER ANDROID : AJUSTEMENT DE LA HAUTEUR */
function adjustForAndroidKeyboard(){
  const root=document.documentElement;
  const viewport=window.visualViewport;

  const updateViewport=()=>{
    const height=viewport
      ?viewport.height
      :window.innerHeight;

    if(height>0){
      root.style.setProperty(
        "--app-height",
        Math.round(height)+"px"
      );
    }

    if(
      $("chatPage").classList.contains("active") &&
      document.activeElement===$("messageInput")
    ){
      requestAnimationFrame(scrollBottom);
    }

    if(
      $("homePage").classList.contains("active") &&
      document.activeElement===$("homeMessageInput")
    ){
      requestAnimationFrame(()=>{
        $("homeMessageInput").scrollIntoView({
          block:"nearest",
          behavior:"auto"
        });
      });
    }
  };

  updateViewport();

  if(viewport){
    viewport.addEventListener("resize",updateViewport);
    viewport.addEventListener("scroll",updateViewport);
  }

  window.addEventListener("resize",updateViewport);

  window.addEventListener("orientationchange",()=>{
    setTimeout(updateViewport,300);
  });

  document.addEventListener("focusin",e=>{
    if(
      e.target===$("messageInput") ||
      e.target===$("homeMessageInput")
    ){
      setTimeout(updateViewport,200);
    }
  });

  document.addEventListener("focusout",()=>{
    setTimeout(updateViewport,200);
  });
}

adjustForAndroidKeyboard();

function handleAppBack(){
  if($("sheetOverlay").classList.contains("show")){
    closeSheet();
    return true;
  }

  if($("drawerOverlay").classList.contains("show")){
    closeDrawer();
    return true;
  }

  if($("subPage").classList.contains("active")){
    showPage("settingsPage");
    return true;
  }

  if($("settingsPage").classList.contains("active")){
    backFromSettings();
    return true;
  }

  if($("chatPage").classList.contains("active")){
    showPage("homePage");
    return true;
  }

  return false;
}
