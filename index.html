<title>NOVA AI</title><style>
:root {
  color-scheme: dark;
  --blue:#0a84ff;
  --blue2:#0865d5;
  --bg:#0a0f1e;
  --panel:#141e33;
  --input:#1c2a45;
  --border:#263957;
  --text:#e2eaf7;
  --muted:#94a3b8;
  --white:#ffffff;
  --ai:#18243a;
  --user-size:15px;
  --radius:17px;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body {
  height:100dvh;
  height:100svh;
  display:flex;
  flex-direction:column;
}

button,textarea,select {
  font:inherit;
}

button {
  cursor:pointer;
}

header {
  height:58px;
  min-height:58px;
  padding:0 13px;
  padding-top:env(safe-area-inset-top);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  z-index:3;
}

.brand {
  display:flex;
  align-items:center;
  gap:9px;
}

.logo,.welcome-logo {
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  box-shadow:0 3px 12px #0a84ff45;
}

.logo {
  width:35px;
  height:35px;
  border-radius:11px;
  font-size:24px;
}

.brand-name {
  font-size:18px;
  font-weight:bold;
  color:white;
  letter-spacing:.2px;
}

.verified {
  width:19px;
  height:19px;
  filter:drop-shadow(0 0 5px #0a84ff80);
}

.icon-button {
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-button:active {
  background:var(--panel);
}

svg {
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

#messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:12px 11px 9px;
  scroll-behavior:smooth;
}

.welcome {
  width:100%;
  max-width:480px;
  margin:24px auto 12px;
  text-align:center;
}

.welcome-logo {
  width:61px;
  height:61px;
  border-radius:19px;
  margin:0 auto 13px;
  font-size:38px;
}

.welcome h2 {
  color:white;
  font-size:22px;
  margin:8px 0;
}

.welcome p {
  color:var(--muted);
  font-size:13px;
  margin:6px 0 17px;
}

.quick-title {
  text-align:left;
  font-size:12px;
  color:var(--muted);
  margin:13px 2px 8px;
}

.suggestions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.suggestion {
  min-height:43px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:13px;
  font-size:12px;
  transition:.2s;
}

.suggestion svg {
  width:19px;
  height:19px;
  flex-shrink:0;
  color:var(--blue);
}

.suggestion:active {
  border-color:var(--blue);
  transform:scale(.98);
}

.message {
  display:flex;
  margin-bottom:8px;
  width:100%;
}

.message.ai {
  justify-content:flex-start;
}

.message.user {
  justify-content:flex-end;
}

.bubble {
  max-width:89%;
  padding:10px 12px;
  font-size:var(--user-size);
  line-height:1.48;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.ai .bubble {
  background:var(--ai);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:5px 16px 16px 16px;
}

.user .bubble {
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  border-radius:16px 16px 5px 16px;
  box-shadow:0 3px 12px #0003;
}

.message-image {
  display:block;
  max-width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:12px;
  margin-top:7px;
}

.generated-image {
  width:100%;
  max-width:420px;
  display:block;
  border-radius:14px;
  margin-top:5px;
}

.image-actions {
  display:flex;
  gap:8px;
  margin-top:9px;
}

.image-actions button {
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:8px 11px;
  border-radius:10px;
  font-size:12px;
}

#thinking {
  display:none;
  padding:4px 15px 10px;
  color:var(--muted);
  font-size:12px;
  align-items:center;
  gap:8px;
}

.dots {
  display:flex;
  gap:4px;
}

.dots span {
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--blue);
  animation:pulse 1s infinite;
}

.dots span:nth-child(2) {
  animation-delay:.15s;
}

.dots span:nth-child(3) {
  animation-delay:.3s;
}

@keyframes pulse {
  0%,80%,100% {opacity:.3;transform:translateY(0)}
  40% {opacity:1;transform:translateY(-4px)}
}

#attachmentPreview {
  display:none;
  padding:7px 12px;
  gap:8px;
  overflow-x:auto;
}

.preview-item {
  position:relative;
  flex-shrink:0;
}

.preview-item img {
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
}

.remove-image {
  position:absolute;
  right:-5px;
  top:-5px;
  width:21px;
  height:21px;
  border-radius:50%;
  border:0;
  background:#ef4444;
  color:white;
  font-weight:bold;
}

.composer-area {
  padding:7px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--bg);
  border-top:1px solid var(--border);
}

.composer {
  display:flex;
  align-items:flex-end;
  gap:3px;
  padding:6px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:25px;
  transition:.2s;
}

.composer:focus-within {
  border-color:var(--blue);
  box-shadow:0 0 0 2px #0a84ff20;
}

.composer button {
  width:38px;
  height:38px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer button:active {
  background:#ffffff12;
}

.composer button svg {
  width:22px;
  height:22px;
  filter:drop-shadow(0 2px 4px #0005);
}

#input {
  flex:1;
  min-width:0;
  min-height:38px;
  max-height:115px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
  padding:10px 4px;
  line-height:1.35;
}

#input::placeholder {
  color:var(--muted);
}

#send {
  width:40px;
  height:40px;
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  color:white;
  box-shadow:0 3px 12px #0a84ff55;
}

#send svg {
  width:21px;
  height:21px;
  filter:drop-shadow(0 1px 2px #0005);
}

#send:disabled {
  opacity:.5;
}

#imageFile {
  display:none;
}

#settings {
  display:none;
  position:absolute;
  z-index:8;
  inset:7px 8px 7px;
  overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  padding:15px;
  box-shadow:0 12px 40px #0009;
}

.settings-header {
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:18px;
  position:sticky;
  top:-15px;
  background:var(--panel);
  padding:5px 0 12px;
  z-index:2;
}

.settings-header h3 {
  margin:0;
  color:white;
  font-size:17px;
}

.setting {
  margin-bottom:17px;
}

.setting-title {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:9px;
  color:var(--text);
}

.setting-title svg {
  width:19px;
  height:19px;
  color:var(--blue);
}

.setting select {
  width:100%;
  padding:11px;
  border-radius:11px;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
}

.setting-button {
  width:100%;
  min-height:43px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;
  text-align:left;
  margin-bottom:7px;
}

.setting-button svg {
  width:19px;
  height:19px;
  color:var(--blue);
}

.colors {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.color {
  width:29px;
  height:29px;
  border-radius:50%;
  border:2px solid #ffffff80;
  box-shadow:0 2px 6px #0005;
}

#messages.stars {
  background-image:radial-gradient(#ffffff25 1px,transparent 1px);
  background-size:24px 24px;
}

#messages.grid {
  background-image:
    linear-gradient(#ffffff09 1px,transparent 1px),
    linear-gradient(90deg,#ffffff09 1px,transparent 1px);
  background-size:25px 25px;
}

#messages.glow {
  background:radial-gradient(ellipse at top,#0a84ff19,transparent 70%);
}

.hidden {
  display:none!important;
}

@media(min-width:600px) {
  main {
    width:100%;
    max-width:850px;
    margin:auto;
  }

  header {
    padding-left:max(16px,calc((100% - 850px)/2));
    padding-right:max(16px,calc((100% - 850px)/2));
  }

  #messages {
    padding:20px 20px;
  }

  .composer-area {
    padding-left:20px;
    padding-right:20px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}

"use strict";

const $ = id => document.getElementById(id);

const messages = $("messages");
const input = $("input");

/* POLLINATIONS */

const REDIRECT_URI = "https://limyoun298-ai.github.io/Nova-AI/";
const AUTH_URL = "https://enter.pollinations.ai/authorize";
const TOKEN_URL = "https://enter.pollinations.ai/api/oauth/token";

let accessToken = sessionStorage.getItem("nova_pollinations_token") || "";
let tokenExpiry = Number(sessionStorage.getItem("nova_token_expiry") || 0);

let history = JSON.parse(localStorage.getItem("nova_history") || "[]");
let memory = JSON.parse(localStorage.getItem("nova_memory") || "{}");
let settings = JSON.parse(localStorage.getItem("nova_settings") || "{}");

let selectedImages = [];
let isSending = false;

/* STOCKAGE */
function save() {
  localStorage.setItem("nova_history",JSON.stringify(history));
  localStorage.setItem("nova_memory",JSON.stringify(memory));
  localStorage.setItem("nova_settings",JSON.stringify(settings));
}

function scrollBottom() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function showThinking(show) {
  $("thinking").style.display = show ? "flex" : "none";
  scrollBottom();
}

/* AFFICHAGE DES MESSAGES */
function addMessage(role,content,images=[]) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content || "";

  images.forEach(src => {
    const img = document.createElement("img");

    img.className = "message-image";
    bubble.appendChild(img);
  });

  row.appendChild(bubble);
  messages.appendChild(row);
  scrollBottom();

  return bubble;
}

function addGeneratedImage(blobUrl,prompt) {

/* OAUTH PKCE */
function randomString(length=48) {
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b => b.toString(16).padStart(2,"0")).join("");
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

function tokenIsValid() {
  return !!accessToken && (!tokenExpiry || Date.now() < tokenExpiry - 60000);
}

async function connectPollinations() {
  if(!crypto.subtle) {
    alert("Ouvre NOVA AI depuis HTTPS pour utiliser la connexion sécurisée.");
    return;
  }

  const verifier = randomString(48);
  const state = randomString(24);

  sessionStorage.setItem("nova_pkce_verifier",verifier);
  sessionStorage.setItem("nova_oauth_state",state);

  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(verifier)
  );

  const challenge = base64url(digest);

  const params = new URLSearchParams({
    response_type:"code",
    client_id:POLLINATIONS_APP_KEY,
    redirect_uri:REDIRECT_URI,
    scope:"profile usage",
    state,
    code_challenge:challenge,
    code_challenge_method:"S256",
    models:"text,image",
    budget:"5",
    expiry:"7"
  });

  location.href = AUTH_URL + "?" + params.toString();
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if(error) {
    history.replaceState(null,"",REDIRECT_URI);
    alert("Autorisation Pollinations annulée.");
    return;
  }

  if(!code) return;

  const expectedState = sessionStorage.getItem("nova_oauth_state");
  const verifier = sessionStorage.getItem("nova_pkce_verifier");

  if(!expectedState || returnedState !== expectedState || !verifier) {
    history.replaceState(null,"",REDIRECT_URI);
    alert("Connexion invalide. Recommence.");
    return;
  }

  try {
    const response = await fetch(TOKEN_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({
        grant_type:"authorization_code",
        code,
        client_id:POLLINATIONS_APP_KEY,
        redirect_uri:REDIRECT_URI,
        code_verifier:verifier
      })
    });

    const data = await response.json();

    if(!response.ok || !data.access_token) {
      throw new Error(data.error_description || data.error || "Connexion impossible.");
    }

    accessToken = data.access_token;

    const expiresIn = Number(data.expires_in || 0);
    tokenExpiry = expiresIn ? Date.now() + expiresIn * 1000 : 0;

    sessionStorage.setItem("nova_pollinations_token",accessToken);
    sessionStorage.setItem("nova_token_expiry",String(tokenExpiry));

    sessionStorage.removeItem("nova_pkce_verifier");
    sessionStorage.removeItem("nova_oauth_state");

    history.replaceState(null,"",REDIRECT_URI);

    const pending = sessionStorage.getItem("nova_pending_message");
    sessionStorage.removeItem("nova_pending_message");

    if(pending) await sendMessage(pending);

  } catch(error) {
    console.error(error);
    history.replaceState(null,"",REDIRECT_URI);
    addMessage("ai","Connexion Pollinations impossible : " + error.message);
  }
}

/* GALERIE DU TÉLÉPHONE */
$("galleryButton").addEventListener("click",() => {
  fileInput.click();
});

fileInput.addEventListener("change",async event => {
  const files = Array.from(event.target.files || []);

  for(const file of files) {
    if(!file.type.startsWith("image/")) continue;

    if(file.size > 12 * 1024 * 1024) {
      alert("Une image dépasse 12 Mo. Choisis une image plus légère.");
      continue;
    }

    if(selectedImages.length >= 4) {
      alert("Tu peux joindre jusqu'à 4 images.");
      break;
    }

    try {
      const data = await compressImage(file);
      selectedImages.push(data);
    } catch(error) {
      console.error(error);
    }
  }

  renderPreviews();
  fileInput.value = "";
});

async function compressImage(file) {
  const image = await createImageBitmap(file);

  const max = 1280;
  const scale = Math.min(1,max / Math.max(image.width,image.height));

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(image.width * scale);
  canvas.height = Math.round(image.height * scale);

  const ctx = canvas.getContext("2d");
  ctx.drawImage(image,0,0,canvas.width,canvas.height);

  return canvas.toDataURL("image/jpeg",0.78);
}

function renderPreviews() {
  const container = $("attachmentPreview");
  container.innerHTML = "";

  if(!selectedImages.length) {
    container.style.display = "none";
    return;
  }

  container.style.display = "flex";

  selectedImages.forEach((src,index) => {
    const item = document.createElement("div");
    item.className = "preview-item";

    const img = document.createElement("img");
    img.src = src;

    const remove = document.createElement("button");
    remove.className = "remove-image";
    remove.textContent = "×";
    remove.onclick = () => {
      selectedImages.splice(index,1);
      renderPreviews();
    };

    item.append(img,remove);
    container.appendChild(item);
  });
}

/* MÉMOIRE */
function extractMemory(text) {
  const match = text.match(/je m'appelle\s+([a-zA-ZÀ-ÿ'-]+)/i);

  if(match) {
    memory.name = match[1];
    save();
  }
}

function remember(text) {
  if(/rappelle.toi mon nom|tu te souviens de mon nom|quel est mon nom/i.test(text)) {
    return memory.name
      ? "Oui ! Tu m'as dit que tu t'appelles " + memory.name + " 💙"
      : "Tu ne m'as pas encore donné ton prénom.";
  }
  return null;
}

/* CHAT */
async function sendMessage(text) {
  text = (text || "").trim();

  if(isSending || (!text && !selectedImages.length)) return;

  if(!tokenIsValid()) {
    sessionStorage.setItem("nova_pending_message",text);
    await connectPollinations();
    return;
  }

  isSending = true;
  $("send").disabled = true;

  const images = [...selectedImages];
  selectedImages = [];
  renderPreviews();

  $("welcome").classList.add("hidden");

  addMessage("user",text,images);

  const userContent = text || "Que vois-tu sur cette image ?";

  history.push({role:"user",content:userContent});
  save();

  input.value = "";
  input.style.height = "auto";

  extractMemory(text);

  const remembered = remember(text);

  if(remembered && images.length === 0) {
    addMessage("ai",remembered);
    history.push({role:"assistant",content:remembered});
    save();
    isSending = false;
    $("send").disabled = false;
    return;
  }

  showThinking(true);

  try {
    const systemPrompt =
      "Tu es NOVA AI, un assistant intelligent, naturel, amical et professionnel. " +
      "Réponds en français sauf demande contraire. " +
      "Adapte tes réponses au contexte et varie naturellement les emojis sans en abuser. " +
      "Aide pour les études, les projets, la rédaction et les questions générales. " +
      "Si une image est jointe, analyse-la uniquement si tu peux réellement la voir. " +
      "Mémoire connue : " + JSON.stringify(memory);

    const apiMessages = [
      {role:"system",content:systemPrompt},
      ...history.slice(-24).map(item => ({
        role:item.role === "assistant" ? "assistant" : "user",
        content:item.content
      }))
    ];

    if(images.length) {
      apiMessages[apiMessages.length - 1] = {
        role:"user",
        content:[
          {type:"text",text:userContent},
          ...images.map(url => ({
            type:"image_url",
            image_url:{url}
          }))
        ]
      };
    }

    const response = await fetch(CHAT_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + accessToken
      },
      body:JSON.stringify({
        model:TEXT_MODEL,
        messages:apiMessages,
        temperature:0.7
      })
    });

    const data = await response.json();

    if(!response.ok) {
      if(response.status === 401 || response.status === 403) {
        accessToken = "";
        tokenExpiry = 0;
        sessionStorage.removeItem("nova_pollinations_token");
        sessionStorage.removeItem("nova_token_expiry");
        throw new Error("L'autorisation a expiré. Reconnecte Pollinations.");
      }

      throw new Error(data.error?.message || data.message || "Erreur API " + response.status);
    }

    const answer = data.choices?.[0]?.message?.content;

    if(!answer) throw new Error("Aucune réponse reçue.");

    addMessage("ai",answer);
    history.push({role:"assistant",content:answer});
    save();

  } catch(error) {
    console.error("NOVA AI:",error);
    addMessage("ai","Je rencontre un problème : " + error.message);
  } finally {
    showThinking(false);
    isSending = false;
    $("send").disabled = false;
  }
}

/* GÉNÉRATION D'IMAGES */
async function generateImage(prompt) {
  prompt = prompt.trim();

  if(!prompt) {
    input.value = "Génère une image de ";
    input.focus();
    return;
  }

  if(!tokenIsValid()) {
    sessionStorage.setItem("nova_pending_message","/image " + prompt);
    await connectPollinations();
    return;
  }

  $("welcome").classList.add("hidden");

  addMessage("user","🎨 Génère une image : " + prompt);

  showThinking(true);
  $("send").disabled = true;

  try {
    const url = IMAGE_URL + encodeURIComponent(prompt) +
      "?model=" + encodeURIComponent(IMAGE_MODEL) +
      "&width=1024&height=1024";

    const response = await fetch(url,{
      headers:{
        "Authorization":"Bearer " + accessToken
      }
    });

    if(!response.ok) {
      if(response.status === 401 || response.status === 403) {
        accessToken = "";
        sessionStorage.removeItem("nova_pollinations_token");
        sessionStorage.removeItem("nova_token_expiry");
      }
      throw new Error("Erreur de génération : " + response.status);
    }

    const blob = await response.blob();

    if(!blob.type.startsWith("image/")) {
      throw new Error("Le serveur n'a pas renvoyé une image.");
    }

    const blobUrl = URL.createObjectURL(blob);
    addGeneratedImage(blobUrl,prompt);

  } catch(error) {
    console.error(error);
    addMessage("ai","Impossible de générer l'image : " + error.message);
  } finally {
    showThinking(false);
    $("send").disabled = false;
  }
}

function applySettings() {
  const root = document.documentElement;

  const color = settings.color || "#0a84ff";
  root.style.setProperty("--blue",color);
  root.style.setProperty("--blue2",color);

  let theme = settings.theme || "dark";

  if(theme === "system") {
    theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }

  if(theme === "light") {
    root.style.colorScheme = "light";
    root.style.setProperty("--bg","#f1f5f9");
    root.style.setProperty("--panel","#ffffff");
    root.style.setProperty("--input","#e2e8f0");
    root.style.setProperty("--border","#cbd5e1");
    root.style.setProperty("--text","#1e293b");
    root.style.setProperty("--muted","#64748b");
    root.style.setProperty("--ai","#ffffff");
  } else {
    root.style.colorScheme = "dark";
    root.style.setProperty("--bg","#0a0f1e");
    root.style.setProperty("--panel","#141e33");
    root.style.setProperty("--input","#1c2a45");
    root.style.setProperty("--border","#263957");
    root.style.setProperty("--text","#e2eaf7");
    root.style.setProperty("--muted","#94a3b8");
    root.style.setProperty("--ai","#18243a");
  }

  messages.classList.remove("stars","grid","glow");

  if(settings.background && settings.background !== "none") {
    messages.classList.add(settings.background);
  }

  root.style.setProperty("--user-size",settings.fontSize || "15px");

  $("theme").value = settings.theme || "dark";
  $("background").value = settings.background || "none";
  $("fontSize").value = settings.fontSize || "15px";

  save();
}
