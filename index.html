<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="application-name" content="NOVA AI">
<link rel="manifest" href="./manifest.json">
<title>NOVA AI</title>

<style>
:root {
  --blue:#0a84ff;
  --blue2:#0a5acc;
  --bg:#0a0f1e;
  --panel:#141e33;
  --input:#1c2a45;
  --border:#2a3d66;
  --text:#c2d4f0;
  --white:#fff;
  --muted:#94a3b8;
  --user-size:16px;
}

* {box-sizing:border-box}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}

header {
  height:65px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}

.brand {display:flex;align-items:center;gap:10px}

.logo,.welcome-logo {
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.logo {
  width:37px;
  height:37px;
  border-radius:12px;
  font-size:25px;
}

.brand-name {font-size:19px;font-weight:bold;color:white}

.verified {
  width:20px;
  height:20px;
  filter:drop-shadow(0 0 5px var(--blue));
}

.icon-button {
  background:none;
  border:0;
  color:var(--text);
  padding:8px;
  cursor:pointer;
}

.icon-button svg {
  width:24px;
  height:24px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

main {
  height:calc(100dvh - 65px);
  display:flex;
  flex-direction:column;
  position:relative;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:20px 13px 15px;
  scroll-behavior:smooth;
}

.message {display:flex;margin-bottom:9px}
.message.ai {justify-content:flex-start}
.message.user {justify-content:flex-end}

.bubble {
  max-width:88%;
  padding:12px 14px;
  font-size:var(--user-size);
  line-height:1.5;
  overflow-wrap:anywhere;
}

.ai .bubble {
  background:var(--panel);
  color:var(--text);
  border-radius:5px 18px 18px 18px;
}

.user .bubble {
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  border-radius:18px 18px 5px 18px;
  box-shadow:0 3px 12px #0003;
}

.ai-label {
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.welcome {
  max-width:500px;
  margin:35px auto 20px;
  text-align:center;
}

.welcome-logo {
  width:65px;
  height:65px;
  border-radius:20px;
  margin:0 auto 16px;
  font-size:40px;
}

.welcome h2 {color:white;font-size:24px;margin:8px}
.welcome p {color:var(--muted);font-size:14px}

.suggestions {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:12px 0;
  scrollbar-width:none;
}

.suggestions::-webkit-scrollbar {display:none}

.suggestion {
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:20px;
  padding:11px 15px;
  font-size:13px;
  cursor:pointer;
}

.suggestion:active {background:var(--blue);color:white}

.connect-button {
  border:0;
  background:var(--blue);
  color:white;
  border-radius:22px;
  padding:12px 19px;
  font-weight:bold;
  cursor:pointer;
  margin:10px auto;
}

#connectionStatus {
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

#thinking {
  display:none;
  padding:0 18px 9px;
  font-size:12px;
  font-style:italic;
  opacity:.45;
}

.composer-area {
  padding:8px 12px max(12px,env(safe-area-inset-bottom));
  background:var(--bg);
}

.composer {
  display:flex;
  align-items:flex-end;
  gap:5px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:28px;
  padding:7px;
  transition:.2s;
}

.composer:focus-within {
  border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(10,132,255,.3);
}

.composer button {
  flex-shrink:0;
  width:39px;
  height:39px;
  border:0;
  background:none;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.composer button svg {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#input {
  flex:1;
  min-width:0;
  max-height:120px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  font-size:16px;
  padding:10px 4px;
  font-family:inherit;
}

#input::placeholder {color:var(--muted)}

#send {
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  box-shadow:0 0 10px #0a84ff66;
}

#send svg {width:21px;height:21px}

#settings {
  display:none;
  position:absolute;
  z-index:10;
  top:8px;
  right:10px;
  width:min(320px,calc(100% - 20px));
  max-height:85%;
  overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  box-shadow:0 10px 40px #0009;
}

/* NOUVEAU : EN-TÊTE DES PARAMÈTRES ET BOUTON RETOUR */
.settings-header {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:17px;
}

.settings-header h3 {
  margin:0;
  color:white;
  font-size:17px;
}

.back-button {
  width:38px;
  height:38px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--input);
  color:white;
  cursor:pointer;
}

.back-button svg {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.setting {margin-bottom:17px}
.setting label {display:block;font-size:13px;margin-bottom:8px}

.setting select {
  width:100%;
  padding:11px;
  border-radius:10px;
  background:var(--bg);
  border:1px solid var(--border);
  color:white;
}

.setting button {
  width:100%;
  padding:12px;
  background:var(--blue);
  border:0;
  color:white;
  border-radius:10px;
  cursor:pointer;
}

.setting .danger {background:#ef4444}

.colors {display:flex;gap:10px;flex-wrap:wrap}
.color {
  width:29px;
  height:29px;
  border-radius:50%;
  border:2px solid white;
  cursor:pointer;
}

#messages.stars {
  background-image:radial-gradient(#ffffff25 1px,transparent 1px);
  background-size:25px 25px;
}

#messages.grid {
  background-image:
    linear-gradient(#ffffff09 1px,transparent 1px),
    linear-gradient(90deg,#ffffff09 1px,transparent 1px);
  background-size:25px 25px;
}

.hidden {display:none!important}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">N</div>
    <span class="brand-name">Nova AI</span>

    <svg class="verified" viewBox="0 0 24 24">
      <path d="M12 1L15 3L19 3L20 7L23 10L21 14L21 18L17 19L14 23L10 21L6 21L5 17L1 14L3 10L3 6L7 5Z" fill="#0a84ff"/>
      <path d="M7 12L10 15L17 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <button class="icon-button" id="settingsButton" aria-label="Paramètres">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.1h-2.6v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.4v-2.6h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.1H15v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1V14h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
    </svg>
  </button>
</header>

<main>

<section id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-logo">N</div>
    <h2>Bonjour ! Je suis Nova AI 💙</h2>
    <p>Que pouvons-nous faire ensemble aujourd'hui ?</p>

    <button class="connect-button" id="connectButton">
      Connecter mon compte Pollinations
    </button>

    <div id="connectionStatus">
      Connexion Pollinations nécessaire pour discuter.
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion">En savoir plus sur l'AI</button>
      <button class="suggestion">Discuter</button>
      <button class="suggestion">Générer une image</button>
      <button class="suggestion">Raconter des histoires</button>
      <button class="suggestion">Aide cours / Rencontres</button>
    </div>
  </div>
</section>

<div id="thinking">Nova AI est en train de réfléchir...</div>

<div class="composer-area">
  <div class="composer">

    <button id="plusButton" aria-label="Options">
      <svg viewBox="0 0 24 24">
        <path d="M12 5V19M5 12H19"/>
      </svg>
    </button>

    <button id="imageButton" aria-label="Générer une image">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15L16 10L5 21"/>
      </svg>
    </button>

    <textarea id="input" rows="1" placeholder="Message à Nova AI..."></textarea>

    <button id="send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24">
        <path d="M22 2L11 13"/>
        <path d="M22 2L15 22L11 13L2 9Z"/>
      </svg>
    </button>

  </div>
</div>

<div id="settings">

  <!-- NOUVEAU : BOUTON RETOUR SVG -->
  <div class="settings-header">
    <button class="back-button" id="backToChat" aria-label="Retour à la discussion">
      <svg viewBox="0 0 24 24">
        <path d="M19 12H5"/>
        <path d="M12 19L5 12L12 5"/>
      </svg>
    </button>
    <h3>Paramètres NOVA AI</h3>
  </div>

  <div class="setting">
    <label>Compte Pollinations</label>
    <button id="settingsConnect">Connecter / renouveler l'accès</button>
    <button id="disconnectButton" style="margin-top:8px;background:#64748b">Déconnecter</button>
  </div>

  <div class="setting">
    <label>Thème couleur</label>
    <div class="colors">
      <button class="color" style="background:#0a84ff" data-color="#0a84ff"></button>
      <button class="color" style="background:#00c950" data-color="#00c950"></button>
      <button class="color" style="background:#eab308" data-color="#eab308"></button>
      <button class="color" style="background:#f97316" data-color="#f97316"></button>
      <button class="color" style="background:#111827" data-color="#111827"></button>
      <button class="color" style="background:#ffffff" data-color="#ffffff"></button>
    </div>
  </div>

  <div class="setting">
    <label>Mode</label>
    <select id="theme">
      <option value="dark">Sombre</option>
      <option value="light">Clair</option>
    </select>
  </div>

  <div class="setting">
    <label>Arrière-plan discussion</label>
    <select id="background">
      <option value="none">Aucun</option>
      <option value="stars">Étoiles lumineuses</option>
      <option value="grid">Grille subtile</option>
    </select>
  </div>

  <div class="setting">
    <label>Taille du texte</label>
    <select id="fontSize">
      <option value="14px">Petit</option>
      <option value="16px" selected>Moyen</option>
      <option value="19px">Grand</option>
    </select>
  </div>

  <div class="setting">
    <button class="danger" id="clearButton">Effacer toutes les discussions</button>
  </div>

  <div class="setting">
    <button id="closeSettings">Fermer</button>
  </div>
</div>

</main>

<script>
const $ = id => document.getElementById(id);

const messages = $("messages");
const input = $("input");

/* CONFIGURATION POLLINATIONS */
const POLLINATIONS_APP_KEY = "pk_UBqHJuhmMhptaZEi";

const REDIRECT_URI = "https://limyoun298-ai.github.io/Nova-AI/";

const AUTH_URL = "https://enter.pollinations.ai/authorize";
const TOKEN_URL = "https://enter.pollinations.ai/api/oauth/token";
const CHAT_URL = "https://gen.pollinations.ai/v1/chat/completions";
const MODEL = "openai/gpt-5.4-nano";

/* HISTORIQUE ET MÉMOIRE */
let history = JSON.parse(localStorage.getItem("nova_history") || "[]");
let memory = JSON.parse(localStorage.getItem("nova_memory") || "{}");
let settings = JSON.parse(localStorage.getItem("nova_settings") || "{}");

let accessToken = sessionStorage.getItem("nova_pollinations_token") || "";

function save() {
  localStorage.setItem("nova_history",JSON.stringify(history));
  localStorage.setItem("nova_memory",JSON.stringify(memory));
  localStorage.setItem("nova_settings",JSON.stringify(settings));
}

function addMessage(role,content) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;

  if(role === "ai") {
    const container = document.createElement("div");
    const label = document.createElement("div");
    label.className = "ai-label";
    label.textContent = "N Nova AI";
    container.appendChild(label);
    container.appendChild(bubble);
    row.appendChild(container);
  } else {
    row.appendChild(bubble);
  }

  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
}

function setConnectionStatus(text) {
  $("connectionStatus").textContent = text;
}

/* CONNEXION OAUTH AVEC PKCE */
function randomString(length=64) {
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b => b.toString(16).padStart(2,"0")).join("");
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

async function connectPollinations() {
  if(!window.crypto || !crypto.subtle) {
    alert("La connexion sécurisée nécessite HTTPS. Ouvre ton application depuis GitHub Pages.");
    return;
  }

  const verifier = randomString(48);
  const state = randomString(24);

  sessionStorage.setItem("nova_pkce_verifier",verifier);
  sessionStorage.setItem("nova_oauth_state",state);

  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(verifier)
  );

  const challenge = base64url(digest);

  const params = new URLSearchParams({
    response_type:"code",
    client_id:POLLINATIONS_APP_KEY,
    redirect_uri:REDIRECT_URI,
    scope:"profile usage",
    state:state,
    code_challenge:challenge,
    code_challenge_method:"S256",
    models:"text",
    budget:"5",
    expiry:"7"
  });

  window.location.href = AUTH_URL + "?" + params.toString();
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if(error) {
    window.history.replaceState(null,"",REDIRECT_URI);
    alert("Connexion Pollinations refusée ou annulée.");
    return;
  }

  if(!code) return;

  const expectedState = sessionStorage.getItem("nova_oauth_state");
  const verifier = sessionStorage.getItem("nova_pkce_verifier");

  if(!expectedState || returnedState !== expectedState || !verifier) {
    window.history.replaceState(null,"",REDIRECT_URI);
    alert("La vérification de connexion a échoué. Recommence la connexion.");
    return;
  }

  try {
    setConnectionStatus("Finalisation de la connexion Pollinations...");

    const response = await fetch(TOKEN_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({
        grant_type:"authorization_code",
        code:code,
        client_id:POLLINATIONS_APP_KEY,
        redirect_uri:REDIRECT_URI,
        code_verifier:verifier
      })
    });

    const data = await response.json();

    if(!response.ok || !data.access_token) {
      throw new Error(data.error_description || data.error || "Échange du code impossible.");
    }

    accessToken = data.access_token;

    /* Le jeton reste dans sessionStorage, jamais dans localStorage */
    sessionStorage.setItem("nova_pollinations_token",accessToken);

    sessionStorage.removeItem("nova_pkce_verifier");
    sessionStorage.removeItem("nova_oauth_state");

    window.history.replaceState(null,"",REDIRECT_URI);

    setConnectionStatus("Compte Pollinations connecté 💙");

    const pending = sessionStorage.getItem("nova_pending_message");
    sessionStorage.removeItem("nova_pending_message");

    if(pending) {
      await sendMessage(pending);
    }

  } catch(error) {
    console.error(error);
    window.history.replaceState(null,"",REDIRECT_URI);
    setConnectionStatus("Connexion impossible. Réessaie.");
    alert("Erreur de connexion Pollinations : " + error.message);
  }
}

/* MÉMOIRE LOCALE */
function extractMemory(text) {
  const match = text.match(/je m'appelle\s+([a-zA-ZÀ-ÿ'-]+)/i);

  if(match) {
    memory.name = match[1];
    save();
  }
}

function remember(text) {
  if(/rappelle.toi mon nom|tu te souviens de mon nom|quel est mon nom/i.test(text)) {
    return memory.name
      ? "Oui ! Tu m'as dit que tu t'appelles " + memory.name + " 💙"
      : "Tu ne m'as pas encore donné ton prénom.";
  }

  return null;
}

/* DISCUSSION AVEC POLLINATIONS */
async function sendMessage(text) {
  text = text.trim();
  if(!text) return;

  if(!accessToken) {
    sessionStorage.setItem("nova_pending_message",text);
    await connectPollinations();
    return;
  }

  $("welcome").classList.add("hidden");
  $("suggestions").classList.add("hidden");

  addMessage("user",text);

  history.push({role:"user",content:text});
  save();

  input.value = "";
  input.style.height = "auto";

  extractMemory(text);

  const remembered = remember(text);

  if(remembered) {
    addMessage("ai",remembered);
    history.push({role:"assistant",content:remembered});
    save();
    return;
  }

  $("thinking").style.display = "block";
  $("send").disabled = true;

  try {
    const systemPrompt =
      "Tu es Nova AI, une intelligence artificielle amicale, douce, respectueuse et utile. " +
      "Tu réponds en français sauf si l'utilisateur demande une autre langue. " +
      "Tu peux expliquer les cours, raconter des histoires et discuter naturellement. " +
      "Tu es honnête lorsque tu ne connais pas une réponse. " +
      "Tu peux utiliser quelques emojis avec modération. " +
      "Mémoire connue de l'utilisateur : " + JSON.stringify(memory);

    const apiMessages = [
      {role:"system",content:systemPrompt},
      ...history.slice(-30).map(item => ({
        role:item.role === "assistant" ? "assistant" : "user",
        content:item.content
      }))
    ];

    const response = await fetch(CHAT_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + accessToken
      },
      body:JSON.stringify({
        model:MODEL,
        messages:apiMessages,
        temperature:0.7
      })
    });

    const data = await response.json();

    if(!response.ok) {
      if(response.status === 401 || response.status === 403) {
        accessToken = "";
        sessionStorage.removeItem("nova_pollinations_token");
        throw new Error("Ton autorisation Pollinations a expiré ou a été révoquée. Reconnecte ton compte.");
      }

      throw new Error(data.error?.message || data.message || "Erreur API " + response.status);
    }

    const answer = data.choices?.[0]?.message?.content;

    if(!answer) {
      throw new Error("Pollinations n'a pas renvoyé de réponse.");
    }

    addMessage("ai",answer);
    history.push({role:"assistant",content:answer});
    save();

  } catch(error) {
    console.error("NOVA AI:",error);
    addMessage("ai","Je rencontre un problème : " + error.message + " 💙");
  } finally {
    $("thinking").style.display = "none";
    $("send").disabled = false;
  }
}

/* BOUTONS DE DISCUSSION */
$("send").addEventListener("click",() => sendMessage(input.value));

input.addEventListener("keydown",e => {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});

input.addEventListener("input",() => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,120) + "px";
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click",() => sendMessage(button.textContent));
});

$("connectButton").addEventListener("click",connectPollinations);
$("settingsConnect").addEventListener("click",connectPollinations);

$("disconnectButton").addEventListener("click",() => {
  accessToken = "";
  sessionStorage.removeItem("nova_pollinations_token");
  setConnectionStatus("Compte Pollinations déconnecté.");
  $("settings").style.display = "none";
});

/* PARAMÈTRES */
$("settingsButton").addEventListener("click",() => {
  $("settings").style.display =
    $("settings").style.display === "block" ? "none" : "block";
});

$("closeSettings").addEventListener("click",() => {
  $("settings").style.display = "none";
});

/* NOUVEAU : RETOUR À LA DISCUSSION */
$("backToChat").addEventListener("click",() => {
  $("settings").style.display = "none";
});

document.querySelectorAll(".color").forEach(button => {
  button.addEventListener("click",() => {
    settings.color = button.dataset.color;
    applySettings();
  });
});

$("theme").addEventListener("change",e => {
  settings.theme = e.target.value;
  applySettings();
});

$("background").addEventListener("change",e => {
  settings.background = e.target.value;
  applySettings();
});

$("fontSize").addEventListener("change",e => {
  settings.fontSize = e.target.value;
  applySettings();
});

function applySettings() {
  const root = document.documentElement;

  if(settings.color) {
    root.style.setProperty("--blue",settings.color);
    root.style.setProperty("--blue2",settings.color);
  }

  if(settings.theme === "light") {
    root.style.setProperty("--bg","#f1f5f9");
    root.style.setProperty("--panel","#e2e8f0");
    root.style.setProperty("--input","#fff");
    root.style.setProperty("--text","#1e293b");
  } else {
    root.style.setProperty("--bg","#0a0f1e");
    root.style.setProperty("--panel","#141e33");
    root.style.setProperty("--input","#1c2a45");
    root.style.setProperty("--text","#c2d4f0");
  }

  messages.classList.remove("stars","grid");

  if(settings.background === "stars") messages.classList.add("stars");
  if(settings.background === "grid") messages.classList.add("grid");

  if(settings.fontSize) {
    root.style.setProperty("--user-size",settings.fontSize);
  }

  $("theme").value = settings.theme || "dark";
  $("background").value = settings.background || "none";
  $("fontSize").value = settings.fontSize || "16px";

  save();
}

/* EFFACER LES DISCUSSIONS */
$("clearButton").addEventListener("click",() => {
  if(confirm("Effacer toutes les discussions ?")) {
    history = [];
    localStorage.removeItem("nova_history");

    messages.innerHTML = "";

    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";

    welcome.innerHTML = `
      <div class="welcome-logo">N</div>
      <h2>Bonjour ! Je suis Nova AI 💙</h2>
      <p>Que pouvons-nous faire ensemble aujourd'hui ?</p>
      <button class="connect-button" id="connectButton">Connecter mon compte Pollinations</button>
      <div id="connectionStatus">Connexion Pollinations nécessaire pour discuter.</div>
      <div class="suggestions" id="suggestions">
        <button class="suggestion">En savoir plus sur l'AI</button>
        <button class="suggestion">Discuter</button>
        <button class="suggestion">Générer une image</button>
        <button class="suggestion">Raconter des histoires</button>
        <button class="suggestion">Aide cours / Rencontres</button>
      </div>`;

    messages.appendChild(welcome);

    $("connectButton").addEventListener("click",connectPollinations);

    welcome.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click",() => sendMessage(button.textContent));
    });

    $("settings").style.display = "none";
  }
});

/* BOUTONS PLUS ET IMAGE */
$("plusButton").addEventListener("click",() => {
  addMessage("ai","Les pièces jointes seront ajoutées dans une prochaine version. 💙");
});

$("imageButton").addEventListener("click",() => {
  input.value = "Génère une image de ";
  input.focus();
});

/* RESTAURATION */
applySettings();

history.forEach(message => {
  addMessage(
    message.role === "assistant" ? "ai" : "user",
    message.content
  );
});

if(history.length > 0) {
  $("welcome").classList.add("hidden");
}

if(accessToken) {
  setConnectionStatus("Compte Pollinations connecté 💙");
}

/* TRAITEMENT DU RETOUR DE POLLINATIONS */
handleOAuthCallback();

</script>
