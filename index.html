<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#000"><title>NOVA AI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:#000;color:#fff;font:16px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
:root{--acc:#2f6bff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .1s,opacity .1s,background .15s}
button:active{transform:scale(.92);opacity:.7}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .4s}
#splash img{width:124px;height:124px;border-radius:32px}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.rb{position:absolute;top:max(10px,env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;z-index:5}
.rb svg{width:20px;height:20px}
#chat{flex:1;position:relative;isolation:isolate;overflow-y:auto;padding:64px 16px 12px;scroll-behavior:smooth;scrollbar-width:none;background:rgba(4,6,10,.42)}
#chat::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 18% 18%,rgba(55,75,105,.16),transparent 48%),radial-gradient(ellipse at 82% 62%,rgba(35,55,82,.13),transparent 50%),linear-gradient(145deg,rgba(255,255,255,.018),transparent 48%,rgba(75,95,125,.035));background-size:150% 150%;animation:chatFlow 24s ease-in-out infinite alternate}
@keyframes chatFlow{0%{background-position:0% 0%}100%{background-position:100% 100%}}
#chat::-webkit-scrollbar{display:none}
.col{position:relative;z-index:1;max-width:720px;margin:0 auto}
.u{display:flex;flex-direction:column;align-items:flex-end;margin:14px 0}
.bub{background:var(--acc);color:#fff;font-size:15px;line-height:1.5;padding:9px 14px;border-radius:20px;max-width:85%;white-space:pre-wrap;word-break:break-word;user-select:none}
.bub.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:13px;color:#999;margin-top:2px}
.emo{font-size:40px}
.imgs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img,.gen img{max-width:min(60vw,260px);border-radius:16px}
.st{font-size:12px;color:#888;margin-top:3px}.st.ok{animation:pop .4s}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.a{margin:12px 0 18px;color:#fff;font-size:15px;line-height:1.55;word-break:break-word}
.a p{margin:.5em 0}.a h1,.a h2,.a h3{margin:.8em 0 .3em;line-height:1.25}.a ul,.a ol{padding-left:22px}
.a a{color:#4da3ff;text-decoration:underline}.a a:active{opacity:.5}
.a table{border-collapse:collapse;display:block;overflow-x:auto}.a td,.a th{border:1px solid #333;padding:4px 8px}
.code{background:#161616;border-radius:12px;margin:8px 0;overflow:hidden}
.code .h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#222;font-size:13px;color:#aaa}
.code pre{padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,monospace}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f8cff;animation:bl 1s infinite;vertical-align:middle}
@keyframes bl{50%{opacity:.15}}
.acts{display:flex;gap:6px;margin-top:6px}.acts button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#bbb}
.acts svg{width:18px;height:18px}.acts .t{font-size:13px;color:#999;align-self:center}
.src{font-size:13px;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.panelw{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-size:13px;color:#aaa;margin-bottom:8px}
.gen .btns{display:flex;gap:8px;margin-top:6px}.gen .btns button,.pill{background:#222;border-radius:16px;padding:6px 14px;font-size:14px}
#down{position:absolute;right:16px;bottom:96px;width:40px;height:40px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;z-index:4}
#down b{position:absolute;top:-6px;right:-4px;background:var(--acc);font-size:11px;min-width:18px;border-radius:9px;text-align:center}
#bar{padding:6px 12px max(10px,env(safe-area-inset-bottom));position:relative}
#chips{display:flex;gap:8px;padding:0 4px 6px;flex-wrap:wrap}
.chip{position:relative;background:#222;border-radius:12px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.box{display:flex;align-items:flex-end;gap:4px;background:#1c1c1e;border-radius:26px;padding:6px}
.ib{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#ddd}
.ib svg{width:22px;height:22px}
textarea{flex:1;background:none;border:0;outline:0;color:#fff;font:16px/1.4 Inter,system-ui;resize:none;max-height:140px;padding:7px 4px;min-width:0}
#brain.on{background:#fff;color:#000}
#send{background:var(--acc);color:#fff}#send:disabled{opacity:.35}
.menu{position:absolute;background:#2a2a2c;border-radius:16px;padding:6px;z-index:30;min-width:170px;box-shadow:0 8px 30px #000a;animation:pop .15s}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:10px;text-align:left}
.menu button:active{background:#3a3a3c}.menu svg{width:20px;height:20px}
#plus{left:12px;bottom:calc(64px + env(safe-area-inset-bottom))}
#scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:75%;background:#121212;transform:translateX(-100%);transition:transform .28s ease;z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#drawer h1{font:600 22px Inter,sans-serif;text-align:center;padding:18px 0}
.fn{color:#fff}
hr{border:0;border-top:1px solid #2a2a2a;margin:4px 14px}
.fn{display:flex;gap:14px;align-items:center;padding:12px 20px;width:100%;text-align:left}.fn svg{width:24px;height:24px;flex:none}
.fn:active{background:#222}
#hist{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
.hi{display:block;width:100%;padding:10px 20px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.hi:active{background:#222}
.ov{position:fixed;inset:0;background:#0d0d0d;z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:pop .2s}
.ov .top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.back{width:36px;height:36px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}.back svg{width:20px;height:20px}
.ov .top h2{font-size:18px;font-weight:600;margin-left:12px}.ov .top small{color:#777;font-size:12px;display:block;font-weight:400}
.ov .body{flex:1;overflow-y:auto;padding:8px 16px 24px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 10px;border-bottom:1px solid #222;text-align:left;gap:10px;border-radius:12px;color:#fff;transition:background .12s,color .12s}.row-left{display:flex;align-items:center;gap:13px;min-width:0}.row-left svg{width:22px;height:22px;flex:none;color:#bdbdbd}.row-left span{color:#fff}.row .chev{color:#777;font-size:22px;line-height:1}.row.selected,.row:active{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}.row.selected .row-left svg,.row.selected .row-left span,.row.selected .chev{color:var(--acc)}
.lab{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 4px}
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0}.sw button{width:40px;height:40px;border-radius:50%}
input.f{width:100%;background:#1c1c1e;border:0;border-radius:12px;padding:12px;color:#fff;font:16px Inter,sans-serif;outline:0;margin:8px 0}
#voice{background:#0a0a0f;z-index:70}
#cloud{margin:auto;width:184px;height:184px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.10),rgba(255,255,255,.025) 48%,rgba(0,0,0,.12) 100%);box-shadow:inset 0 0 34px rgba(255,255,255,.035),0 12px 42px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .3s;animation:cloudIdle 5s ease-in-out infinite}
#cloud svg{width:104px;height:70px;filter:drop-shadow(0 0 9px rgba(255,255,255,.18))}
#cloud.talk{animation:fl 1.7s ease-in-out infinite}
@keyframes cloudIdle{50%{transform:translateY(-3px)}}
@keyframes fl{50%{transform:scale(1.045) translateY(-4px)}}
.vb{display:flex;gap:6px;background:#1c1c1e;border-radius:26px;padding:6px;margin:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;padding:8px 16px;border-radius:16px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
</style></head><body>

function md(t){const codes=[];t=t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{codes.push([l,c]);return "\u0000"+(codes.length-1)+"\u0000"});

.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');

t=t.replace(/((?:^[-*] .*\n?)+)/gm,b=>"<ul>"+b.trim().split("\n").map(l=>"<li>"+l.replace(/^[-*] /,"")+"</li>").join("")+"</ul>");

t=t.split(/\n{2,}/).map(p=>/^<(h\d|ul|ol|table)/.test(p.trim())||p.includes("\u0000")?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>{const[l,c]=codes[i];return `<div class="code"><div class="h"><span>${esc(l||"code")}</span><button data-copy="${i}">Copier</button></div><pre>${esc(c)}</pre></div>`})}

o.innerHTML=`<div class="top" style="justify-content:space-between"><button class="back">${I.back}</button><button class="back" id="vm">${I.dotsV}</button></div><div id="cloud">${I.cloud}</div><div class="vb"><textarea rows="1" placeholder="Écrire un message…" id="vt"></textarea><button class="ib" id="vs" style="background:var(--acc);color:#fff">${I.up}</button></div>`;
document.body.appendChild(o);const stop=()=>{try{speechSynthesis.cancel()}catch{}$("#cloud")?.classList.remove("talk")};
o.querySelector(".back").onclick=()=>{stop();o.remove()};o.querySelector("#cloud").onclick=stop;
o.querySelector("#vs").onclick=()=>{const t=o.querySelector("#vt").value.trim();if(!t)return;o.querySelector("#vt").value="";const go=()=>doSend(t,[],[]);
if(speechSynthesis.speaking){const w=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(w);go()}},300)}else go()};
o.querySelector("#vm").onclick=e=>{e.stopPropagation();closeMenus();const m=document.createElement("div");m.className="menu";m.style.cssText="top:60px;right:14px";
const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("fr"));
m.innerHTML=`<button data-a="on">Voix : ${S.voice.on?"activée":"désactivée"}</button><button data-a="auto">Lecture auto : ${S.voice.auto?"oui":"non"}</button><button data-a="rate">Vitesse : ${S.voice.rate}×</button><button data-a="v">Voix : ${S.voice.name||"défaut"}</button>`;
m.onclick=ev=>{const a=ev.target.closest("button")?.dataset.a;if(a==="on")S.voice.on=!S.voice.on;if(a==="auto")S.voice.auto=!S.voice.auto;if(a==="rate")S.voice.rate=S.voice.rate>=1.5?0.75:+(S.voice.rate+.25).toFixed(2);
if(a==="v"&&voices.length){const i=voices.findIndex(v=>v.name===S.voice.name);S.voice.name=voices[(i+1)%voices.length].name}save();m.remove()};o.appendChild(m);setTimeout(()=>document.addEventListener("click",closeMenus,{once:true}),50)}};
// ===== ERRORS / BOOT / PWA =====
window.addEventListener("error",e=>{console.warn(e.message)});window.addEventListener("unhandledrejection",e=>{e.preventDefault();console.warn(e.reason)});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
api({action:"health"},8000).catch(()=>{});
setTimeout(()=>{const s=$("#splash");s.style.opacity=0;setTimeout(()=>s.remove(),400)},900);
