<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="application-name" content="NOVA AI">
<meta name="description" content="NOVA AI — Ton assistant intelligent.">
<link rel="manifest" href="./manifest.json">
<title>NOVA AI</title>

<style>
:root {
  color-scheme:dark;
  --blue:#0a84ff;
  --blue2:#0865d5;
  --bg:#0a0f1e;
  --panel:#141e33;
  --input:#1c2a45;
  --border:#263957;
  --text:#e2eaf7;
  --muted:#94a3b8;
  --ai:#18243a;
  --user-size:15px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body {
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

button,textarea,select {font:inherit}
button {cursor:pointer}

header {
  flex-shrink:0;
  min-height:calc(58px + var(--safe-top));
  padding:var(--safe-top) 13px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  z-index:5;
}

.brand {
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.logo,.welcome-logo {
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  box-shadow:0 3px 14px #0a84ff45;
}

.logo {
  width:35px;
  height:35px;
  border-radius:11px;
  font-size:24px;
}

.brand-name {
  font-size:18px;
  font-weight:bold;
  color:white;
  letter-spacing:.3px;
}

.verified {
  width:15px;
  height:15px;
  flex-shrink:0;
  color:#00c950;
}

.header-actions {
  display:flex;
  align-items:center;
  gap:5px;
}

.icon-button {
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-button:active {background:var(--panel)}

svg {
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

#messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:12px 11px 15px;
  scroll-behavior:smooth;
  background-color:var(--bg);
}

#thinking {
  display:none;
  position:absolute;
  bottom:90px;
  left:10px;
  right:10px;
  z-index:2;
  padding:10px 13px;
  color:var(--muted);
  font-size:12px;
  align-items:center;
  gap:9px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:0 5px 18px #0004;
}

.dots {
  display:flex;
  gap:4px;
}

.dots span {
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--blue);
  animation:pulse 1s infinite;
}

.dots span:nth-child(2) {animation-delay:.15s}
.dots span:nth-child(3) {animation-delay:.3s}

@keyframes pulse {
  0%,80%,100% {opacity:.3;transform:translateY(0)}
  40% {opacity:1;transform:translateY(-4px)}
}

.welcome {
  width:100%;
  max-width:480px;
  margin:35px auto 15px;
  text-align:center;
}

.welcome-logo {
  width:64px;
  height:64px;
  border-radius:20px;
  margin:0 auto 14px;
  font-size:39px;
}

.welcome h2 {
  color:white;
  font-size:22px;
  margin:8px 0;
}

.welcome p {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:6px 0 20px;
}

.quick-title {
  text-align:left;
  font-size:12px;
  color:var(--muted);
  margin:13px 2px 9px;
}

.suggestions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.suggestion {
  min-height:47px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:9px;
  text-align:left;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:14px;
  font-size:12px;
  transition:.2s;
}

.suggestion svg {
  width:19px;
  height:19px;
  flex-shrink:0;
  color:var(--blue);
}

.suggestion:active {
  border-color:var(--blue);
  transform:scale(.98);
}

.message {
  display:flex;
  margin-bottom:13px;
  width:100%;
  flex-direction:column;
}

.message.ai {align-items:flex-start}
.message.user {align-items:flex-end}

.bubble {
  max-width:91%;
  padding:11px 14px;
  font-size:var(--user-size);
  line-height:1.55;
  overflow-wrap:anywhere;
  border-radius:18px;
}

.ai .bubble {
  background:var(--ai);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:17px 17px 17px 5px;
  white-space:normal;
}

.user .bubble {
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  border-radius:17px 17px 5px 17px;
  box-shadow:0 3px 12px #0003;
  white-space:pre-wrap;
  touch-action:pan-y;
  user-select:text;
}

.message-image {
  display:block;
  max-width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:12px;
  margin-top:8px;
}

.generated-image {
  width:100%;
  max-width:420px;
  display:block;
  border-radius:14px;
  margin-top:9px;
  cursor:pointer;
}

.message-actions {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin:6px 4px 0;
  opacity:.85;
}

.message-actions button {
  min-width:31px;
  min-height:30px;
  padding:5px 8px;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  font-size:11px;
}

.message-actions button:active {
  background:var(--panel);
  color:var(--blue);
}

/* Actions utilisateur masquées jusqu'à l'appui long */
.user .message-actions {
  display:none;
}

.user.actions-visible .message-actions {
  display:flex;
}

/* Réactions SVG */
.reaction-button svg {
  width:18px;
  height:18px;
  display:block;
}

/* Présentation des réponses IA */
.ai-text {
  line-height:1.7;
  overflow-wrap:anywhere;
}

.ai-text p {
  margin:0 0 12px;
}

.ai-text p:last-child {margin-bottom:0}

.ai-text h1,.ai-text h2,.ai-text h3 {
  color:white;
  line-height:1.35;
  margin:16px 0 9px;
}

.ai-text h1 {font-size:21px}
.ai-text h2 {font-size:19px}
.ai-text h3 {font-size:17px}

.ai-text ul,.ai-text ol {
  padding-left:23px;
  margin:8px 0 13px;
}

.ai-text li {margin:5px 0}

.code-card {
  margin:12px 0;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:13px;
  background:#080d18;
  max-width:100%;
}

.code-header {
  min-height:38px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#111b2d;
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
}

.code-copy {
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel);
  color:var(--text);
  font-size:11px;
}

.code-card pre {
  margin:0;
  padding:13px;
  overflow-x:auto;
  white-space:pre;
  -webkit-overflow-scrolling:touch;
}

.code-card code {
  font-family:monospace;
  font-size:13px;
  line-height:1.6;
  color:#dbeafe;
}

.image-actions {
  display:flex;
  gap:8px;
  margin-top:10px;
}

.image-actions button {
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:8px 11px;
  border-radius:10px;
  font-size:12px;
}

#attachmentpreview {
  display:none;
  padding:8px 12px;
  gap:9px;
  overflow-x:auto;
  flex-shrink:0;
}

.preview-item {
  position:relative;
  flex-shrink:0;
}

.preview-item img {
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:11px;
  border:1px solid var(--border);
}

.remove-image {
  position:absolute;
  right:-5px;
  top:-5px;
  width:21px;
  height:21px;
  border-radius:50%;
  border:0;
  background:#ef4444;
  color:white;
  font-weight:bold;
}

.composer-area {
  flex-shrink:0;
  padding:8px 10px calc(8px + var(--safe-bottom));
  background:var(--bg);
  border-top:1px solid var(--border);
}

.composer {
  display:flex;
  align-items:flex-end;
  gap:3px;
  padding:6px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:25px;
  transition:.2s;
}

.composer:focus-within {
  border-color:var(--blue);
  box-shadow:0 0 0 2px #0a84ff20;
}

.composer button {
  width:39px;
  height:39px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.composer button:active {background:#ffffff12}

#input {
  flex:1;
  min-width:0;
  min-height:39px;
  max-height:115px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
  padding:10px 4px;
  line-height:1.35;
}

#input::placeholder {color:var(--muted)}

#send {
  width:40px;
  height:40px;
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  color:white;
  box-shadow:0 3px 12px #0a84ff55;
}

#send:disabled {opacity:.5}
#imagefile {display:none}

#settings {
  display:none;
  position:absolute;
  z-index:8;
  inset:7px 8px 7px;
  overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  padding:15px;
  box-shadow:0 12px 40px #0009;
}

.settings-header {
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:18px;
  position:sticky;
  top:-15px;
  background:var(--panel);
  padding:5px 0 12px;
  z-index:2;
}

.settings-header h3 {
  margin:0;
  color:white;
  font-size:17px;
}

.setting {margin-bottom:19px}

.setting-title {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:9px;
  color:var(--text);
}

.setting-title svg {
  width:19px;
  height:19px;
  color:var(--blue);
}

.setting select {
  width:100%;
  padding:12px;
  border-radius:11px;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  outline:none;
}

.setting-button {
  width:100%;
  min-height:44px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;
  text-align:left;
  margin-bottom:7px;
}

.setting-button svg {
  width:19px;
  height:19px;
  color:var(--blue);
}

.colors {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.color {
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #ffffff80;
  box-shadow:0 2px 6px #0005;
}

#messages.stars {
  background-image:radial-gradient(#ffffff25 1px,transparent 1px);
  background-size:24px 24px;
}

#messages.grid {
  background-image:
    linear-gradient(#ffffff09 1px,transparent 1px),
    linear-gradient(90deg,#ffffff09 1px,transparent 1px);
  background-size:25px 25px;
}

#messages.glow {
  background-image:radial-gradient(ellipse at top,#0a84ff25,transparent 75%);
}

#messages.aurora {
  background-image:
    radial-gradient(ellipse at 20% 10%,#8b5cf625,transparent 45%),
    radial-gradient(ellipse at 90% 70%,#0a84ff20,transparent 50%);
}

#messages.gradient {
  background-image:linear-gradient(145deg,#0a84ff12,transparent 45%,#8b5cf612);
}

.hidden {display:none!important}

#modal {
  display:none;
  position:absolute;
  inset:0;
  z-index:20;
  background:#000a;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#modal.open {display:flex}

.modal-card {
  width:100%;
  max-width:420px;
  max-height:85%;
  overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  padding:19px;
  box-shadow:0 15px 45px #0009;
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.modal-header h3 {
  margin:0;
  font-size:17px;
  color:white;
}

.modal-content {
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}

.modal-content textarea {
  width:100%;
  min-height:100px;
  resize:vertical;
  padding:12px;
  border-radius:12px;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  outline:none;
}

.modal-primary {
  width:100%;
  padding:12px;
  margin-top:12px;
  background:var(--blue);
  border:0;
  color:white;
  border-radius:11px;
  font-weight:bold;
}

.modal-image {
  display:block;
  max-width:100%;
  max-height:65vh;
  margin:auto;
  object-fit:contain;
  border-radius:12px;
}

@media(min-width:600px) {
  main {
    width:100%;
    max-width:850px;
    margin:auto;
  }

  header {
    padding-left:max(16px,calc((100% - 850px)/2));
    padding-right:max(16px,calc((100% - 850px)/2));
  }

  #messages {padding:20px}
  .composer-area {padding-left:20px;padding-right:20px}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">N</div>
    <span class="brand-name">NOVA AI</span>
    <svg class="verified" viewBox="0 0 24 24" aria-label="Compte vérifié">
      <path d="M12 2l2.5 2 3.2-.2 1.2 3 2.8 1.6-.8 3.1.8 3.1-2.8 1.6-1.2 3-3.2-.2-2.5 2-2.5-2-3.2.2-1.2-3-2.8-1.6.8-3.1-.8-3.1 2.8-1.6 1.2-3 3.2.2z" fill="#00c950" stroke="none"/>
      <path d="m8 12 2.5 2.5L16 9" stroke="white" stroke-width="2"/>
    </svg>
  </div>

  <div class="header-actions">
    <button class="icon-button" id="newchat" aria-label="Nouvelle discussion">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <button class="icon-button" id="settingsbutton" aria-label="Paramètres">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.1h-2.6v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1h-.1v-2.6h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.1h2.6v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v2.6h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </div>
</header>

<main>

<section id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-logo">N</div>
    <h2>Bonjour ! Je suis NOVA AI 💙</h2>
    <p>Ton assistant intelligent. Que pouvons-nous faire ensemble ?</p>

    <div class="quick-title">Découvrir NOVA AI</div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion" data-prompt="Explique-moi ce qu'est l'intelligence artificielle avec des exemples simples.">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3h.01"/></svg>
        En savoir plus sur l'IA
      </button>

      <button class="suggestion" data-prompt="Aide-moi à rédiger une demande d'emploi professionnelle.">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5h8v2m-8 5h8"/></svg>
        Demande d'emploi
      </button>

      <button class="suggestion" data-prompt="Aide-moi à préparer un programme de révision efficace pour mes cours.">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8m-8 4h8m-8 4h5"/></svg>
        Aide aux études
      </button>

      <button class="suggestion" data-prompt="Donne-moi des idées de projets numériques intéressants à réaliser.">
        <svg viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/></svg>
        Idées de projets
      </button>

      <button class="suggestion" data-prompt="Raconte-moi une histoire originale et captivante.">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8m-8 4h8"/></svg>
        Raconter une histoire
      </button>

      <button class="suggestion" data-prompt="Aide-moi à créer une image originale. Propose-moi des idées de prompts.">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5-8 8"/></svg>
        Créer une image
      </button>

      <button class="suggestion" data-prompt="Aide-moi à rédiger un message professionnel et bien présenté.">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8m-8 4h8m-8 4h5"/></svg>
        Rédaction
      </button>

      <button class="suggestion" data-prompt="Propose-moi un plan pour apprendre une nouvelle compétence.">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Apprendre
      </button>
    </div>
  </div>
</section>

<div id="thinking">
  <div class="dots"><span></span><span></span><span></span></div>
  NOVA AI réfléchit...
</div>

<div id="attachmentpreview"></div>

<div class="composer-area">
  <div class="composer">

    <button id="gallerybutton" aria-label="Ouvrir la galerie">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5-8 8"/>
      </svg>
    </button>

    <input id="imagefile" type="file" accept="image/*" multiple>

    <button id="imagebutton" aria-label="Générer une image">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/>
      </svg>
    </button>

    <textarea id="input" rows="1" placeholder="Message à NOVA AI..."></textarea>

    <button id="send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4z"/>
        <path d="M22 2 11 13"/>
      </svg>
    </button>
  </div>
</div>

<div id="settings">
  <div class="settings-header">
    <button class="icon-button" id="backtochat" aria-label="Retour">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h12"/></svg>
    </button>
    <h3>Paramètres NOVA AI</h3>
  </div>

  <div class="setting">
    <div class="setting-title">Apparence</div>
    <select id="theme">

/* AFFICHAGE SÉCURISÉ DU TEXTE IA */

function renderAIContent(container, text) {
  container.innerHTML = "";

  const lines = String(text || "").replace(/\r/g, "").split("\n");

  let paragraph = [];
  let list = null;
  let codeLines = [];
  let inCode = false;
  let codeLanguage = "";

  function addParagraph() {
    if (!paragraph.length) return;

    const p = document.createElement("p");
    p.textContent = paragraph.join(" ");
    container.appendChild(p);
    paragraph = [];
  }

  function closeList() {
    list = null;
  }

  function addCode() {
    const card = document.createElement("div");
    card.className = "code-card";

    const header = document.createElement("div");
    header.className = "code-header";

    const language = document.createElement("span");
    language.textContent = codeLanguage || "Code";

    const copy = document.createElement("button");
    copy.className = "code-copy";
    copy.textContent = "Copier";

    const codeText = codeLines.join("\n");

    copy.addEventListener("click", () => copyText(codeText));

    header.append(language, copy);

    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = codeText;

    pre.appendChild(code);
    card.append(header, pre);
    container.appendChild(card);

    codeLines = [];
  }

  for (const line of lines) {
    const fence = line.match(/^```([\w+-]*)\s*$/);

    if (fence) {
      addParagraph();
      closeList();

      if (!inCode) {
        inCode = true;
        codeLanguage = fence[1] || "";
      } else {
        inCode = false;
        addCode();
        codeLanguage = "";
      }

      continue;
    }

    if (inCode) {
      codeLines.push(line);
      continue;
    }

    if (!line.trim()) {
      addParagraph();
      closeList();
      continue;
    }

    const heading = line.match(/^(#{1,3})\s+(.+)$/);

    if (heading) {
      addParagraph();
      closeList();

      const h = document.createElement("h" + heading[1].length);
      h.textContent = heading[2];
      container.appendChild(h);
      continue;
    }

    const unordered = line.match(/^\s*[-*•]\s+(.+)$/);
    const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);

    if (unordered || ordered) {
      addParagraph();

      const type = unordered ? "ul" : "ol";

      if (!list || list.tagName.toLowerCase() !== type) {
        closeList();
        list = document.createElement(type);
        container.appendChild(list);
      }

      const li = document.createElement("li");
      li.textContent = (unordered || ordered)[1];
      list.appendChild(li);
      continue;
    }

    closeList();
    paragraph.push(line.trim());
  }

  addParagraph();

  if (inCode) addCode();
}

/* OAUTH PKCE */

function randomString(length = 48) {
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);

  return Array.from(bytes, b =>
    b.toString(16).padStart(2, "0")
  ).join("");
}

function base64Url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}

function tokenIsValid() {
  return !!accessToken && (!tokenExpiry || Date.now() < tokenExpiry - 60000);
}

async function connectPollinations() {
  if (!crypto.subtle) {
    openModal("Connexion sécurisée", "<p>Ouvre NOVA AI depuis son adresse HTTPS pour utiliser la connexion sécurisée.</p>");
    return;
  }

  const verifier = randomString(48);
  const state = randomString(24);

  sessionStorage.setItem("nova_pkce_verifier", verifier);
  sessionStorage.setItem("nova_oauth_state", state);

  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(verifier)
  );

  const challenge = base64Url(digest);

  const params = new URLSearchParams({
    response_type:"code",
    client_id:POLLINATIONS_APP_KEY,
    redirect_uri:REDIRECT_URI,
    scope:"profile usage",
    state,
    code_challenge:challenge,
    code_challenge_method:"S256",
    models:"text,image",
    budget:"5",
    expiry:"365"
  });

  location.href = AUTH_URL + "?" + params.toString();
}

/* TRAITEMENT DU MESSAGE EN ATTENTE */

async function processPendingMessage() {
  if (!tokenIsValid()) return;

  const pending = sessionStorage.getItem("nova_pending_message");
  if (!pending) return;

  sessionStorage.removeItem("nova_pending_message");

  if (pending.startsWith("/image ")) {
    await generateImage(pending.slice(7));
  } else {
    await sendMessage(pending);
  }
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(location.search);

  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if (error) {
    window.history.replaceState(null, "", REDIRECT_URI);
    openModal("Connexion annulée", "<p>Autorisation Pollinations annulée.</p>");
    return;
  }

  if (!code) return;

  const expectedState = sessionStorage.getItem("nova_oauth_state");
  const verifier = sessionStorage.getItem("nova_pkce_verifier");

  if (!expectedState || returnedState !== expectedState || !verifier) {
    window.history.replaceState(null, "", REDIRECT_URI);
    openModal("Connexion invalide", "<p>La connexion n'a pas pu être vérifiée. Recommence.</p>");
    return;
  }

  try {
    const response = await fetch(TOKEN_URL, {
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({
        grant_type:"authorization_code",
        code,
        client_id:POLLINATIONS_APP_KEY,
        redirect_uri:REDIRECT_URI,
        code_verifier:verifier
      })
    });

    const data = await response.json();

    if (!response.ok || !data.access_token) {
      throw new Error(data.error_description || data.error || "Connexion impossible.");
    }

    accessToken = data.access_token;

    const expiresIn = Number(data.expires_in || 0);
    tokenExpiry = expiresIn ? Date.now() + expiresIn * 1000 : 0;

    sessionStorage.setItem("nova_pollinations_token", accessToken);
    sessionStorage.setItem("nova_token_expiry", String(tokenExpiry));

    sessionStorage.removeItem("nova_pkce_verifier");
    sessionStorage.removeItem("nova_oauth_state");

    window.history.replaceState(null, "", REDIRECT_URI);

    await processPendingMessage();

  } catch (error) {
    console.error(error);
    window.history.replaceState(null, "", REDIRECT_URI);
    addMessage("ai", "Connexion Pollinations impossible : " + error.message);
  }
}

fileinput.addEventListener("change", async event => {
  const files = Array.from(event.target.files || []);

  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;

    if (file.size > 12 * 1024 * 1024) {
      openModal("Image trop volumineuse", "<p>Une image dépasse 12 Mo. Choisis une image plus légère.</p>");
      continue;
    }

    if (selectedImages.length >= 4) {
      openModal("Limite atteinte", "<p>Tu peux joindre jusqu'à 4 images.</p>");
      break;
    }

    try {
      const data = await compressImage(file);
      selectedImages.push(data);
    } catch (error) {
      console.error(error);
    }
  }

  renderPreviews();
  fileinput.value = "";
});

async function compressImage(file) {
  const image = await createImageBitmap(file);

  const max = 1280;
  const scale = Math.min(1, max / Math.max(image.width, image.height));

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(image.width * scale);
  canvas.height = Math.round(image.height * scale);

  const ctx = canvas.getContext("2d");
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

  image.close?.();

  return canvas.toDataURL("image/jpeg", 0.78);
}

function renderPreviews() {
  const container = $("attachmentpreview");
  container.innerHTML = "";

  if (!selectedImages.length) {
    container.style.display = "none";
    return;
  }

  container.style.display = "flex";

  selectedImages.forEach((src, index) => {
    const item = document.createElement("div");
    item.className = "preview-item";

    const img = document.createElement("img");
    img.src = src;

    const remove = document.createElement("button");
    remove.className = "remove-image";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "Supprimer cette image");

    remove.addEventListener("click", () => {
      selectedImages.splice(index, 1);
      renderPreviews();
    });

    item.append(img, remove);
    container.appendChild(item);
  });
}

      "Pour le code, utilise des blocs Markdown avec trois accents graves et indique le langage. " +
      "Aide pour les études, les projets, la rédaction et les questions générales. " +
      "Si une image est jointe, analyse-la uniquement si tu peux réellement la voir. " +
      getStyleInstruction() +
      " Mémoire connue : " + JSON.stringify(memory);

    const apiMessages = [
      {role:"system",content:systemPrompt},
      ...chatHistory.slice(-24).map(item => ({
        role:item.role === "assistant" ? "assistant" : "user",
        content:item.content
      }))
    ];

    if (images.length) {
      apiMessages[apiMessages.length - 1] = {
        role:"user",
        content:[
          {type:"text",text:userContent},
          ...images.map(url => ({
            type:"image_url",
            image_url:{url}
          }))
        ]
      };
    }

    const response = await fetch(CHAT_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + accessToken
      },
      body:JSON.stringify({
        model:TEXT_MODEL,
        messages:apiMessages,
        temperature:0.8
      })
    });

    const data = await response.json();

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        accessToken = "";
        tokenExpiry = 0;
        sessionStorage.removeItem("nova_pollinations_token");
        sessionStorage.removeItem("nova_token_expiry");

        throw new Error("L'autorisation a expiré. Reconnecte Pollinations.");
      }

      throw new Error(data.error?.message || data.message || "Erreur API " + response.status);
    }

    let answer = data.choices?.[0]?.message?.content;

    if (Array.isArray(answer)) {
      answer = answer.map(part => part.text || "").join("\n");
    }

    if (!answer) throw new Error("Aucune réponse reçue.");

    chatHistory.push({role:"assistant",content:answer});
    addMessage("ai", answer, [], chatHistory.length - 1);
    save();

  } catch (error) {
    console.error("NOVA AI:", error);
    addMessage("ai", "Je rencontre un problème : " + error.message);
  } finally {
    showThinking(false);
    isSending = false;
    $("send").disabled = false;
  }
}

/* GÉNÉRATION D'IMAGES */

async function generateImage(prompt) {
  prompt = prompt.trim();

  if (!prompt) {
    input.value = "/image ";
    input.focus();
    return;
  }

  if (!tokenIsValid()) {
    sessionStorage.setItem("nova_pending_message", "/image " + prompt);
    await connectPollinations();
    return;
  }

  $("welcome")?.classList.add("hidden");

  addMessage("user", "🎨 Génère une image : " + prompt);

  showThinking(true);
  $("send").disabled = true;

  try {
    const url = IMAGE_URL + encodeURIComponent(prompt) +
      "?model=" + encodeURIComponent(IMAGE_MODEL) +
      "&width=1024&height=1024";

    const response = await fetch(url, {
      headers:{
        "Authorization":"Bearer " + accessToken
      }
    });

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        accessToken = "";
        sessionStorage.removeItem("nova_pollinations_token");
        sessionStorage.removeItem("nova_token_expiry");
      }

      throw new Error("Erreur de génération : " + response.status);
    }

    const blob = await response.blob();

    if (!blob.type.startsWith("image/")) {
      throw new Error("Le serveur n'a pas renvoyé une image.");
    }

    const blobUrl = URL.createObjectURL(blob);
    addGeneratedImage(blobUrl, prompt);

  } catch (error) {
    console.error(error);
    addMessage("ai", "Impossible de générer l'image : " + error.message);
  } finally {
    showThinking(false);
    $("send").disabled = false;
  }
}

/* ENVOI */

$("send").addEventListener("click", () => {
  const text = input.value.trim();

  if (text.startsWith("/image ")) {
    generateImage(text.slice(7));
  } else if (/^génère une image de /i.test(text)) {
    generateImage(text.replace(/^génère une image de /i, ""));
  } else {
    sendMessage(text);
  }
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("send").click();
  }
});

function applySettings() {
  const root = document.documentElement;

  const color = settings.color || "#0a84ff";
  root.style.setProperty("--blue", color);
  root.style.setProperty("--blue2", color);

  let theme = settings.theme || "dark";

  if (theme === "system") {
    theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }

  if (theme === "light") {
    root.style.colorScheme = "light";
    root.style.setProperty("--bg", "#f1f5f9");
    root.style.setProperty("--panel", "#ffffff");
    root.style.setProperty("--input", "#e2e8f0");
    root.style.setProperty("--border", "#cbd5e1");
    root.style.setProperty("--text", "#1e293b");
    root.style.setProperty("--muted", "#64748b");
    root.style.setProperty("--ai", "#ffffff");
  } else {
    root.style.colorScheme = "dark";
    root.style.setProperty("--bg", "#0a0f1e");
    root.style.setProperty("--panel", "#141e33");
    root.style.setProperty("--input", "#1c2a45");
    root.style.setProperty("--border", "#263957");
    root.style.setProperty("--text", "#e2eaf7");
    root.style.setProperty("--muted", "#94a3b8");
    root.style.setProperty("--ai", "#18243a");
  }

  messages.classList.remove("stars","grid","glow","aurora","gradient");

  if (settings.background && settings.background !== "none") {
    messages.classList.add(settings.background);
  }

  root.style.setProperty("--user-size", settings.fontsize || "15px");

  $("theme").value = settings.theme || "dark";
  $("background").value = settings.background || "none";
  $("fontsize").value = settings.fontsize || "15px";
  $("responseStyle").value = settings.responseStyle || "auto";
}

document.querySelectorAll(".color").forEach(button => {
  button.addEventListener("click", () => {
    settings.color = button.dataset.color;
    applySettings();
    save();
  });
});

$("theme").addEventListener("change", event => {
  settings.theme = event.target.value;
  applySettings();
  save();
});

$("background").addEventListener("change", event => {
  settings.background = event.target.value;

  save();
});

$("fontsize").addEventListener("change", event => {

});

$("responseStyle").addEventListener("change", event => {

});
