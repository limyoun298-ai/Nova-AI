<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111B21">
<meta name="application-name" content="NOVA AI">
<meta name="description" content="NOVA AI — Ton assistant intelligent.">
<link rel="manifest" href="./manifest.json">
<title>NOVA AI</title>

<style>
:root{
  --bg:#111B21;
  --chat:#1E1E1E;
  --ai:#2D2D2D;
  --accent:#0084FF;
  --text:#E9EDEF;
  --muted:#8696A0;
  --border:#333333;
  --green:#00C950;
  --red:#EF4444;
  --kb:0px;
  --fs:15px;
}

/* THÈMES (changent vraiment les fonds) */
body[data-theme="neon"]{--bg:#0A0F2C;--chat:#10163A;--ai:#1B2250;--accent:#00B8D9;--border:#2B3470}
body[data-theme="sunrise"]{--bg:#2A1220;--chat:#3A1A22;--ai:#4D2430;--accent:#FF7A18;--border:#5A2F3A}
body[data-theme="sky"]{--bg:#050B1E;--chat:#0A1330;--ai:#16224A;--accent:#4DA3FF;--border:#1F2F5E}
body[data-theme="forest"]{--bg:#0C1A12;--chat:#122319;--ai:#1E3326;--accent:#2ECC71;--border:#26402F}
body[data-theme="ocean"]{--bg:#061A2B;--chat:#0A2540;--ai:#123556;--accent:#22B8CF;--border:#1B4468}
body[data-theme="volcano"]{--bg:#1A0A08;--chat:#2A110D;--ai:#3D1B15;--accent:#FF4D2E;--border:#522A22}
body[data-theme="ice"]{--bg:#0E1B24;--chat:#14262F;--ai:#1F3844;--accent:#5CC8F0;--border:#2C4A58}
body[data-theme="desert"]{--bg:#241A0E;--chat:#2F2314;--ai:#42321D;--accent:#E0A458;--border:#5A452B}
body[data-theme="cyberpunk"]{--bg:#120022;--chat:#1A0733;--ai:#2A0F4D;--accent:#E91EC4;--border:#451A73}
body[data-theme="minimal"]{--bg:#FFFFFF;--chat:#F5F6F8;--ai:#E9EDF2;--accent:#0084FF;--border:#DADFE6;--text:#111B21;--muted:#667085}
body[data-theme="oled"]{--bg:#000000;--chat:#000000;--ai:#161616;--accent:#0084FF;--border:#222222}

body.light{
  --bg:#F4F6FA;
  --chat:#FFFFFF;
  --ai:#E9EDF4;
  --text:#171D29;
  --muted:#667085;
  --border:#D8DFEA;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  font-size:15px;
  -webkit-user-select:none;
  user-select:none;
}

textarea,input{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer;color:inherit;background:transparent}
.hidden{display:none!important}

svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  height:100dvh;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* MARQUE */
.brand-circle{
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--accent);
  display:grid;
  place-items:center;
  color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  flex-shrink:0;
}
.brand-circle svg.brand{width:46px;height:46px;stroke:none;fill:none}
.brand-circle.small{width:32px;height:32px;box-shadow:none}
.brand-circle.small svg.brand{width:20px;height:20px}

#splash{
  position:absolute;
  inset:0;
  z-index:1000;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  transition:opacity .35s;
}
.splash-name{font-size:25px;font-weight:800;letter-spacing:1px}
.splash-sub{font-size:13px;color:var(--muted)}

/* HEADER */
#mainHeader{
  height:60px;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:6px;min-width:0}
.header-brand{display:flex;align-items:center;gap:8px;margin-left:2px}
.header-title{font-weight:700;font-size:19px;color:var(--text)}
#mainHeader.on-home .header-brand{display:none}
.header-right{display:flex;align-items:center}

.icon-btn{
  width:44px;
  height:44px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:var(--text);
}
.icon-btn:active{background:rgba(128,128,128,.2)}
#menuBtn svg{width:28px;height:28px}

#content{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

.page{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  min-height:0;
  background:var(--bg);
}
.page.active{display:flex}

/* ACCUEIL */
#homePage{
  overflow-y:auto;
  align-items:center;
  padding:20px 20px 16px;
}
.home-inner{
  margin-top:auto;
  width:100%;
  max-width:430px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.home-name{font-size:20px;font-weight:800;color:#fff;margin-top:12px;text-align:center}
body.light .home-name,body[data-theme="minimal"] .home-name{color:var(--text)}
.home-hello{font-size:22px;color:var(--text);margin:6px 0 20px;text-align:center}
.suggestions{
  width:90%;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.suggestion{
  background:var(--ai);
  border:1px solid var(--border);
  border-radius:20px;
  padding:13px 17px;
  text-align:left;
  font-size:15px;
  color:var(--text);
  min-height:48px;
  transition:transform .15s,opacity .15s;
}
.suggestion:active{transform:scale(.98);opacity:.85}

/* DISCUSSION */
#chatPage{overflow:hidden;background:var(--chat)}

#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:14px 12px 14px;
  overscroll-behavior:contain;
  background:var(--chat);
}

.message-row{
  width:100%;
  display:flex;
  flex-direction:column;
  animation:messageAppear .2s ease-out;
}
@keyframes messageAppear{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.message-row.user{align-items:flex-end}
.message-row.ai{align-items:flex-start}
.message-row.flash .bubble{outline:2px solid var(--accent)}

.msg-body{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-width:100%;
  width:100%;
}
.message-row.user .msg-body{align-items:flex-end}
.message-row.ai .msg-body{align-items:flex-start}

.bubble{
  width:max-content;
  padding:10px 14px;
  font-size:var(--fs);
  line-height:1.55;
  overflow-wrap:anywhere;
  white-space:normal;
}
.user .bubble{
  max-width:75%;
  background:var(--accent);
  color:#fff;
  border-radius:18px 18px 4px 18px;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.ai .bubble{
  max-width:88%;
  background:var(--ai);
  color:var(--text);
  border-radius:18px 18px 18px 4px;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}

.message-line{
  display:block;
  min-height:1.55em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message-line.blank{height:.5em;min-height:.5em}
.message-line strong{font-weight:700}
.message-line em{font-style:italic}
.message-line code{
  background:rgba(0,0,0,.35);
  color:#9BC2FF;
  padding:1px 5px;
  border-radius:5px;
  font-family:Consolas,monospace;
  font-size:.9em;
}

.quote-block{
  max-width:75%;
  background:rgba(128,128,128,.18);
  border-left:3px solid var(--accent);
  border-radius:10px;
  padding:6px 10px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:3px;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
}

.message-status{
  font-size:11px;
  color:var(--muted);
  margin:3px 6px 0;
}
.message-status.failed{color:#ff7b7b}

.message-image{
  display:block;
  max-width:70%;
  max-height:340px;
  object-fit:contain;
  border-radius:12px;
  background:var(--ai);
  border:1px solid var(--border);
}
.image-actions{
  display:flex;
  gap:6px;
  margin:6px 0 2px;
}
.image-actions button{
  background:var(--ai);
  border:1px solid var(--border);
  color:var(--text);
  font-size:12px;
  padding:6px 11px;
  border-radius:14px;
}
.image-actions button:active{opacity:.7}

.ai-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin:6px 0 0 4px;
}
.ai-actions button{
  color:var(--text);
  padding:5px;
  display:grid;
  place-items:center;
}
.ai-actions button.on{color:var(--accent)}
.ai-actions svg{width:20px;height:20px}

.code-wrap{
  max-width:92%;
  width:100%;
  background:#0D1117;
  border-radius:12px;
  overflow:hidden;
  margin-top:2px;
  border:1px solid #30363D;
}
.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 12px;
  background:#161B22;
  font-size:12px;
  color:#C9D1D9;
}
.code-head .code-btns{display:flex;gap:14px}
.code-head button{color:#E6EDF3;font-size:12px}
pre{
  margin:0;
  padding:12px;
  overflow-x:auto;
  white-space:pre;
}
pre code{
  font-family:Consolas,"Courier New",monospace;
  font-size:13px;
  color:#E6EDF3;
}
.hl-c{color:#8B949E}
.hl-s{color:#A5D6FF}
.hl-t{color:#7EE787}
.hl-n{color:#79C0FF}
.hl-k{color:#FF7B72}

/* Indicateur IA */
.ai-status{
  background:var(--ai);
  color:var(--muted);
  font-size:13px;
  padding:9px 14px;
  border-radius:16px 16px 16px 4px;
  width:max-content;
  animation:pulse 1.2s infinite ease-in-out;
}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* COMPOSER */
#composer{
  display:flex;
  flex-direction:column;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom) + var(--kb));
  flex-shrink:0;
  background:var(--bg);
  border-top:1px solid var(--border);
}
.composer-row{display:flex;align-items:center;gap:8px}

#attachBar,#replyBar{
  display:none;
  align-items:center;
  gap:10px;
  padding:6px 4px 8px;
}
#attachBar.show,#replyBar.show{display:flex}
#attachBar img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
#attachBar .attach-label{flex:1;font-size:13px;color:var(--muted)}
#replyBar{
  background:rgba(128,128,128,.14);
  border-left:3px solid var(--accent);
  border-radius:10px;
  margin-bottom:6px;
  padding:6px 8px 6px 10px;
}
#replyBar .reply-text{
  flex:1;
  font-size:13px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.mini-x{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.mini-x svg{width:18px;height:18px}

#plusBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--ai);
  display:grid;
  place-items:center;
  flex-shrink:0;
  color:#fff;
}
body.light #plusBtn,body[data-theme="minimal"] #plusBtn{color:var(--text)}
#plusBtn svg{width:24px;height:24px;stroke-width:2.4}

#messageInput{
  flex:1;
  min-width:0;
  height:45px;
  max-height:120px;
  resize:none;
  border:0;
  outline:none;
  border-radius:24px;
  background:var(--ai);
  color:var(--text);
  padding:12px 16px;
  font-size:15px;
  line-height:21px;
}
#messageInput::placeholder{color:var(--muted);opacity:.6}

#sendBtn{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--accent);
  display:grid;
  place-items:center;
  color:#fff;
}
#sendBtn svg{width:27px;height:27px;color:#fff}

/* PARAMÈTRES */
#settingsPage,#subPage,#searchPage,#memoryPage,#toolPage{
  overflow-y:auto;
  padding-bottom:25px;
}
.page-heading{
  display:flex;
  align-items:center;
  gap:12px;
  height:60px;
  min-height:60px;
  padding:0 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.page-heading strong{font-size:19px}
.page-heading svg{width:27px}

.setting-row{
  min-height:60px;
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px 17px;
  border-bottom:1px solid var(--ai);
  text-align:left;
  color:var(--text);
}
.setting-row>svg{width:26px;height:26px}
.setting-row .setting-label{font-size:15px;font-weight:600}
.setting-row .setting-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.setting-row .row-text{flex:1}

.settings-footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  opacity:.5;
  line-height:1.6;
  padding:22px 22px 6px;
}
.settings-links{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:6px 0 10px;
  font-size:13px;
  color:var(--muted);
}
.settings-links button{color:var(--accent);font-size:13px}

.sub-content{padding:18px}
.sub-description{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 6px}

.choice{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 5px;
  border-bottom:1px solid var(--ai);
  font-size:15px;
}
.choice input{accent-color:var(--accent);width:18px;height:18px}

.theme-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.theme-card{
  min-height:84px;
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:flex-end;
  font-size:13px;
  font-weight:700;
  border:2px solid transparent;
  color:#fff;
  text-align:left;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.theme-card.selected{border-color:#fff;outline:2px solid var(--accent)}

.action-button{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  margin-top:14px;
}
.action-button:disabled{opacity:.5}
.danger-button{background:var(--red)}
.grey-button{background:#334155}

.info-card{
  background:var(--ai);
  padding:18px;
  border:1px solid var(--border);
  border-radius:15px;
  font-size:14px;
  line-height:1.8;
  color:var(--text);
}

.badge{
  width:15px;
  height:15px;
  display:inline-grid;
  place-items:center;
  border-radius:50%;
  background:var(--green);
  vertical-align:middle;
}
.badge svg{width:10px;height:10px;stroke:#fff;stroke-width:3}

.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 4px;
  border-bottom:1px solid var(--ai);
  font-size:15px;
}
.switch{
  width:46px;
  height:26px;
  border-radius:20px;
  background:#555;
  position:relative;
  transition:background .2s;
}
.switch::after{
  content:"";
  position:absolute;
  top:3px;left:3px;
  width:20px;height:20px;
  border-radius:50%;
  background:#fff;
  transition:transform .2s;
}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* RECHERCHE / MÉMOIRE */
.search-box{padding:12px 14px;flex-shrink:0}
.search-box input{
  width:100%;
  height:44px;
  border-radius:22px;
  background:var(--ai);
  border:0;
  outline:none;
  padding:0 16px;
  color:var(--text);
}
.result-item{
  width:100%;
  text-align:left;
  padding:12px 16px;
  border-bottom:1px solid var(--ai);
  color:var(--text);
  display:block;
}
.result-item .r-title{font-size:12px;color:var(--accent);margin-bottom:3px}
.result-item .r-text{font-size:14px;line-height:1.5;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.empty-hint{padding:30px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.memory-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-bottom:1px solid var(--ai);
}
.memory-item .m-text{flex:1;font-size:14px;line-height:1.5}
.memory-item .m-time{font-size:11px;color:var(--muted);display:block;margin-top:3px}

/* OUTILS (projet / analyse / fichier) */
#toolPage.tool-dark{background:#0D1117;color:#E6EDF3}
#toolPage.tool-dark .page-heading{border-color:#30363D}
#toolPage.tool-dark .icon-btn,#toolPage.tool-dark .sub-description{color:#E6EDF3}
#toolPage.tool-dark .sub-description{color:#9BA7B4}
#toolPage.tool-dark .sheet-textarea{background:#161B22;border-color:#30363D;color:#E6EDF3}
.tool-result{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.tool-result .code-wrap{max-width:100%}
.tool-error{color:#ff9b9b;font-size:14px;line-height:1.6}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{
  background:#21262D;
  border:1px solid #30363D;
  color:#E6EDF3;
  border-radius:16px;
  padding:8px 14px;
  font-size:13px;
}
.file-card{
  background:#161B22;
  border:1px solid #30363D;
  border-radius:14px;
  padding:14px;
  color:#E6EDF3;
  line-height:1.6;
  font-size:14px;
}
.file-card .file-name{font-weight:700;margin-bottom:6px}

/* DRAWER */
#drawerOverlay,#sheetOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:50;
  display:none;
}
#drawerOverlay.show,#sheetOverlay.show{display:block}

#drawer{
  position:absolute;
  left:0;top:0;bottom:0;
  width:75%;
  max-width:340px;
  background:var(--bg);
  border-right:1px solid var(--border);
  padding:14px 10px;
  transform:translateX(-105%);
  transition:transform .25s;
  display:flex;
  flex-direction:column;
  gap:4px;
}
#drawerOverlay.show #drawer{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.drawer-title{font-size:20px;font-weight:700}
.drawer-nav{
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  padding:13px 10px;
  border-radius:12px;
  font-size:15px;
  text-align:left;
  color:var(--text);
}
.drawer-nav:active{background:rgba(128,128,128,.2)}
.drawer-nav svg{width:24px;height:24px}
.drawer-sep{height:1px;background:var(--border);margin:8px 6px}
.drawer-sub{font-size:12px;color:var(--muted);padding:4px 10px}
#conversationList{
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-height:0;
}
.conversation-item{
  text-align:left;
  padding:12px 10px;
  border-radius:10px;
  font-size:14px;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.conversation-item:active{background:rgba(128,128,128,.2)}

/* BOTTOM SHEET */
#bottomSheet{
  position:absolute;
  left:0;right:0;bottom:0;
  background:var(--chat);
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(110%);
  transition:transform .25s;
  max-height:88%;
  overflow-y:auto;
}
body.light #bottomSheet{box-shadow:0 -2px 14px rgba(0,0,0,.15)}

}
@keyframes spin{to{transform:rotate(360deg)}}
.busy-done-icon{display:none}
#busyOverlay.done .busy-spin{display:none}
#busyOverlay.done .busy-done-icon{display:grid}
#busyText{font-size:15px;color:var(--muted)}

async function chooseTheme(id,accent){
  if(!navigator.onLine){showToast("Connexion requise");return;}
  if(!requireFull()) return;
  if(settings.theme===id) return;

  await busy("en train de charger le thème...",2000,accent);
  settings.theme=id;
  saveSettings();
  applySettings();
  busyDone();
  renderSubpage("theme");
}

function renderSearch(q){
  const box=$("searchResults");
  box.innerHTML="";
  q=q.trim().toLowerCase();

  if(q.length<2){
    box.innerHTML='<div class="empty-hint">Tape au moins 2 lettres pour chercher dans tes messages.</div>';
    return;
  }

  let count=0;
  conversations.forEach(c=>{
    c.messages.forEach(m=>{
      if(count>=50||!m.text||!m.text.toLowerCase().includes(q)) return;
      count++;

      const b=document.createElement("button");
      b.className="result-item";
      const t=document.createElement("div");
      t.className="r-title";
      t.textContent=(c.title||"Discussion")+" · "+(m.role==="user"?"Toi":"Nova AI");
      const x=document.createElement("div");
      x.className="r-text";
      x.textContent=m.text;
      b.append(t,x);

      b.addEventListener("click",()=>{
        currentConversationId=c.id;
        renderMessages();
        showPage("chatPage");
        setTimeout(()=>{
          const row=document.querySelector(`[data-message-id="${m.id}"]`);
          if(row){
            row.scrollIntoView({block:"center"});
            row.classList.add("flash");
            setTimeout(()=>row.classList.remove("flash"),1800);
          }
        },120);
      });

      box.appendChild(b);
    });
  });

  if(!count) box.innerHTML='<div class="empty-hint">Aucun message trouvé.</div>';
}

/* MÉMOIRE (oubli après 2 jours) */
function loadMemory(){
  try{
    const arr=JSON.parse(localStorage.getItem(MEMORY_KEY)||"[]");
    const now=Date.now();
    const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.text&&now-x.ts<MEMORY_TTL);
    if(ok.length!==arr.length) localStorage.setItem(MEMORY_KEY,JSON.stringify(ok));
    return ok;
  }catch(e){return [];}
}
function saveMemory(arr){
  try{localStorage.setItem(MEMORY_KEY,JSON.stringify(arr));}catch(e){}
}
function addMemory(text){
  const arr=loadMemory();
  arr.push({id:uid(),text:text.slice(0,300),ts:Date.now()});
  saveMemory(arr.slice(-30));
}
function renderMemoryPage(){
  const box=$("memoryList");
  const arr=loadMemory();
  box.innerHTML="";

  if(!arr.length){
    box.innerHTML='<div class="empty-hint">Aucun souvenir pour le moment.<br>Dis « mémorise ça » ou « rappelle-toi » pour que je retienne quelque chose pendant 2 jours.</div>';
    return;
  }

  arr.slice().reverse().forEach(x=>{
    const row=document.createElement("div");
    row.className="memory-item";

    const wrap=document.createElement("div");
    wrap.className="m-text";
    wrap.textContent=x.text;

    const left=Math.max(0,MEMORY_TTL-(Date.now()-x.ts));
    const h=Math.ceil(left/3600000);

    time.className="m-time";
    time.textContent="Oublié dans "+(h>=24?Math.floor(h/24)+" j "+(h%24)+" h":h+" h");

    box.appendChild(row);
  });

/* FORMATAGE SÉCURISÉ DU TEXTE */
function cleanAIText(text){
  return String(text||"")
    .normalize("NFC")
    .replace(/\u0000/g,"")
    .replace(/[\u200B-\u200D\uFEFF]/g,"")
    .replace(/\uFFFD/g,"");
}

function appendInlineFormatted(container,text){
  const regex=/(\*\*(?!\s)[^*\n]+?(?<!\s)\*\*|(?<!\w)__(?!\s)[^_\n]+?(?<!\s)__(?!\w)|\*(?![\s*])[^*\n]+?(?<![\s*])\*|(?<![\w])_(?![\s_])[^_\n]+?(?<![\s_])_(?![\w])|`[^`\n]+`)/g;
  let last=0;
  let match;

  while((match=regex.exec(text))){
    if(match.index>last){
      container.appendChild(document.createTextNode(text.slice(last,match.index)));
    }

    const token=match[0];
    const el=document.createElement(
      token.startsWith("**")||token.startsWith("__")?"strong":
      token.startsWith("`")?"code":"em"
    );

    el.textContent=token.replace(/^(\*\*|__|\*|_|`)|(\*\*|__|\*|_|`)$/g,"");
    container.appendChild(el);
    last=regex.lastIndex;
  }

  if(last<text.length){
    container.appendChild(document.createTextNode(text.slice(last)));
  }
}

function appendFormattedLine(container,line){
  const div=document.createElement("div");

  if(!line.trim()){
    div.className="message-line blank";
    container.appendChild(div);
    return;
  }

  div.className="message-line";
  let text=line.trimEnd();

  if(/^#{1,6}\s/.test(text)){
    text=text.replace(/^#{1,6}\s+/,"");
    const strong=document.createElement("strong");
    appendInlineFormatted(strong,text);
    div.appendChild(strong);
  }else if(/^[-*+]\s/.test(text)){
    div.textContent="• ";
    appendInlineFormatted(div,text.replace(/^[-*+]\s+/,""));
  }else if(/^\d+\.\s/.test(text)){
    const match=text.match(/^(\d+\.)\s/);
    div.textContent=match[1]+" ";
    appendInlineFormatted(div,text.slice(match[0].length));
  }else if(/^---+$/.test(text)){
    div.textContent=" ";
  }else{
    appendInlineFormatted(div,text);
  }

  container.appendChild(div);
}

function splitCode(text){
  const out=[];
  const regex=/```([a-zA-Z0-9_+#-]*)[ \t]*\n?([\s\S]*?)```/g;
  let last=0,match;

  while((match=regex.exec(text))){
    if(match.index>last){
      out.push({text:text.slice(last,match.index),code:false});
    }
    out.push({text:match[2].replace(/\n$/,""),code:true,lang:match[1]});
    last=regex.lastIndex;
  }

  if(last<text.length){
    out.push({text:text.slice(last),code:false});
  }

  if(!out.length) out.push({text,code:false});
  return out;
}

function renderTextPart(container,text){
  text.split("\n").forEach(line=>appendFormattedLine(container,line));
}

/* COLORATION SYNTAXIQUE */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
const HL_RE=/(\/\/[^\n]*|#[ \t][^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(<\/?[A-Za-z][\w-]*)|(\b\d+(?:\.\d+)?\b)|(\b(?:function|const|let|var|return|if|else|elif|for|while|class|def|import|from|as|in|not|and|or|try|except|catch|finally|new|this|self|async|await|true|false|null|None|True|False|export|default|lambda|with|pass|break|continue|switch|case|throw|raise|yield|typeof|public|private|static|void)\b)/g;

function highlight(code){
  let out="",last=0,m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(code))){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?"c":m[2]?"s":m[3]?"t":m[4]?"n":"k";
    out+='<span class="hl-'+cls+'">'+esc(m[0])+'</span>';
    last=HL_RE.lastIndex;
  }
  return out+esc(code.slice(last));
}

const EXT={html:"html",python:"py",py:"py",javascript:"js",js:"js",css:"css",json:"json",java:"java",txt:"txt",text:"txt",md:"md",markdown:"md",sql:"sql",php:"php",c:"c",cpp:"cpp",bash:"sh",sh:"sh",xml:"xml",ts:"ts",typescript:"ts"};

function renderCodePart(container,part,withDownload){
  const wrap=document.createElement("div");
  wrap.className="code-wrap";

  const head=document.createElement("div");
  head.className="code-head";

  const label=document.createElement("span");
  label.textContent=part.lang||"Code";

  const btns=document.createElement("div");
  btns.className="code-btns";

  const copy=document.createElement("button");
  copy.textContent="Copier";
  copy.addEventListener("click",()=>copyText(part.text));
  btns.appendChild(copy);

  if(withDownload){
    const dl=document.createElement("button");
    dl.textContent="Télécharger";
    dl.addEventListener("click",()=>{
      const ext=EXT[(part.lang||"").toLowerCase()]||"txt";
      downloadBlob(new Blob([part.text],{type:"text/plain"}),"nova-fichier."+ext);
    });
    btns.appendChild(dl);
  }

  head.append(label,btns);

  const pre=document.createElement("pre");
  const code=document.createElement("code");
  code.innerHTML=highlight(part.text);

  pre.appendChild(code);
  wrap.append(head,pre);
  container.appendChild(wrap);
}

/* Rendu riche (texte + code) dans un conteneur, y compris texte partiel */
function renderRich(container,text){
  container.innerHTML="";
  if((text.match(/```/g)||[]).length%2===1) text+="\n```";

  splitCode(text).forEach(part=>{
    if(part.code){
      renderCodePart(container,part);
    }else if(part.text.trim()){
      const bubble=document.createElement("div");
      bubble.className="bubble";
      renderTextPart(bubble,part.text);
      container.appendChild(bubble);
    }
  });
}

function renderMessage(m,scroll=true){
  const row=document.createElement("div");
  row.className="message-row "+(m.role==="user"?"user":"ai");

    img.src=m.image;
    img.alt="Image de la conversation";
    row.appendChild(img);
    addImageActions(row,m.image);
  }

  if(m.quote){
    const q=document.createElement("div");
    q.className="quote-block";
    q.textContent=m.quote;
    row.appendChild(q);
  }

  if(m.text){
    const body=document.createElement("div");
    body.className="msg-body";
    renderRich(body,m.text);
    row.appendChild(body);

  if(m.role==="user"){
    if(m.status) row.appendChild(makeStatusEl(m.status));

    addAIActions(row,m);
  }

  addLongPress(row,m);

  $("messages").appendChild(row);
  if(scroll) scrollBottom();
  return row;
}

async function imageToBlob(src){
  const r=await fetch(src);
  return await r.blob();
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

async function downloadImage(src){
  try{
    const blob=await imageToBlob(src);
    const ext=(blob.type.split("/")[1]||"jpg").replace("jpeg","jpg");
    downloadBlob(blob,"nova-image."+ext);
    showToast("Image téléchargée");
  }catch(e){
    showToast("Téléchargement impossible");
  }
}

async function shareImage(src){
  try{
    const blob=await imageToBlob(src);
    const file=new File([blob],"nova-image."+((blob.type.split("/")[1]||"jpg").replace("jpeg","jpg")),{type:blob.type||"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
    }else{
      showToast("Partage d'image indisponible");
    }
  }catch(e){
    if(e&&e.name!=="AbortError") showToast("Partage impossible");
  }
}

/* IMPRESSION PROGRESSIVE : caractère par caractère, 25 ms */
async function typeAssistantMessage(text,conversationId){
  const c=conversations.find(x=>x.id===conversationId);
  if(!c) return null;

  const clean=cleanAIText(text);
  const m={
    id:uid(),
    role:"assistant",
    text:clean,
    timestamp:Date.now()
  };

  c.messages.push(m);
  saveData();

  if(currentConversationId!==conversationId) return m;

  const row=document.createElement("div");
  row.className="message-row ai";
  row.dataset.messageId=m.id;

  const body=document.createElement("div");
  body.className="msg-body";
  row.appendChild(body);
  $("messages").appendChild(row);

  let i=0;
  let skip=false;
  row.addEventListener("click",()=>{skip=true;});

  await new Promise(resolve=>{
    const timer=setInterval(()=>{
      if(!row.isConnected){
        clearInterval(timer);
        resolve();
        return;
      }

      i=skip?clean.length:i+1;

      /* évite de couper un emoji en deux */
      const code=clean.charCodeAt(i-1);
      if(i<clean.length&&code>=0xD800&&code<=0xDBFF) i++;

      renderRich(body,clean.slice(0,i));
      scrollBottom();

      if(i>=clean.length){
        clearInterval(timer);
        resolve();
      }
    },25);
  });

  if(row.isConnected){
    renderRich(body,clean);
    addAIActions(row,m);
    addLongPress(row,m);
    scrollBottom();
  }

  if(settings.notif&&document.hidden&&"Notification" in window&&Notification.permission==="granted"){
    try{new Notification("Nova AI",{body:"Nouvelle réponse"});}catch(e){}
  }

  return m;
}

  row.addEventListener("touchmove",cancel);

function buildSystemPrompt(extra){
  let s=NOVA_SYSTEM_PROMPT+langLine();
  const mem=loadMemory();
  if(mem.length){
    s+="\n\nSOUVENIRS DE L'UTILISATEUR (valables 2 jours) :\n"+mem.map(x=>"- "+x.text).join("\n");
  }
  if(extra) s+="\n\n"+extra;

function buildApiMessages(conversation,extra){
  const history=conversation.messages
    .filter(m=>(m.role==="user"||m.role==="assistant")&&!m.failed&&(m.text||m.image))
    .slice(-24);

  let lastImg=-1;
  history.forEach((m,i)=>{if(m.role==="user"&&m.image) lastImg=i;});

  const mapped=history.map((m,i)=>{
    const role=m.role==="assistant"?"assistant":"user";
    let text=m.text||"";

    if(m.quote&&role==="user"){
      text='[En réponse à ce message de l\'assistant : "'+m.quote+'"]\n'+text;
    }

    /* Seule l'image la plus récente est envoyée en multimodal (payload plus léger) */
    if(m.image&&role==="user"){
      if(i===lastImg){
        return {
          role:"user",
          content:[
            {type:"text",text:text||"Analyse cette image et décris ce que tu observes."},
            {type:"image_url",image_url:{url:m.image}}
          ]
        };
      }
      return {role:"user",content:(text?text+" ":"")+"[image envoyée plus tôt]"};
    }

    return {role,content:text||"[image générée]"};
  });

  return [{role:"system",content:buildSystemPrompt(extra)},...mapped];
}

const SEARCH_TRIGGER=/(\bdate\b|\bprix\b|actu|2026|2025|m[ée]t[ée]o|\bscore\b|qui est|aujourd)/i;

async function webSearch(q){
  const query=q.slice(0,120);

  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(query)+"&format=json&no_html=1&skip_disambig=1",{signal:ctrl.signal});
    clearTimeout(t);
    const d=await r.json();
    const txt=d.AbstractText||(d.RelatedTopics&&d.RelatedTopics[0]&&d.RelatedTopics[0].Text)||"";
    if(txt) return txt.slice(0,700);
  }catch(e){}

  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch("https://fr.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch="+encodeURIComponent(query),{signal:ctrl.signal});
    clearTimeout(t);
    const d=await r.json();
    const hit=d.query&&d.query.search&&d.query.search[0];
    if(hit) return (hit.title+" : "+hit.snippet.replace(/<[^>]+>/g,"")).slice(0,700);
  }catch(e){}

  return "";
}

function planLoad(){

/* full = forfait actif (7200 s) · limited = 1 h texte seulement · locked = coupé 24 h */
function planState(){
  const now=Date.now();

  if(plan.lockUntil){
    if(now>=plan.lockUntil){
      plan={used:0,limitedStart:0,lockUntil:0};
      planSave();
    }else{
      return "locked";
    }
  }

  if(plan.used>=7200){
    if(!plan.limitedStart){
      plan.limitedStart=now;
      planSave();
    }
    if(now-plan.limitedStart>=3600000){
      plan.lockUntil=now+86400000;
      planSave();
      return "locked";
    }
    return "limited";
  }
  return "full";
}

function requireFull(){
  const st=planState();
  if(st!=="full"){
    if(st==="locked") showRecharge();
    else showToast("Recharge forfait pour débloquer");
    return false;
  }
  return true;
}

function showRecharge(){
  showSheet(`
    <div class="sheet-title">Recharge pour continuer</div>
    <p class="sub-description">Recharge forfait pour débloquer NOVA AI. Le chronomètre se remet à zéro dans 24 h.</p>

  $("rechargeOk").onclick=closeSheet;
}

let lastPlanState="full";
setInterval(()=>{
  const before=planState();
  if(before==="full"&&navigator.onLine&&!document.hidden){
    plan.used++;
    if(plan.used%15===0) planSave();
  }
  const now=planState();
  if(now!==lastPlanState){
    lastPlanState=now;
    if(now==="limited") showToast("Forfait épuisé : texte seulement pendant 1 h");
    if(now==="locked") showRecharge();
  }
},1000);

/* ENVOI */
function looksLikeCode(t){
  if(/```/.test(t)) return true;
  if(t.split("\n").length<3) return false;
  let score=0;
  if(/\b(def |function |class |import |#include|console\.log|print\(|const |let |var )|<\/?(html|div|body|script)/.test(t)) score++;
  if(/[{};]\s*$/m.test(t)) score++;
  if(/^\s{2,}\S/m.test(t)) score++;
  if(/<\w+[^>]*>/.test(t)&&/<\/\w+>/.test(t)) score++;
  return score>=2;
}

const MEMORY_TRIGGER=/(m[ée]morise|rappelle[- ]toi|souviens[- ]toi)/i;

function resetInput(){
  const el=$("messageInput");
  el.value="";
  el.style.height="45px";
}

async function sendMessage(opts){
  if(sending) return;

  const input=$("messageInput");
  let text=input.value.trim();
  const image=opts&&opts.imagePrompt?null:pendingImage;
  let imagePrompt=opts&&opts.imagePrompt?opts.imagePrompt:null;

  if(!imagePrompt&&text.toLowerCase().startsWith("/image ")){
    imagePrompt=text.slice(7).trim();
  }

  if(imagePrompt) text="Génère une image : "+imagePrompt;
  if(!text&&!image) return;

  const st=planState();
  if(st==="locked"){showRecharge();return;}
  if(imagePrompt&&st!=="full"){showToast("Recharge forfait pour débloquer");return;}

  /* Code détecté : analyse dans la page dédiée */
  if(!imagePrompt&&!image&&text.length>60&&looksLikeCode(text)){
    resetInput();
    openTool("analyze",text,true);
    return;
  }

  if(currentPage==="homePage"){
    const cur=currentConversation();
    if(!cur||cur.messages.length) createConversation(false);
    showPage("chatPage");
  }
  if(!currentConversation()) createConversation(false);

  const conversationId=currentConversationId;
  const quote=replyTo;

  resetInput();
  clearPending();
  clearReply();

  const userMessage=addUserMessage(text,image,quote);
  const mid=userMessage.id;
  const started=Date.now();

  if(!navigator.onLine){
    scheduleFail(conversationId,mid,60000);
    return;
  }

  sending=true;

  let label=imagePrompt?"génération d'une image...":"en train de réfléchir...";
  let stopSteps=null;

  /* Envoi... -> Envoyé -> disparaît quand l'AI réfléchit */
  const t1=setTimeout(()=>setStatus(conversationId,mid,"Envoyé"),700);
  const t2=setTimeout(()=>{
    setStatus(conversationId,mid,"");
    if(currentConversationId===conversationId) showAIStatus(label);
    if(imagePrompt) stopSteps=imageSteps();
  },1400);

  const setLabel=l=>{
    label=l;
    if($("aiStatus")) showAIStatus(l);
  };

  try{
    if(imagePrompt){
      if(!imagePrompt) throw new Error("empty_prompt");

      const img=await generateImage(imagePrompt);

      clearTimeout(t1);clearTimeout(t2);
      if(stopSteps) stopSteps();
      hideAIStatus();
      setStatus(conversationId,mid,"");

      const c=conversations.find(x=>x.id===conversationId);
      if(c){
        const imageMessage={
          id:uid(),
          role:"assistant",
          text:"Voici l'image générée.",
          image:img,
          timestamp:Date.now()
        };
        c.messages.push(imageMessage);
        saveData();
        if(currentConversationId===conversationId) renderMessage(imageMessage);
      }
    }else{
      let extra="";

      /* Mémoire */
      if(MEMORY_TRIGGER.test(text)){
        const cleaned=text.replace(MEMORY_TRIGGER,"").replace(/^[\s,:;.!-]+/,"").trim();
        let toStore=cleaned.length>3?cleaned:"";
        if(!toStore){
          const c0=conversations.find(x=>x.id===conversationId);
          const prev=c0?c0.messages.filter(x=>x.role==="user"&&x.id!==mid&&x.text).slice(-1)[0]:null;
          toStore=prev?prev.text:"";
        }
        if(toStore){
          addMemory(toStore);
          setLabel("mémorisé");
          if(!$("aiStatus")&&currentConversationId===conversationId){
            clearTimeout(t2);
            setStatus(conversationId,mid,"");
            showAIStatus("mémorisé");
          }
          await sleep(1300);
          setLabel("en train de réfléchir...");
          extra="L'utilisateur vient de te demander de mémoriser quelque chose. Confirme brièvement que c'est retenu pour 2 jours.";
        }
      }

      /* Recherche web légère */
      if(!extra&&SEARCH_TRIGGER.test(text)){
        clearTimeout(t2);
        setStatus(conversationId,mid,"");
        if(currentConversationId===conversationId) showAIStatus("recherche sur les documents...");
        label="recherche sur les documents...";
        const found=await webSearch(text);
        if(found){
          extra="Informations trouvées sur le web (peuvent être imparfaites ou datées) :\n"+found+"\nCommence ta réponse par « D'après ce que j'ai trouvé... » et reste prudent sur les incertitudes.";
        }
        setLabel("en train de réfléchir...");
      }

      const conversation=conversations.find(c=>c.id===conversationId);
      if(!conversation) throw new Error("conversation_missing");

      const answer=await callNovaAI(buildApiMessages(conversation,extra));

      clearTimeout(t1);clearTimeout(t2);
      hideAIStatus();
      setStatus(conversationId,mid,"");

      await typeAssistantMessage(answer,conversationId);
    }

  }catch(error){
    clearTimeout(t1);clearTimeout(t2);
    if(stopSteps) stopSteps();
    hideAIStatus();

    /* Pas de connexion utilisable : "Envoi..." pendant 60 s puis "Message non envoyé" */
    setStatus(conversationId,mid,"Envoi");
    scheduleFail(conversationId,mid,Math.max(0,60000-(Date.now()-started)));
  }finally{
    sending=false;
  }
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;

    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;

      img.onload=()=>{
        const max=1200;
        const ratio=Math.min(1,max/Math.max(img.width,img.height));

        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);

        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        resolve(canvas.toDataURL("image/jpeg",.78));
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function openTool(mode,prefill,auto){
  toolMode=mode;
  const cfg=TOOLS[mode];

  returnTo=currentPage==="chatPage"?"chatPage":"homePage";

  $("toolTitle").textContent=cfg.title;
  $("toolDesc").textContent=cfg.desc;
  $("toolInput").placeholder=cfg.ph;
  $("toolInput").value=prefill||"";
  $("toolRun").textContent=cfg.btn;
  $("toolResult").innerHTML="";
  $("toolPage").classList.toggle("tool-dark",cfg.dark);

  showPage("toolPage");

  if(auto) runTool();
}

$("toolRun").addEventListener("click",()=>runTool());

async function runTool(action){
  if(toolBusy) return;

  const text=$("toolInput").value.trim();
  if(!text){
    showToast("Écris d'abord ta demande");
    return;
  }
  if(!navigator.onLine){
    showToast("Connexion requise");
    return;
  }
  if(planState()==="locked"){
    showRecharge();
    return;
  }

  const cfg=TOOLS[toolMode];
  const out=$("toolResult");
  toolBusy=true;
  $("toolRun").disabled=true;
  out.innerHTML="";

  const st=document.createElement("div");
  st.className="ai-status";
  st.textContent=cfg.status;
  out.appendChild(st);

  try{
    const messages=[
      {role:"system",content:cfg.sys+langLine()},
      {role:"user",content:(action?action+"\n\n":"")+text}
    ];
    const answer=await callNovaAI(messages);
    renderToolResult(answer);
  }catch(e){
    out.innerHTML='<div class="tool-error">Impossible d\'obtenir une réponse pour le moment. Vérifie ta connexion et réessaie.</div>';
  }finally{
    toolBusy=false;
    $("toolRun").disabled=false;
  }
}

function renderToolResult(answer){
  const out=$("toolResult");
  out.innerHTML="";

  if(toolMode==="file"){
    const parts=splitCode(answer);
    const codePart=parts.find(p=>p.code);

    if(codePart){
      const summary=parts.filter(p=>!p.code).map(p=>p.text.trim()).join(" ").trim();
      const ext=EXT[(codePart.lang||"").toLowerCase()]||"txt";

      const card=document.createElement("div");
      card.className="file-card";

      const name=document.createElement("div");
      name.className="file-name";
      name.textContent="Fichier prêt : nova-fichier."+ext;

      const desc=document.createElement("div");
      desc.textContent=summary||"Ton fichier est prêt.";

      const more=document.createElement("button");
      more.className="action-button";
      more.textContent="Voir plus";
      more.addEventListener("click",()=>{
        more.remove();
        renderCodePart(out,codePart,true);
      });

      card.append(name,desc,more);
      out.appendChild(card);
      return;
    }
  }

  const body=document.createElement("div");
  body.className="msg-body";
  out.appendChild(body);
  renderRich(body,answer);
  body.querySelectorAll(".bubble").forEach(b=>{
    if(toolMode==="analyze"){
      b.style.background="#161B22";
      b.style.color="#E6EDF3";
    }
    b.style.maxWidth="100%";
    b.style.width="100%";
  });

  if(toolMode==="analyze"){
    const row=document.createElement("div");
    row.className="chip-row";
    [
      ["Expliquer","Explique ce code simplement, étape par étape."],
      ["Corriger","Corrige les erreurs de ce code et montre la version corrigée complète."],
      ["Améliorer","Améliore ce code (lisibilité, performances, bonnes pratiques) et montre la version améliorée."]
    ].forEach(([label,prompt])=>{
      const b=document.createElement("button");
      b.className="chip";
      b.textContent=label;
      b.addEventListener("click",()=>runTool(prompt));
      row.appendChild(b);
    });
    out.appendChild(row);
  }
}

/* COPIER ET PARTAGER */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Copié");
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();

    try{
      document.execCommand("copy");
      showToast("Copié");
    }catch(err){
      showToast("Copie impossible");
    }

    area.remove();
  }
}

async function shareText(text){
  if(!text){
    showToast("Aucun texte à partager");
    return;
  }

  if(navigator.share){
    try{
      await navigator.share({text});
    }catch(e){}
  }else{
    copyText(text);
    showToast("Texte copié pour le partager");
  }
}

/* CLAVIER ANDROID */
function adjustForAndroidKeyboard(){
  const root=document.documentElement;
  let baseH=window.innerHeight;
  let timer=null;

  const isInput=el=>el&&el.id==="messageInput";
  const setKb=px=>root.style.setProperty("--kb",px+"px");

  window.addEventListener("resize",()=>{
    if(!isInput(document.activeElement)) baseH=window.innerHeight;
  });

  document.addEventListener("focusin",e=>{
    if(!isInput(e.target)) return;
    clearTimeout(timer);

    timer=setTimeout(()=>{
      const vv=window.visualViewport;
      const shrunk=Math.max(
        baseH-window.innerHeight,
        vv?baseH-vv.height:0
      );

      /* Si le WebView s'est redimensionné seul, rien à faire */
      setKb(shrunk>80?0:Math.round(baseH*0.4));

      $("messages")?.scrollTo(0,99999);
      e.target.scrollIntoView({block:"nearest"});
    },350);
  });

  document.addEventListener("focusout",()=>{
    clearTimeout(timer);
    setTimeout(()=>{
      if(!isInput(document.activeElement)) setKb(0);
    },100);
  });
}
adjustForAndroidKeyboard();

function handleAppBack(){

    $("viewer").classList.remove("show");
    return true;
  }
  if($("sheetOverlay").classList.contains("show")){
    closeSheet();
    return true;
  }
  if($("drawerOverlay").classList.contains("show")){
    closeDrawer();
    return true;
  }
  if($("busyOverlay").classList.contains("show")){
    return true;
  }

  if(currentPage==="subPage"){showPage("settingsPage");return true;}
  if(currentPage==="settingsPage"){backFromSettings();return true;}
  if(currentPage==="searchPage"||currentPage==="memoryPage"||currentPage==="toolPage"){
    showPage(returnTo);
    return true;
  }
  if(currentPage==="chatPage"){showPage("homePage");return true;}

  return false;
}
