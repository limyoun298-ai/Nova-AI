<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Nova AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">
<style>
:root{--bg:#0b0b0b;--surf:color-mix(in srgb,var(--bg) 82%,#fff 18%);--txt:#f3f4f6;--mut:#9ca3af;--acc:#7C3AED;--bot:#2a2d34;--bottxt:#f3f4f6;--usr:#14532d;--send:#7C3AED;--fs:16px;--bd:rgba(255,255,255,.09)}
[data-mode=light]{--surf:#fff;--txt:#111827;--mut:#6b7280;--bot:#e5e7eb;--bottxt:#111827;--bd:rgba(0,0,0,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}

/* ÉCRAN DE DÉMARRAGE */
#splash{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:#000;
  color:#fff;
  transition:opacity .5s
}
#splash.off{opacity:0;pointer-events:none}
#splash .lg{
  width:100px;
  height:100px;
  padding:22px;
  border-radius:50%;
  background:rgba(124,58,237,.10);
  border:1px solid rgba(139,92,246,.23);
  box-shadow:0 0 35px rgba(124,58,237,.13);
  filter:none;
}
#splash h1,.spin{display:none}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);border-top-color:#8B5CF6;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

#app{display:none;flex-direction:column;height:100dvh;position:relative}
#app.on{display:flex}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--bd)}
header .lg{width:34px;height:34px;border-radius:50%;background:#1e1b4b;padding:5px}
header b{font-size:18px;font-weight:600;flex:1}
.ib0{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt)}
.ib0:active{background:var(--bd)}

/* DISCUSSION */
#chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overscroll-behavior:contain;
  background:#0b0b0b;
  scrollbar-width:thin;
  scrollbar-color:#444 transparent;
}
.empty{margin:auto;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .lg{width:64px;height:64px;opacity:.9}
.row{display:flex;flex-direction:column;max-width:88%}
.row.user{align-self:flex-end;align-items:flex-end}
.row.bot{align-self:flex-start;align-items:flex-start;max-width:94%}
.bubble{padding:10px 14px;border-radius:18px;box-shadow:0 2px 6px rgba(0,0,0,.25);overflow-wrap:anywhere;max-width:100%}
.user .bubble{background:var(--usr);color:#fff;border-bottom-right-radius:6px;-webkit-touch-callout:none;user-select:none}
.user .t{white-space:pre-wrap}
.bot .bubble{background:var(--bot);color:var(--bottxt);border-bottom-left-radius:6px}
.bubble p{margin:.3em 0}
.bubble p:first-child{margin-top:0}
.bubble p:last-child{margin-bottom:0}
.bubble h3,.bubble h4{margin:.6em 0 .3em}
.bubble ul,.bubble ol{margin:.3em 0;padding-left:1.3em}
.bubble code{background:rgba(127,127,127,.25);padding:1px 5px;border-radius:5px;font-size:.9em}
.bubble a{color:#3B82F6}
.pic{display:block;width:min(70vw,300px);aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:rgba(127,127,127,.2);margin-bottom:6px}
.user .pic{aspect-ratio:auto;max-height:300px}
.st{font-size:12px;color:var(--mut);margin-top:3px;min-height:0}
.st .retry{color:#f87171;text-decoration:underline}
.note{font-size:12px;color:var(--mut);margin-top:3px;max-width:260px;text-align:right}
.tw{overflow-x:auto;margin:.4em 0}
table{border-collapse:collapse;font-size:.92em}
th,td{border:1px solid var(--bd);padding:6px 10px;white-space:nowrap}
th{background:rgba(127,127,127,.2)}

/* BLOCS DE CODE */
.code{background:#0d1117;color:#e6edf3;border-radius:12px;margin:.5em 0;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.chead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#161b22;font-size:12px;color:#c9d1d9}
.ca{display:flex;gap:6px}
.ca button{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  border-radius:50%;
  background:rgba(255,255,255,.07);
}
.ca button:active{background:rgba(255,255,255,.2)}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.45;white-space:pre}
.code pre.col{
  max-height:112px;
  overflow-y:hidden;
  position:relative;
  mask-image:linear-gradient(to bottom,#000 65%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 65%,transparent 100%);
}
.code pre code{background:none;padding:0;font-size:inherit;color:inherit}

/* FENÊTRE POUR AFFICHER TOUT LE CODE */
#codeViewer{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  flex-direction:column;
  background:#0b0b0b;
  color:#f3f4f6;
  padding-top:env(safe-area-inset-top);
}
#codeViewer.on{display:flex}
.codev-head{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);
  background:#111;
}
.codev-title{font-size:14px;font-weight:600;color:#fff}
.codev-actions{display:flex;align-items:center;gap:9px}
.codev-actions button{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;background:rgba(255,255,255,.09);
}
.codev-actions button:active{background:rgba(255,255,255,.2)}
#codeViewer pre{
  flex:1;min-height:0;overflow:auto;margin:0;
  padding:18px 15px calc(24px + env(safe-area-inset-bottom));
  color:#e6edf3;
  font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:pre;tab-size:2;
}
#codeViewer code{font:inherit;color:inherit}

.srcs{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:13px}
.srcs a{color:#3B82F6;text-decoration:none}
.srcs small{color:var(--mut);display:block}
.acts{display:flex;gap:2px;margin-top:4px}
.acts button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mut);border-radius:50%}
.acts button.on{color:var(--acc)}
.ib{display:flex;gap:6px;margin-top:6px}
.ib button{width:36px;height:36px;border-radius:50%;background:rgba(127,127,127,.25);display:flex;align-items:center;justify-content:center}

/* INDICATEUR DE RÉDACTION */
.dots{display:inline-flex;gap:4px;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
.lbl{font-size:.92em;color:var(--mut)}
.pbar{height:3px;border-radius:3px;margin:8px 0;background:rgba(127,127,127,.25);overflow:hidden;position:relative}
.pbar:after{content:"";position:absolute;inset:0;width:40%;background:var(--acc);animation:sl 1.1s infinite}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.pcard{font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(127,127,127,.18);margin-top:4px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.skel{width:min(70vw,300px);aspect-ratio:1/1;border-radius:14px;margin-top:8px;background:linear-gradient(110deg,rgba(127,127,127,.2) 30%,rgba(255,255,255,.3) 50%,rgba(127,127,127,.2) 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err .bubble{border:1px solid #ef4444}

/* ZONE DE SAISIE */
.composer{margin:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surf);border-radius:26px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:6px;position:relative}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px}
#chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:14px;background:rgba(59,130,246,.18);color:#3B82F6}
.chip button{display:flex;color:inherit}
.chip img{width:22px;height:22px;border-radius:5px;object-fit:cover}
.inrow{display:flex;align-items:flex-end;gap:4px}
textarea{flex:1;background:none;border:0;outline:0;color:var(--txt);resize:none;font:inherit;caret-color:#3B82F6;max-height:140px;padding:10px 4px;line-height:1.4}
textarea::placeholder{color:var(--mut)}
.circ{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:none;border:1px solid var(--bd);
  background:rgba(127,127,127,.12);
  transition:background .18s,transform .18s;
}
.circ:active{transform:scale(.94);background:rgba(127,127,127,.23)}
#plus{color:var(--txt)}
#send{
  color:var(--send);
  border-color:color-mix(in srgb,var(--send) 40%,transparent);
  background:color-mix(in srgb,var(--send) 13%,transparent);
}
#send:disabled{opacity:.35}

/* TROIS POINTS FIXES AU-DESSUS DE LA SAISIE */
#typingStatus{
  display:none;min-height:27px;align-items:center;gap:9px;
  padding:3px 12px 6px;color:var(--mut);font-size:12px;
}
#typingStatus.on{display:flex}
#typingStatus .dots{margin:0;gap:4px}
#typingStatus .dots i{width:6px;height:6px}
#typingStatus .typing-label{color:var(--mut)}

/* MENU + */
#menu{position:absolute;left:6px;bottom:calc(100% + 8px);background:var(--surf);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.4);padding:6px;display:none;min-width:210px;z-index:20}
#menu.on{display:block}
#menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;text-align:left}
#menu button:active{background:var(--bd)}
#menu button.act{color:#3B82F6}

/* PARAMÈTRES */
#page{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#page.on{display:flex}
#page header b{font-size:17px}
#pb{flex:1;overflow-y:auto;padding:18px 16px}
.rowbtn{
  display:flex;justify-content:space-between;align-items:center;
  width:calc(100% - 12px);max-width:520px;min-height:64px;
  padding:14px 18px;margin:10px auto;
  background:var(--surf);border:1px solid var(--bd);
  border-radius:17px;text-align:left;
  transition:background .2s,transform .15s;
}
.rowleft{display:flex;align-items:center;gap:14px;color:#fff;font-size:15px;font-weight:500}
.rowleft svg{width:22px;height:22px;color:#fff;flex:none}
.rowbtn>svg{color:#9ca3af}
.rowbtn:active{background:var(--bd);transform:scale(.99)}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;background:var(--surf);border:2px solid transparent;text-align:center}
.seg button.sel{border-color:var(--acc)}
.h{font-size:13px;color:var(--mut);margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border-radius:14px;padding:10px;background:var(--surf);border:2px solid transparent;text-align:center;font-size:13px}
.sw.sel{border-color:var(--acc)}
.sw i{display:block;height:34px;border-radius:9px;margin-bottom:6px}
.sw small{display:block;color:var(--mut);font-size:10px}
.gimg{aspect-ratio:1/1;object-fit:cover;width:100%;border-radius:10px;background:var(--surf)}
.lang{display:flex;justify-content:space-between;width:100%;padding:14px;background:var(--surf);border-radius:12px;margin-bottom:8px}

/* FLÈCHE POUR REVENIR EN BAS */
#jumpBottom{
  position:absolute;left:50%;
  bottom:calc(var(--composer-h,82px) + env(safe-area-inset-bottom) + 15px);
  transform:translateX(-50%);
  z-index:15;width:43px;height:43px;display:none;
  align-items:center;justify-content:center;border-radius:50%;
  color:#a1a1aa;background:rgba(45,45,45,.96);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#jumpBottom.on{display:flex}
#jumpBottom:active{transform:translateX(-50%) scale(.94)}
#page.on~#jumpBottom{display:none!important}

/* AUTRES FENÊTRES */
#ld{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff}
#ld.on{display:flex}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet div{width:100%;background:var(--surf);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
#sheet button{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:12px}
#sheet button:active{background:var(--bd)}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
#viewer.on{display:flex}
#viewer img{max-width:94vw;max-height:72vh;border-radius:10px}
#viewer .vb{display:flex;gap:16px}
#viewer .vb button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.on{opacity:1}

/* MESSAGE DE SECOURS SI LE SCRIPT PRINCIPAL ÉCHOUE */
#bootError{
  display:none;
  margin:20px;
  padding:14px;
  border:1px solid rgba(248,113,113,.4);
  border-radius:14px;
  background:#211313;
  color:#fecaca;
  font-size:13px;
  text-align:center;
}
#bootError.on{display:block}
</style>
</head>

<!-- GARDE-FOU INDÉPENDANT DU SCRIPT PRINCIPAL -->
<script>
(function(){
  "use strict";
  window.setTimeout(function(){
    if(document.body.dataset.novaReady==="1")return;

    const app=document.getElementById("app");
    const splash=document.getElementById("splash");
    const chat=document.getElementById("chat");
    const error=document.getElementById("bootError");

    if(app)app.classList.add("on");
    if(chat&&!chat.children.length&&error){
      chat.appendChild(error);
      error.classList.add("on");
    }

    if(splash){
      splash.classList.add("off");
      window.setTimeout(function(){
        if(splash.parentNode)splash.remove();
      },650);
    }

    console.error("NOVA AI : le démarrage principal n'a pas terminé correctement.");
  },7000);
})();
</script>

/* ===================== INDEXEDDB ===================== */
const dbp=new Promise((res,rej)=>{
  try{
    const r=indexedDB.open("nova",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("imgs",{keyPath:"key"});
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }catch(e){rej(e)}
});

const idbPut=o=>dbp.then(d=>new Promise((res,rej)=>{
  const x=d.transaction("imgs","readwrite");
  x.objectStore("imgs").put(o);
  x.oncomplete=res;
  x.onerror=()=>rej(x.error);
})).catch(e=>console.warn("NOVA IndexedDB put:",e));

const idbGet=k=>dbp.then(d=>new Promise(res=>{
  const q=d.transaction("imgs").objectStore("imgs").get(k);
  q.onsuccess=()=>res(q.result);
  q.onerror=()=>res(null);
})).catch(()=>null);

const idbAll=()=>dbp.then(d=>new Promise(res=>{
  const q=d.transaction("imgs").objectStore("imgs").getAll();
  q.onsuccess=()=>res(q.result||[]);
  q.onerror=()=>res([]);
})).catch(()=>[]);

async function getImg(k){
  if(imgCache.has(k))return imgCache.get(k);
  const o=await idbGet(k);
  if(o){imgCache.set(k,o.src);return o.src}
  return null;
}

function fillImgs(root){

}

async function api(body,ms){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms||60000);
  try{
    const r=await fetch(ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY},
      body:JSON.stringify(body),
      signal:c.signal
    });
    let d=null;
    try{d=await r.json()}catch(e){}
    if(!r.ok||!d||d.success===false)throw new Error((d&&d.error)||("HTTP "+r.status));
    return d;
  }finally{
    clearTimeout(tm);
  }
}

/* ===================== MARKDOWN ===================== */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

function textBlock(src){
  const L=src.split("\n"),out=[];
  let i=0,para=[];

  const flush=()=>{
    if(para.length){
      out.push("<p>"+para.map(inline).join("<br>")+"</p>");
      para=[];
    }
  };

  while(i<L.length){
    const ln=L[i];

    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      flush();
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(ln);
      i+=2;
      const rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){
        rows.push(cells(L[i]));
        i++;
      }
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>');
      continue;
    }

    let m;
    if((m=ln.match(/^(#{1,4})\s+(.*)$/))){
      flush();
      out.push("<h"+(m[1].length<3?3:4)+">"+inline(m[2])+"</h"+(m[1].length<3?3:4)+">");
      i++;
      continue;
    }

    if(/^\s*[-*•]\s+/.test(ln)){
      flush();
      const it=[];
      while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){
        it.push(L[i].replace(/^\s*[-*•]\s+/,""));
        i++;
      }
      out.push("<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");
      continue;
    }

    if(/^\s*\d+[.)]\s+/.test(ln)){
      flush();
      const it=[];
      while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){
        it.push(L[i].replace(/^\s*\d+[.)]\s+/,""));
        i++;
      }
      out.push("<ol>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");
      continue;
    }

    if(!ln.trim()){
      flush();
      i++;
      continue;
    }

    para.push(ln);
    i++;
  }

  flush();
  return out.join("");
}

}

function md(src){
  const parts=[];
  let last=0,m;
  const re=/```([\w+-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g;

  while((m=re.exec(src))){
    if(m.index>last)parts.push(["t",src.slice(last,m.index)]);
    parts.push(["c",m[2].replace(/\n$/,""),m[1]]);
    last=re.lastIndex;
    if(m[0]==="")break;
  }

  if(last<src.length)parts.push(["t",src.slice(last)]);
  return parts.map(p=>p[0]==="c"?codeCard(p[1],p[2]):textBlock(p[1])).join("");
}

/* ===================== PRESSE-PAPIERS / PARTAGE ===================== */
async function copyText(s){
  try{
    await navigator.clipboard.writeText(s);
  }catch(e){
    const a=el("textarea");
    a.value=s;
    document.body.appendChild(a);
    a.select();
    try{document.execCommand("copy")}catch(_){}
    a.remove();
  }
  toast(t("copied"));
}

function download(src){
  const a=document.createElement("a");
  a.href=src;
  a.download="nova-image.png";
  a.target="_blank";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function shareImg(key){
  const src=await getImg(key);
  if(!src)return;

  try{
    const b=await(await fetch(src)).blob();
    const f=new File([b],"nova.png",{type:b.type||"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f]});
      return;
    }
  }catch(e){}

  if(navigator.share&&/^https?:/.test(src)){
    try{await navigator.share({url:src});return}catch(e){}
  }
  download(src);
}

async function shareText(s){
  if(navigator.share){
    try{await navigator.share({text:s});return}catch(e){}
  }
  copyText(s);
}

function srcsHtml(list){

  return '<div class="srcs">'+list.filter(s=>s&&/^https?:\/\//.test(s.url||"")).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}<small>${esc(s.source||"")}</small></a>`).join("")+"</div>";
}

function rowUser(m){

  d.innerHTML=`<div class="bubble">${m.imgKey?`<img class="pic" data-key="${m.imgKey}" alt="">`:""}${m.text?`<div class="t">${esc(m.text)}</div>`:""}</div><div class="st"></div>`+(m.imgKey?`<div class="note">${esc(t("noteImg"))}</div>`:"");

function refreshActions(){

function renderAll(){
  chat.innerHTML="";
  const list=cur();

  if(!list.length){
    chat.appendChild(el("div","empty",`<svg class="lg"><use href="#logo"/></svg><div>${esc(t("hello"))}</div>`));
  }

  list.forEach(m=>chat.appendChild(m.role==="user"?rowUser(m):rowBot(m)));
  refreshActions();
  followBottom=true;
  scrollDown(true);
}

function typeInto(target,text){
  return new Promise(res=>{
    let i=0;
    const step=Math.max(4,Math.ceil(text.length/90));

    (function tick(){
      i=Math.min(text.length,i+step);
      target.innerHTML=md(text.slice(0,i));
      scrollDown();

      if(i<text.length)setTimeout(tick,18);
      else res();
    })();
  });
}

function addTyping(){
  const r=el("div","row bot typing");
  r.innerHTML='<div class="bubble"><div class="lbl"></div><div class="dots"><i></i><i></i><i></i></div><div class="extra"></div></div>';
  chat.appendChild(r);

  const lbl=r.querySelector(".lbl");

  function showStatus(s){
    typingStatus.querySelector(".typing-label").textContent=s;
    typingStatus.classList.add("on");
  }

  showStatus(t("writing"));
  scrollDown();

  return {
    row:r,
    extra:r.querySelector(".extra"),
    setLabel:s=>{
      lbl.textContent=s;
      showStatus(s);
    },
    remove:()=>{
      r.remove();
      typingStatus.classList.remove("on");
    }
  };
}

/* ===================== ENVOI ===================== */
const RE_IMG=/^\s*(génère|genere|génére|crée|cree|dessine|fais|generate|draw|create|make)\s+(moi\s+)?(une?\s+|an?\s+|me\s+)?(image|photo|illustration|dessin|picture)/i;
const RE_WEB=/^\s*(cherche|recherche|search|\/web)\b/i;
const detect=txt=>imageMode?"image":RE_IMG.test(txt)?"image":RE_WEB.test(txt)?"web":"chat";

function historyFor(m){
  const list=cur();
  const idx=list.findIndex(x=>x.id===m.id);
  return list.slice(0,idx<0?list.length:idx).filter(x=>x.type!=="image"&&x.text).map(x=>({role:x.role,content:x.text})).slice(-20);
}

function outText(m){
  return m.text||"";
}

async function ackRead(m,ty){
  setSt(m.id,"sent");
  await sleep(250);
  setSt(m.id,"read");
  await sleep(250);
  setSt(m.id,"");
}

async function deliverText(m,ty,answer,sources){
  await ackRead(m,ty);

  const am={id:uid(),role:"assistant",text:answer,sources:sources||[],ts:Date.now()};
  cur().push(am);
  saveMsgs();

  const row=rowBot({...am,text:"",sources:[]});
  chat.appendChild(row);
  const target=row.querySelector(".t");

  await typeInto(target,answer);

  if(am.sources.length){
    row.querySelector(".bubble").insertAdjacentHTML("beforeend",srcsHtml(am.sources));
  }

  if(ty)ty.remove();
  scrollDown();
}

/* ===================== CHAT AVEC IMAGE JOINTE ===================== */
async function doChat(m,ty,msgText,sources){
  const image=m.imgKey?await getImg(m.imgKey):null;

  if(m.imgKey&&!image){
    throw new Error("Impossible de récupérer l'image jointe. Réessaie de l'ajouter.");
  }

  const payload={
    action:"chat",
    message:msgText!==undefined?msgText:outText(m),
    history:historyFor(m),
    mode:modeName(),
    behavior:behaviorText(),
    cerveauActif:!!cfg.brain
  };

  if(image)payload.image=image;

  const d=await api(payload);
  await deliverText(m,ty,d.answer||"",sources||d.sources||[]);
}

async function doWeb(m,ty){
  const q=m.text.replace(/^\s*(cherche|recherche|search|\/web)\s*(sur\s+(le\s+)?(web|internet)|web)?\s*[:\-]?\s*/i,"").trim()||m.text;

  ty.setLabel(t("w1"));
  ty.extra.innerHTML='<div class="pbar"></div>';

  const lang=({zh:"en",sw:"en"})[cfg.lang]||cfg.lang;
  const s=await api({action:"search",query:q,language:lang},30000);
  const src=Array.isArray(s.sources)?s.sources:[];

  ty.setLabel(t("w2"));

  for(const x of src.slice(0,6)){
    ty.extra.appendChild(el("div","pcard",esc(x.title||"")));
    scrollDown();
    await sleep(300);
  }

  ty.setLabel(t("w3"));

  let msg=m.text;
  if(src.length){
    msg+="\n\nRésultats Wikipédia réels (appuie-toi dessus, ne fabrique aucune source) :\n"+src.map(x=>"- "+x.title+" : "+x.snippet+" ("+x.url+")").join("\n");
  }else{
    msg+="\n\n(Aucune source Wikipédia trouvée pour cette recherche. Ne cite aucune source.)";
  }

  await doChat(m,ty,msg,src.map(x=>({title:x.title,url:x.url,source:x.source})));
}

async function genImage(prompt){
  try{
    return await api({action:"image",prompt},100000);
  }catch(e){
    await sleep(800);
    return await api({action:"image",prompt},100000);
  }
}

async function doImage(m,ty){
  ty.setLabel(t("i1"));

  const sk=el("div","skel");
  ty.extra.appendChild(sk);
  scrollDown();

  const t2=setTimeout(()=>ty.setLabel(t("i2")),1400);

  const prev=cur().filter(x=>x.role==="user"&&x.id!==m.id&&x.text).slice(-1)[0];
  const prompt=(prev&&m.text.length<40?"Contexte : "+prev.text.slice(0,200)+". Demande : ":"")+m.text;

  let d;
  try{
    d=await genImage(prompt);
  }finally{
    clearTimeout(t2);
  }

  if(!d||!d.image)throw new Error("Le serveur n'a pas retourné d'image.");

  ty.setLabel(t("i3"));
  await sleep(700);

  const key=uid();
  imgCache.set(key,d.image);
  idbPut({key,src:d.image,ts:Date.now(),kind:"generated"});

  setSt(m.id,"sent");
  await sleep(200);
  setSt(m.id,"read");
  await sleep(200);
  setSt(m.id,"");

  const am={id:uid(),role:"assistant",type:"image",text:t("imgDone"),imgKey:key,ts:Date.now()};
  cur().push(am);
  saveMsgs();

  const row=rowBot(am);
  ty.row.replaceWith(row);
  scrollDown();
}

async function run(m){
  busy=true;
  updSend();

  m.status="sending";
  setSt(m.id,"sending");

  const kind=detect(m.text);
  imageMode=false;
  renderChips();

  const ty=addTyping();

  try{
    if(kind==="image")await doImage(m,ty);
    else if(kind==="web")await doWeb(m,ty);
    else await doChat(m,ty);

    delete m.status;
  }catch(e){
    ty.remove();
    m.status="failed";
    setSt(m.id,"failed");
    errRow(errText(e));
  }finally{
    ty.remove();
    busy=false;
    updSend();
    saveMsgs();
    refreshActions();
    scrollDown();
  }
}

function handleSend(){
  if(busy)return;

  const text=inp.value.trim();
  if(!text){
    if(pending)toast(t("needMsg"));
    return;
  }

  if(!navigator.onLine){
    toast(t("offline"));
    return;
  }

  if(editingId){
    const i=cur().findIndex(x=>x.id===editingId);
    if(i>=0)cur().splice(i);
    editingId=null;
    renderAll();
  }

  const m={id:uid(),role:"user",text,ts:Date.now()};

  if(pending){
    m.imgKey=pending.key;
    pending=null;
  }

  cur().push(m);
  saveMsgs();

  const e=chat.querySelector(".empty");
  if(e)e.remove();

  chat.appendChild(rowUser(m));
  followBottom=true;
  scrollDown(true);

  inp.value="";
  autosize();
  renderChips();
  run(m);
}

function updSend(){
  sendB.disabled=busy;
}

$("#file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!f)return;

  if(!f.type.startsWith("image/")){
    toast("Choisis un fichier image.");
    return;
  }

  const rd=new FileReader();

  rd.onload=()=>{
    const im=new Image();

    im.onload=()=>{
      const sc=Math.min(1,1024/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);
      c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);

      const src=c.toDataURL("image/jpeg",.82),key=uid();
      imgCache.set(key,src);
      idbPut({key,src,ts:Date.now(),kind:"upload"});
      pending={key};
      renderChips();
      inp.focus();
    };

    im.onerror=()=>toast("Impossible de lire cette image.");
    im.src=rd.result;
  };

  rd.onerror=()=>toast("Impossible de charger cette image.");
  rd.readAsDataURL(f);
});

/* ===================== ACTIONS DANS LA CONVERSATION ===================== */
chat.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");
  if(!b)return;

  const a=b.dataset.a;
  const row=b.closest(".row");
  const id=row&&row.dataset.id;

  if(a==="viewcode"){
    const card=b.closest(".code");
    const code=decodeURIComponent(card.dataset.code);
    const lang=card.querySelector(".chead>span").textContent;
    openCodeViewer(code,lang);
  }
  else if(a==="copycode"){
    copyText(decodeURIComponent(b.closest(".code").dataset.code));
  }
  else if(a==="expand"){
    const pre=b.closest(".code").querySelector("pre");
    pre.classList.toggle("col");
  }
  else if(a==="editcode"){
    const code=decodeURIComponent(b.closest(".code").dataset.code);
    const head="Modifie ce code Python pour : ";
    inp.value=head+"\n\n```python\n"+code+"\n```";
    autosize();
    inp.focus();
    inp.setSelectionRange(head.length,head.length);
  }
  else if(a==="dl"){
    download(await getImg(b.dataset.key)||"");
  }
  else if(a==="sh"){
    shareImg(b.dataset.key);
  }
  else if(a==="up"||a==="down"){
    const m=cur().find(x=>x.id===id);
    if(!m)return;
    m.fb=m.fb===a?null:a;
    saveMsgs();
    refreshActions();
  }
  else if(a==="copy"){
    const m=cur().find(x=>x.id===id);
    if(!m)return;

    if(m.type==="image"){
      try{
        const src=await getImg(m.imgKey);
        const bl=await(await fetch(src)).blob();
        await navigator.clipboard.write([new ClipboardItem({[bl.type]:bl})]);
        toast(t("copied"));
      }catch(_){
        toast("Copie de l'image non prise en charge ici.");
      }
    }else{
      copyText(m.text);
    }
  }
  else if(a==="retry"){
    if(busy)return;
    const m=cur().find(x=>x.id===id);
    if(!m)return;
    chat.querySelectorAll(".row.err").forEach(r=>r.remove());
    run(m);
  }
});

        <span class="rowleft">
          ${ic(icon,22)}
          <span>${esc(titles[k])}</span>
        </span>
        ${ic("chev",18)}
      </button>
    `).join("");

  }else if(n==="appearance"){
    h=seg([
      ["mode","light",esc(t("light")),!cfg.dark],
      ["mode","dark",esc(t("dark")),cfg.dark]
    ]);

  }else if(n==="themes"){
    h='<div class="grid">'+THEMES.map((x,i)=>`<button class="sw ${i===cfg.theme?"sel":""}" data-a="theme" data-v="${i}"><i style="background:linear-gradient(135deg,${x[1]},${x[2]})"></i>${esc(x[0])}${cfg.themesDl.includes(i)?`<small>✓ ${esc(t("offThm"))}</small>`:""}</button>`).join("")+"</div>";

  }else if(n==="perso"){
    h=`<div class="h">${esc(t("fontsize"))}</div>`+
      seg([
        ["fs","big",esc(t("big")),cfg.fs==="big"],
        ["fs","mid",esc(t("mid")),cfg.fs==="mid"],
        ["fs","small",esc(t("small")),cfg.fs==="small"]
      ])+
      `<div class="h">${esc(t("sendicon"))}</div>`+
      seg([
        ["icon","plane",ic("plane",24)+"<br>"+esc(t("plane")),cfg.icon==="plane"],
        ["icon","arrow",ic("arrow",24)+"<br>"+esc(t("arrow")),cfg.icon==="arrow"]
      ])+
      `<div class="h">${esc(t("sendcolor"))}</div><input type="color" id="colpick" value="${cfg.sendColor}" style="width:100%;height:46px;border:0;border-radius:12px;background:none">`;

  }else if(n==="langs"){
    h=LANGS.map(([c,nm,f])=>`<button class="lang" data-a="lang" data-v="${c}"><span>${f} ${nm}</span>${cfg.lang===c?ic("check",20):""}</button>`).join("");

  }else if(n==="gallery"){
    h='<div class="grid" id="gal"></div>';

  }else if(n==="about"){
    h=`<div style="text-align:center;padding:20px 8px"><svg width="90" height="90"><use href="#logo"/></svg><p style="font-size:1.05em;line-height:1.6">${esc(t("aboutText"))}</p></div>`;
  }

  pb.innerHTML=h;

  if(n==="gallery"){
    idbAll().then(list=>{
      const g=$("#gal");
      if(!g)return;

      if(!list.length){
        g.outerHTML=`<p style="color:var(--mut);text-align:center">${esc(t("emptyGal"))}</p>`;
        return;
      }

      list.sort((a,b)=>b.ts-a.ts);
      g.innerHTML=list.map(o=>`<img class="gimg" data-view="${o.key}" alt="">`).join("");

      list.forEach(o=>{
        imgCache.set(o.key,o.src);
        const i=g.querySelector(`[data-view="${o.key}"]`);
        if(i)i.src=o.src;
      });
    });
  }

  const cp=$("#colpick");
  if(cp){
    cp.addEventListener("input",e=>{
      cfg.sendColor=e.target.value;
      applyAll();
    });
  }
}

$("#pb").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){
    openPage(g.dataset.go);
    return;
  }

  const v=e.target.closest("[data-view]");
  if(v){
    openViewer(v.dataset.view);
    return;
  }

  const b=e.target.closest("[data-a]");
  if(!b)return;

  const a=b.dataset.a,val=b.dataset.v;

  if(a==="mode"){
    cfg.dark=val==="dark";
    applyAll();
    renderPage();
  }
  else if(a==="fs"){
    cfg.fs=val;
    applyAll();
    renderPage();
  }
  else if(a==="icon"){
    cfg.icon=val;
    applyAll();
    renderPage();
  }
  else if(a==="theme"){
    const i=+val;
    withLoader(t("themeMsg"),()=>{
      cfg.theme=i;
      if(!cfg.themesDl.includes(i))cfg.themesDl.push(i);
      applyAll();
    });
  }
  else if(a==="lang"){
    withLoader(t("langMsg"),()=>{
      cfg.lang=val;
      applyAll();
    });
  }
});

$("#btnSet").addEventListener("click",()=>{
  pageStack=["settings"];
  renderPage();
});

$("#pback").addEventListener("click",()=>{
  pageStack.pop();
  renderPage();
});

function openViewer(key){
  getImg(key).then(src=>{
    if(!src)return;

    $("#vimg").src=src;
    $(".vb").innerHTML=`<button data-v="dl" aria-label="Télécharger">${ic("dl",22)}</button><button data-v="sh" aria-label="Partager">${ic("share",22)}</button><button data-v="x" aria-label="Fermer">${ic("x",22)}</button>`;
    $("#viewer").dataset.key=key;
    $("#viewer").classList.add("on");
  });
}

$("#viewer").addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"),k=$("#viewer").dataset.key;

  if(v&&v.dataset.v==="dl"){
    getImg(k).then(s=>s&&download(s));
    return;
  }

  if(v&&v.dataset.v==="sh"){
    shareImg(k);
    return;
  }

  if(e.target.id==="viewer"||(v&&v.dataset.v==="x")){
    $("#viewer").classList.remove("on");
  }
});

/* ===================== SAISIE ===================== */
sendB.addEventListener("click",handleSend);
inp.addEventListener("input",autosize);
inp.addEventListener("focus",()=>{
  setTimeout(()=>{
    fit();
    scrollDown();
  },300);
});

/* ===================== DÉMARRAGE SÉCURISÉ ===================== */
function startNova(){
  const app=$("#app");
  const splash=$("#splash");

  if(!app||!splash){
    console.error("NOVA : éléments de démarrage introuvables.");
    return;
  }

  /* Afficher l'application avant les opérations non essentielles. */
  app.classList.add("on");

  const safeStep=(label,fn)=>{
    try{
      fn();
    }catch(e){
      console.error("NOVA démarrage - "+label+":",e);
    }
  };

  safeStep("apparence",applyAll);
  safeStep("taille écran",fit);
  safeStep("bouton envoyer",updSend);
  safeStep("messages",renderAll);
  safeStep("modules",renderChips);

  /* Signaler que le démarrage a atteint sa fin. */
  document.body.dataset.novaReady="1";

  /* Toujours fermer l'écran de démarrage. */
  splash.classList.add("off");

  setTimeout(()=>{
    if(splash.parentNode)splash.remove();
  },650);

  console.log("NOVA AI : initialisation terminée.");
}

/* Ne pas exécuter applyAll() et fit() avant cette fonction. */
window.setTimeout(startNova,300);

})();
</script>

      console.warn("NOVA Service Worker:",e);
    });
  });
}
