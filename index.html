.st{font-size:12px;color:var(--mut);margin-top:3px;min-height:0}

.code pre code{background:none;padding:0;font-size:inherit;color:inherit}

async function api(body,ms){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms||60000);
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify(body),signal:c.signal});
    let d=null;try{d=await r.json()}catch(e){}
    if(!r.ok||!d||d.success===false)throw new Error((d&&d.error)||("HTTP "+r.status));
    return d;
  }finally{clearTimeout(tm)}
}

/* ===================== MARKDOWN ===================== */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function textBlock(src){
  const L=src.split("\n"),out=[];let i=0,para=[];
  const flush=()=>{if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[]}};
  while(i<L.length){
    const ln=L[i];
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      flush();
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(ln);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rows.push(cells(L[i]));i++}
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");
      continue;
    }
    let m;
    if((m=ln.match(/^(#{1,4})\s+(.*)$/))){flush();out.push("<h"+(m[1].length<3?3:4)+">"+inline(m[2])+"</h"+(m[1].length<3?3:4)+">");i++;continue}
    if(/^\s*[-*•]\s+/.test(ln)){flush();const it=[];while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*•]\s+/,""));i++}out.push("<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");continue}
    if(/^\s*\d+[.)]\s+/.test(ln)){flush();const it=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+[.)]\s+/,""));i++}out.push("<ol>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");continue}
    if(!ln.trim()){flush();i++;continue}
    para.push(ln);i++;
  }
  flush();return out.join("");
}
function codeCard(code,lang){
  lang=(lang||"").toLowerCase();
  const py=lang==="py"||lang==="python";
  const lines=code.split("\n").length;
  const btns=py
    ?`<button data-a="expand" aria-label="Voir tout">${ic("expand",18)}</button><button data-a="copycode" aria-label="Copier tout">${ic("copy",18)}</button><button data-a="editcode" aria-label="Modifier">${ic("edit",18)}</button>`
    :`<button data-a="copycode" aria-label="Copier">${ic("copy",18)}</button>`;
  return `<div class="code" data-code="${encodeURIComponent(code)}"><div class="chead"><span>${esc(lang||"code")}</span><span class="ca">${btns}</span></div><pre class="${py&&lines>10?"col":""}"><code>${esc(code)}</code></pre></div>`;
}
function md(src){
  const parts=[];let last=0,m;
  const re=/```([\w+-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g;
  while((m=re.exec(src))){
    if(m.index>last)parts.push(["t",src.slice(last,m.index)]);
    parts.push(["c",m[2].replace(/\n$/,""),m[1]]);
    last=re.lastIndex;
    if(m[0]==="")break;
  }
  if(last<src.length)parts.push(["t",src.slice(last)]);
  return parts.map(p=>p[0]==="c"?codeCard(p[1],p[2]):textBlock(p[1])).join("");
}

function typeInto(target,text){
  return new Promise(res=>{
    let i=0;const step=Math.max(4,Math.ceil(text.length/90));
    (function tick(){
      i=Math.min(text.length,i+step);
      target.innerHTML=md(text.slice(0,i));scrollDown();
      if(i<text.length)setTimeout(tick,18);else res();
    })();
  });
}

const RE_IMG=/^\s*(génère|genere|génére|crée|cree|dessine|fais|generate|draw|create|make)\s+(moi\s+)?(une?\s+|an?\s+|me\s+)?(image|photo|illustration|dessin|picture)/i;

async function deliverText(m,ty,answer,sources){
  await ackRead(m,ty);

  cur().push(am);saveMsgs();

  await typeInto(target,answer);
  if(am.sources.length){row.querySelector(".bubble").insertAdjacentHTML("beforeend",srcsHtml(am.sources))}
  scrollDown();
}

  const d=await api({action:"chat",message:msgText||outText(m),history:historyFor(m),mode:modeName(),behavior:behaviorText(),cerveauActif:!!cfg.brain});
  await deliverText(m,ty,d.answer||"",sources||d.sources||[]);
}
async function doWeb(m,ty){
  const q=m.text.replace(/^\s*(cherche|recherche|search|\/web)\s*(sur\s+(le\s+)?(web|internet)|web)?\s*[:\-]?\s*/i,"").trim()||m.text;
  ty.setLabel(t("w1"));ty.extra.innerHTML='<div class="pbar"></div>';
  const lang=({zh:"en",sw:"en"})[cfg.lang]||cfg.lang;
  const s=await api({action:"search",query:q,language:lang},30000);
  const src=Array.isArray(s.sources)?s.sources:[];
  ty.setLabel(t("w2"));
  for(const x of src.slice(0,6)){ty.extra.appendChild(el("div","pcard",esc(x.title||"")));scrollDown();await sleep(300)}
  ty.setLabel(t("w3"));
  let msg=m.text;
  if(src.length){
    msg+="\n\nRésultats Wikipédia réels (appuie-toi dessus, ne fabrique aucune source) :\n"+src.map(x=>"- "+x.title+" : "+x.snippet+" ("+x.url+")").join("\n");
  }else msg+="\n\n(Aucune source Wikipédia trouvée pour cette recherche. Ne cite aucune source.)";
  await doChat(m,ty,msg,src.map(x=>({title:x.title,url:x.url,source:x.source})));
}

  ty.setLabel(t("i1"));

  const t2=setTimeout(()=>ty.setLabel(t("i2")),1400);

  const prompt=(prev&&m.text.length<40?"Contexte : "+prev.text.slice(0,200)+". Demande : ":"")+m.text;
  let d;
  try{d=await genImage(prompt)}finally{clearTimeout(t2)}

  idbPut({key,src:d.image,ts:Date.now(),kind:"generated"});

  const am={id:uid(),role:"assistant",type:"image",text:t("imgDone"),imgKey:key,ts:Date.now()};
  cur().push(am);saveMsgs();
  const row=rowBot(am);ty.row.replaceWith(row);scrollDown();

  m.status="sending";setSt(m.id,"sending");
  const kind=detect(m.text);imageMode=false;renderChips();
  const ty=addTyping();
  try{
    if(kind==="image")await doImage(m,ty);
    else if(kind==="web")await doWeb(m,ty);
    else await doChat(m,ty);
    delete m.status;
  }catch(e){
    ty.remove();m.status="failed";setSt(m.id,"failed");errRow(errText(e));
  }finally{
    busy=false;updSend();saveMsgs();refreshActions();scrollDown();
  }
}
function handleSend(){
  if(busy)return;
  const text=inp.value.trim();
  if(!text){if(pending)toast(t("needMsg"));return}
  if(!navigator.onLine){toast(t("offline"));return}
  if(editingId){const i=cur().findIndex(x=>x.id===editingId);if(i>=0)cur().splice(i);editingId=null;renderAll()}
  const m={id:uid(),role:"user",text,ts:Date.now()};
  if(pending){m.imgKey=pending.key;pending=null}
  cur().push(m);saveMsgs();
  const e=chat.querySelector(".empty");if(e)e.remove();
  chat.appendChild(rowUser(m));scrollDown();
  inp.value="";autosize();renderChips();
  run(m);
}
function updSend(){sendB.disabled=busy}
function autosize(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px"}

/* ===================== CHIPS / MENU + ===================== */
function renderChips(){
  let h="";
  if(cfg.brain)h+=`<span class="chip">${ic("brain",14)}${esc(t("brain"))}<button data-c="brain" aria-label="Désactiver">${ic("x",12)}</button></span>`;
  if(cfg.project)h+=`<span class="chip">${ic("folder",14)}${esc(t("project"))}<button data-c="project" aria-label="Quitter">${ic("x",12)}</button></span>`;
  if(imageMode)h+=`<span class="chip">${ic("img",14)}${esc(t("imgMode"))}<button data-c="image" aria-label="Annuler">${ic("x",12)}</button></span>`;
  if(editingId)h+=`<span class="chip">${ic("edit",14)}${esc(t("editing"))}<button data-c="edit" aria-label="Annuler">${ic("x",12)}</button></span>`;
  if(pending)h+=`<span class="chip"><img data-key="${pending.key}" alt=""><button data-c="pending" aria-label="Retirer">${ic("x",12)}</button></span>`;
  chipsE.innerHTML=h;fillImgs(chipsE);
}
chipsE.addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(!b)return;const c=b.dataset.c;
  if(c==="brain"){cfg.brain=false;saveCfg()}
  if(c==="project"){cfg.project=false;saveCfg();renderAll()}
  if(c==="image")imageMode=false;
  if(c==="edit"){editingId=null;inp.value="";autosize()}
  if(c==="pending")pending=null;
  renderChips();
});
function buildMenu(){
  const it=[["gal","img",t("gallery")],["brain","brain",t("brain")],["project","folder",t("project")],["img","spark",t("genimg")]];
  menuE.innerHTML=it.map(([k,i,l])=>`<button data-m="${k}" class="${(k==="brain"&&cfg.brain)||(k==="project"&&cfg.project)?"act":""}">${ic(i,20)}<span>${esc(l)}</span></button>`).join("");
}
$("#plus").addEventListener("click",e=>{e.stopPropagation();buildMenu();menuE.classList.toggle("on")});
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))menuE.classList.remove("on")});
menuE.addEventListener("click",e=>{
  const b=e.target.closest("[data-m]");if(!b)return;const k=b.dataset.m;menuE.classList.remove("on");
  if(k==="gal")$("#file").click();
  if(k==="brain"){cfg.brain=!cfg.brain;saveCfg()}
  if(k==="project"){cfg.project=!cfg.project;saveCfg();renderAll()}
  if(k==="img"){imageMode=true;inp.focus()}
  renderChips();
});
$("#file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,1024/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const src=c.toDataURL("image/jpeg",.82),key=uid();
      imgCache.set(key,src);idbPut({key,src,ts:Date.now(),kind:"upload"});
      pending={key};renderChips();inp.focus();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
});

/* ===================== ACTIONS DANS LA CONVERSATION ===================== */
chat.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  const row=b.closest(".row");const id=row&&row.dataset.id;
  if(a==="expand"){const pre=b.closest(".code").querySelector("pre");pre.classList.toggle("col")}
  else if(a==="copycode"){copyText(decodeURIComponent(b.closest(".code").dataset.code))}
  else if(a==="editcode"){
    const code=decodeURIComponent(b.closest(".code").dataset.code);
    const head="Modifie ce code Python pour : ";
    inp.value=head+"\n\n```python\n"+code+"\n```";autosize();inp.focus();inp.setSelectionRange(head.length,head.length);
  }
  else if(a==="dl")download(await getImg(b.dataset.key)||"");
  else if(a==="sh")shareImg(b.dataset.key);
  else if(a==="up"||a==="down"){
    const m=cur().find(x=>x.id===id);if(!m)return;
    m.fb=m.fb===a?null:a;saveMsgs();refreshActions();
  }
  else if(a==="copy"){
    const m=cur().find(x=>x.id===id);if(!m)return;
    if(m.type==="image"){
      try{const src=await getImg(m.imgKey);const bl=await(await fetch(src)).blob();await navigator.clipboard.write([new ClipboardItem({[bl.type]:bl})]);toast(t("copied"))}catch(_){toast("Copie de l'image non prise en charge ici.")}
    }else copyText(m.text);
  }
  else if(a==="retry"){
    if(busy)return;const m=cur().find(x=>x.id===id);if(!m)return;
    chat.querySelectorAll(".row.err").forEach(r=>r.remove());run(m);
  }
});

/* ===================== APPUI LONG SUR MESSAGE UTILISATEUR ===================== */
let lp=null;
chat.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".row.user .bubble");if(!b)return;
  const id=b.parentElement.dataset.id;
  lp=setTimeout(()=>{lp=null;openSheet(id)},500);
});
["pointerup","pointermove","pointercancel"].forEach(ev=>chat.addEventListener(ev,()=>{if(lp){clearTimeout(lp);lp=null}}));
function openSheet(id){
  const m=cur().find(x=>x.id===id);if(!m)return;
  $("#sheetIn").innerHTML=`<button data-s="edit">${ic("edit",20)}${esc(t("edit"))}</button><button data-s="copy">${ic("copy",20)}${esc(t("copy"))}</button><button data-s="share">${ic("share",20)}${esc(t("share"))}</button>`;
  $("#sheet").classList.add("on");$("#sheet").dataset.id=id;
}
$("#sheet").addEventListener("click",e=>{
  const sh=$("#sheet"),id=sh.dataset.id;const b=e.target.closest("[data-s]");
  sh.classList.remove("on");if(!b)return;
  const m=cur().find(x=>x.id===id);if(!m)return;
  if(b.dataset.s==="copy")copyText(m.text);
  if(b.dataset.s==="share")shareText(m.text);
  if(b.dataset.s==="edit"){if(busy)return;editingId=id;inp.value=m.text;autosize();inp.focus();renderChips()}
});

/* ===================== PARAMÈTRES (pages) ===================== */
function applyAll(){
  const th=THEMES[cfg.theme]||THEMES[0],r=document.documentElement;
  r.dataset.mode=cfg.dark?"dark":"light";
  r.style.setProperty("--acc",th[1]);
  r.style.setProperty("--bg",cfg.dark?th[2]:th[3]);
  r.style.setProperty("--fs",{big:"18px",mid:"16px",small:"14px"}[cfg.fs]||"16px");
  r.style.setProperty("--send",cfg.sendColor);
  sendB.innerHTML=ic(cfg.icon==="arrow"?"arrow":"plane",24);
  $("#plus").innerHTML=ic("plus",24);$("#btnSet").innerHTML=ic("gear",22);$("#pback").innerHTML=ic("back",24);
  inp.placeholder=t("ph");document.documentElement.lang=cfg.lang;
  saveCfg();
}
function withLoader(msg,fn){
  $("#ld .m").textContent=msg;$("#ld").classList.add("on");
  setTimeout(()=>{fn();$("#ld").classList.remove("on");renderPage();renderAll();renderChips()},2500);
}
function openPage(n){pageStack.push(n);renderPage()}
function renderPage(){
  const pg=$("#page");
  if(!pageStack.length){pg.classList.remove("on");return}
  pg.classList.add("on");
  const n=pageStack[pageStack.length-1],pb=$("#pb");let h="";
  const titles={settings:t("settings"),appearance:t("appearance"),themes:t("themes"),perso:t("perso"),langs:t("langs"),gallery:t("gallery"),about:t("about")};
  $("#ptitle").textContent=titles[n];
  const seg=(items)=>'<div class="seg">'+items.map(([a,v,l,s])=>`<button data-a="${a}" data-v="${v}" class="${s?"sel":""}">${l}</button>`).join("")+"</div>";
  if(n==="settings"){
    h=[["appearance"],["themes"],["perso"],["langs"],["gallery"],["about"]].map(([k])=>`<button class="rowbtn" data-go="${k}"><span>${esc(titles[k])}</span>${ic("chev",18)}</button>`).join("");
  }else if(n==="appearance"){
    h=seg([["mode","light",esc(t("light")),!cfg.dark],["mode","dark",esc(t("dark")),cfg.dark]]);
  }else if(n==="themes"){
    h='<div class="grid">'+THEMES.map((x,i)=>`<button class="sw ${i===cfg.theme?"sel":""}" data-a="theme" data-v="${i}"><i style="background:linear-gradient(135deg,${x[1]},${x[2]})"></i>${esc(x[0])}${cfg.themesDl.includes(i)?`<small>✓ ${esc(t("offThm"))}</small>`:""}</button>`).join("")+"</div>";
  }else if(n==="perso"){
    h=`<div class="h">${esc(t("fontsize"))}</div>`+seg([["fs","big",esc(t("big")),cfg.fs==="big"],["fs","mid",esc(t("mid")),cfg.fs==="mid"],["fs","small",esc(t("small")),cfg.fs==="small"]])
     +`<div class="h">${esc(t("sendicon"))}</div>`+seg([["icon","plane",ic("plane",24)+"<br>"+esc(t("plane")),cfg.icon==="plane"],["icon","arrow",ic("arrow",24)+"<br>"+esc(t("arrow")),cfg.icon==="arrow"]])
     +`<div class="h">${esc(t("sendcolor"))}</div><input type="color" id="colpick" value="${cfg.sendColor}" style="width:100%;height:46px;border:0;border-radius:12px;background:none">`;
  }else if(n==="langs"){
    h=LANGS.map(([c,nm,f])=>`<button class="lang" data-a="lang" data-v="${c}"><span>${f} ${nm}</span>${cfg.lang===c?ic("check",20):""}</button>`).join("");
  }else if(n==="gallery"){
    h='<div class="grid" id="gal"></div>';
  }else if(n==="about"){
    h=`<div style="text-align:center;padding:20px 8px"><svg width="90" height="90"><use href="#logo"/></svg><p style="font-size:1.05em;line-height:1.6">${esc(t("aboutText"))}</p></div>`;
  }
  pb.innerHTML=h;
  if(n==="gallery")idbAll().then(list=>{
    const g=$("#gal");if(!g)return;
    if(!list.length){g.outerHTML=`<p style="color:var(--mut);text-align:center">${esc(t("emptyGal"))}</p>`;return}
    list.sort((a,b)=>b.ts-a.ts);
    g.innerHTML=list.map(o=>`<img class="gimg" data-view="${o.key}" alt="">`).join("");
    list.forEach(o=>{imgCache.set(o.key,o.src);const i=g.querySelector(`[data-view="${o.key}"]`);if(i)i.src=o.src});
  });
  const cp=$("#colpick");if(cp)cp.addEventListener("input",e=>{cfg.sendColor=e.target.value;applyAll()});
}
$("#pb").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){openPage(g.dataset.go);return}
  const v=e.target.closest("[data-view]");if(v){openViewer(v.dataset.view);return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,val=b.dataset.v;
  if(a==="mode"){cfg.dark=val==="dark";applyAll();renderPage()}
  else if(a==="fs"){cfg.fs=val;applyAll();renderPage()}
  else if(a==="icon"){cfg.icon=val;applyAll();renderPage()}
  else if(a==="theme"){const i=+val;withLoader(t("themeMsg"),()=>{cfg.theme=i;if(!cfg.themesDl.includes(i))cfg.themesDl.push(i);applyAll()})}
  else if(a==="lang"){withLoader(t("langMsg"),()=>{cfg.lang=val;applyAll()})}
});
$("#btnSet").addEventListener("click",()=>{pageStack=["settings"];renderPage()});
$("#pback").addEventListener("click",()=>{pageStack.pop();renderPage()});
function openViewer(key){
  getImg(key).then(src=>{
    if(!src)return;$("#vimg").src=src;
    $(".vb").innerHTML=`<button data-v="dl" aria-label="Télécharger">${ic("dl",22)}</button><button data-v="sh" aria-label="Partager">${ic("share",22)}</button><button data-v="x" aria-label="Fermer">${ic("x",22)}</button>`;
    $("#viewer").dataset.key=key;$("#viewer").classList.add("on");
  });
}
$("#viewer").addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"),k=$("#viewer").dataset.key;
  if(v&&v.dataset.v==="dl"){getImg(k).then(s=>s&&download(s));return}
  if(v&&v.dataset.v==="sh"){shareImg(k);return}
  if(e.target.id==="viewer"||(v&&v.dataset.v==="x"))$("#viewer").classList.remove("on");
});

/* ===================== SAISIE ===================== */
sendB.addEventListener("click",handleSend);
inp.addEventListener("input",autosize);
inp.addEventListener("focus",()=>setTimeout(()=>{fit();scrollDown()},300));

/* ===================== DÉMARRAGE ===================== */
applyAll();fit();updSend();
setTimeout(()=>{
  $("#app").classList.add("on");fit();
  try{renderAll();renderChips()}catch(e){console.error(e)}   // un échec ici ne bloque jamais la conversation
  $("#splash").classList.add("off");
  setTimeout(()=>$("#splash").remove(),600);
},3000);

})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
